<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Centro de Control del Turno - Ironwall</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    max-width: 600px;
    margin: 0 auto;
    padding: 12px 12px 20px;
    background: #fafafa;
    color: #222;
  }
  
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  
  .btnHome {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #ffffff;
    color: #222;
    text-decoration: none;
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    box-shadow: 0 2px 6px rgba(0,0,0,.08);
  }

  h1 { font-size: 16px; margin: 0; display: inline-block; }
  p.sub { color: #666; margin: 0; font-size: 11px; }

  .estado-general {
    text-align: center;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 10px;
  }
  .estado-general.ok { background: #e8f6ee; color: #1e824c; }
  .estado-general.alerta { background: #fdecea; color: #c0392b; }

  /* Estructura de Secciones Compactas */
  .seccion { margin-top: 10px; }
  .seccion h2 { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: #888; margin: 0 0 4px 0; }

  /* Grid de KPIs */
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }

  .kpi {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
  }
  .kpi .label { font-size: 10px; color: #555; line-height: 1.1; }
  .kpi .valor { font-size: 15px; font-weight: 700; margin-top: 2px; }
  .kpi.ok { border-color: #b7e4c7; background: #f4fbf7; }
  .kpi.ok .valor { color: #1e824c; }
  .kpi.alerta { border-color: #f5c6c0; background: #fdf5f4; }
  .kpi.alerta .valor { color: #c0392b; }

  .desglose {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 6px 10px;
    margin-top: 6px;
    font-size: 11px;
  }
  .desglose div { display: flex; justify-content: space-between; padding: 1px 0; }

  /* Bitácora Ultra Compacta */
  .bitacora-box {
    margin-top: 6px;
    display: flex;
    gap: 6px;
  }
  .bitacora-box textarea {
    flex: 1;
    height: 38px;
    min-height: 38px;
    padding: 6px;
    font-size: 11px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-family: inherit;
    resize: none;
  }
  .bitacora-controles {
    display: flex;
    flex-direction: column;
    gap: 4px;
    width: 110px;
  }
  .bitacora-controles select, .bitacora-controles button {
    width: 100%;
    padding: 4px;
    font-size: 10px;
    border-radius: 6px;
  }
  .bitacora-controles button {
    background: #1a1a1a;
    color: #fff;
    border: none;
    font-weight: 600;
    cursor: pointer;
  }

  #cargando { text-align: center; color: #888; margin-top: 20px; font-size: 12px; }
  #error { color: #c0392b; font-size: 11px; margin-top: 6px; display: none; }
  #actualizado { text-align: center; color: #999; font-size: 10px; margin-top: 10px; }
</style>
</head>
<body>

  <div class="top-bar">
    <div>
      <h1>Centro de Control</h1>
      <p class="sub" id="fechaHoy"></p>
    </div>
    <a href="portal.html" class="btnHome">🏠 Home</a>
  </div>

  <div id="cargando">Cargando datos del turno...</div>
  
  <div id="contenido" style="display:none">

    <div id="estadoGeneral" class="estado-general">Revisando...</div>

    <!-- ACTIVIDAD -->
    <div class="seccion">
      <h2>Actividad de hoy</h2>
      <div class="grid-3">
        <div class="kpi">
          <span class="label">Visitas</span>
          <span class="valor" id="visitasHoy">-</span>
        </div>
        <div class="kpi">
          <span class="label">Clientes</span>
          <span class="valor" id="clientesDistintosHoy">-</span>
        </div>
        <div class="kpi">
          <span class="label">Nuevos</span>
          <span class="valor" id="clientesNuevosHoy">-</span>
        </div>
      </div>
    </div>

    <!-- CAJA -->
    <div class="seccion">
      <h2>Caja y Arqueo</h2>
      <div class="grid-2">
        <div class="kpi">
          <span class="label">Ingresos</span>
          <span class="valor" id="ingresosHoy">-</span>
        </div>
        <div class="kpi">
          <span class="label">Egresos</span>
          <span class="valor" id="egresosHoy">-</span>
        </div>
      </div>
      <div class="desglose" id="desgloseMedioPago"></div>
    </div>

    <!-- PENDIENTES DE CIERRE -->
    <div class="seccion">
      <h2>Pendientes de Cierre</h2>
      <div class="grid-3">
        <div class="kpi" id="kpiMensajes">
          <span class="label">Msjs Campaña</span>
          <span class="valor" id="mensajesPendientes">-</span>
        </div>
        <div class="kpi" id="kpiStock">
          <span class="label">Stock Bajo</span>
          <span class="valor" id="stockBajo">-</span>
        </div>
        <div class="kpi" id="kpiIncidentes">
          <span class="label">Incidentes</span>
          <span class="valor" id="incidentesHoy">-</span>
        </div>
      </div>
    </div>

    <!-- BITÁCORA DE TURNO -->
    <div class="seccion">
      <h2>Bitácora de turno</h2>
      <div id="notasAnteriores"></div>

      <div class="bitacora-box">
        <textarea id="notaTurnoTexto" placeholder="Observaciones del turno..."></textarea>
        <div class="bitacora-controles">
          <select id="notaTurnoStaff">
            <option value="">-- Nombre --</option>
          </select>
          <button id="btnNotaTurno" onclick="guardarNotaTurno()">Guardar</button>
        </div>
      </div>
      <div id="mensajeNotaTurno" style="font-size:11px; margin-top:4px; display:none;"></div>
    </div>

  </div>

  <div id="error"></div>
  <div id="actualizado"></div>

  <script>
    const API_URL_CLIENTES = 'https://script.google.com/macros/s/AKfycbz7SvOi2JmjpRtLACJNVvzFtWKKeo9wUitjriZjW-JgNqPeFVliydyVy3NuNT6yiOcRbQ/exec';
    const API_URL_FINANZAS = 'https://script.google.com/macros/s/AKfycbx29m90hiJKT3UKP2uJCJSm5XcEfjWwCcMYokLnw54RBTpyGLierukwYNYdCJxCiEaKng/exec';
    const API_URL_INVENTARIO = 'https://script.google.com/macros/s/AKfycbxZyZAGtj2ifZ9lmhwX__tTVdydaYManjO2_Ff_ScIYtV5vpsFkQHzzKaX7ADcVXOysSw/exec';
    const API_URL_INCIDENTES = 'https://script.google.com/macros/s/AKfycbzFsCtTBbmVm9fbG-subMfxddgWxWQi5rsbadTZHTIWATGQxW-xEtfLO-6QuwBK-XhRWA/exec';

    function llamarApi(url, accion, payload) {
      const controlador = new AbortController();
      const timeoutId = setTimeout(function () { controlador.abort(); }, 15000);
      return fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: accion, payload: payload || {} }),
        signal: controlador.signal
      }).then(function (r) {
        clearTimeout(timeoutId);
        return r.text();
      }).then(function (texto) {
        try { return JSON.parse(texto); }
        catch (e) { return { ok: false, error: 'Respuesta inválida' }; }
      }).catch(function (err) {
        return { ok: false, error: err.message };
      });
    }

    function formatearPesos(numero) {
      return '$' + Math.round(numero).toLocaleString('es-CL');
    }

    function marcarKpi(idElemento, cantidad, umbralAlerta) {
      const kpi = document.getElementById(idElemento);
      kpi.className = cantidad >= umbralAlerta ? 'kpi alerta' : 'kpi ok';
    }

    function cargar() {
      document.getElementById('fechaHoy').textContent = new Date().toLocaleDateString('es-CL', {
        weekday: 'short', month: 'short', day: 'numeric'
      });
    
      Promise.all([
        llamarApi(API_URL_CLIENTES, 'obtenerResumenDiaClientes', {}),
        llamarApi(API_URL_FINANZAS, 'obtenerResumenDiaFinanzas', {}),
        llamarApi(API_URL_CLIENTES, 'contarMensajesPendientes', {}),
        llamarApi(API_URL_INVENTARIO, 'listarProductosTienda', {}),
        llamarApi(API_URL_INVENTARIO, 'listarEquipamientoInterno', {}),
        llamarApi(API_URL_INCIDENTES, 'contarIncidentesAbiertosHoy', {})
      ]).then(function (resultados) {
        const respClientes = resultados[0];
        const respFinanzas = resultados[1];
        const respMensajes = resultados[2];
        const respTienda = resultados[3];
        const respEquipo = resultados[4];
        const respIncidentes = resultados[5];
    
        document.getElementById('cargando').style.display = 'none';
        document.getElementById('contenido').style.display = 'block';
    
        let hayAlertas = false;
    
        if (respClientes.ok) {
          document.getElementById('visitasHoy').textContent = respClientes.data.visitasHoy;
          document.getElementById('clientesDistintosHoy').textContent = respClientes.data.clientesDistintosHoy;
          document.getElementById('clientesNuevosHoy').textContent = respClientes.data.clientesNuevosHoy;
        }
    
        if (respFinanzas.ok) {
          document.getElementById('ingresosHoy').textContent = formatearPesos(respFinanzas.data.ingresosHoy);
          document.getElementById('egresosHoy').textContent = formatearPesos(respFinanzas.data.egresosHoy);
    
          const porMedioPago = respFinanzas.data.ingresosPorMedioPago || {};
          const desglose = document.getElementById('desgloseMedioPago');
          const claves = Object.keys(porMedioPago);
          if (claves.length === 0) {
            desglose.innerHTML = '<div>Sin ingresos hoy</div>';
          } else {
            desglose.innerHTML = claves.map(function (medio) {
              return '<div><span>' + medio + '</span><span>' + formatearPesos(porMedioPago[medio]) + '</span></div>';
            }).join('');
          }
        }
    
        if (respMensajes.ok) {
          document.getElementById('mensajesPendientes').textContent = respMensajes.data;
          marcarKpi('kpiMensajes', respMensajes.data, 1);
          if (respMensajes.data >= 1) hayAlertas = true;
        }
    
        let totalBajoStock = 0;
        if (respTienda.ok && Array.isArray(respTienda.data)) {
          respTienda.data.forEach(function (p) {
            if (Number(p.stockActual) <= Number(p.stockMinimo)) totalBajoStock++;
          });
        }
        if (respEquipo.ok && Array.isArray(respEquipo.data)) {
          respEquipo.data.forEach(function (p) {
            if (Number(p.stockActual) <= Number(p.stockMinimo)) totalBajoStock++;
          });
        }
    
        document.getElementById('stockBajo').textContent = totalBajoStock;
        marcarKpi('kpiStock', totalBajoStock, 1);
        if (totalBajoStock >= 1) hayAlertas = true;
    
        if (respIncidentes.ok) {
          document.getElementById('incidentesHoy').textContent = respIncidentes.data;
        }
    
        const estadoDiv = document.getElementById('estadoGeneral');
        if (hayAlertas) {
          estadoDiv.className = 'estado-general alerta';
          estadoDiv.textContent = '⚠️ Pendientes por revisar antes de cerrar';
        } else {
          estadoDiv.className = 'estado-general ok';
          estadoDiv.textContent = '✅ Todo listo para cerrar turno';
        }
    
        document.getElementById('actualizado').textContent = 'Actualizado: ' + new Date().toLocaleTimeString('es-CL');
      }).catch(function (err) {
        document.getElementById('cargando').style.display = 'none';
        document.getElementById('error').style.display = 'block';
        document.getElementById('error').textContent = 'Error: ' + err.message;
      });
    }

    function guardarCache_(clave, datos) {
      try { localStorage.setItem(clave, JSON.stringify({ datos: datos, guardado: Date.now() })); } catch (e) {}
    }
    function leerCache_(clave) {
      try {
        const crudo = localStorage.getItem(clave);
        if (!crudo) return null;
        const parsed = JSON.parse(crudo);
        if (Date.now() - parsed.guardado > 12 * 60 * 60 * 1000) return null;
        return parsed.datos;
      } catch (e) { return null; }
    }

    function cargarStaffTurno() {
      const select = document.getElementById('notaTurnoStaff');
      function pintar(nombres) {
        select.innerHTML = '<option value="">-- Staff --</option>' +
          nombres.map(function (n) { return '<option value="' + n + '">' + n + '</option>'; }).join('');
      }
      const cache = leerCache_('staff_resumen_cache');
      if (cache) pintar(cache);

      llamarApi(API_URL_CLIENTES, 'listarStaff', {})
        .then(function (resp) {
          if (resp.ok && resp.data) {
            pintar(resp.data);
            guardarCache_('staff_resumen_cache', resp.data);
          }
        });
    }

    function cargarNotasAnteriores() {
      llamarApi(API_URL_CLIENTES, 'listarNotasTurnoRecientes', {})
        .then(function (resp) {
          const contenedor = document.getElementById('notasAnteriores');
          if (!resp.ok || !resp.data || resp.data.length === 0) {
            contenedor.innerHTML = '<p style="font-size:10px;color:#888;margin:2px 0;">Sin notas recientes.</p>';
            return;
          }
          contenedor.innerHTML = resp.data.slice(0, 1).map(function (n) {
            return '<div class="desglose"><div><strong>' + n.staff + '</strong><span>' + new Date(n.fecha).toLocaleTimeString('es-CL', {hour:'2-digit', minute:'2-digit'}) + '</span></div>'
              + '<div style="display:block;padding-top:1px;color:#555;">' + n.nota + '</div></div>';
          }).join('');
        });
    }

    function guardarNotaTurno() {
      const nota = document.getElementById('notaTurnoTexto').value.trim();
      const staff = document.getElementById('notaTurnoStaff').value;
      const btn = document.getElementById('btnNotaTurno');
      const mensaje = document.getElementById('mensajeNotaTurno');
      mensaje.style.display = 'none';

      if (!nota || !staff) {
        mensaje.style.display = 'block';
        mensaje.style.color = '#c0392b';
        mensaje.textContent = 'Escribe una nota y elige tu nombre.';
        return;
      }

      btn.disabled = true;
      btn.textContent = '...';

      fetch(API_URL_CLIENTES, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'agregarNotaTurno', payload: { nota: nota, staff: staff } })
      }).then(function (r) { return r.text(); })
        .then(function (texto) {
          const resp = JSON.parse(texto);
          if (!resp.ok) throw new Error(resp.error);
          document.getElementById('notaTurnoTexto').value = '';
          mensaje.style.display = 'block';
          mensaje.style.color = '#1e824c';
          mensaje.textContent = '✅ Guardado.';
          cargarNotasAnteriores();
        })
        .catch(function (err) {
          mensaje.style.display = 'block';
          mensaje.style.color = '#c0392b';
          mensaje.textContent = 'Error al guardar.';
        })
        .finally(function () {
          btn.disabled = false;
          btn.textContent = 'Guardar';
        });
    }

    cargar();
    cargarStaffTurno();
    cargarNotasAnteriores();
  </script>
</body>
</html>
