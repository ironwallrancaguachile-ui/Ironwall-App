<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Ironwall - Check-in</title>
<style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-SemiBold.ttf");
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* --- CABECERA Y NAVEGACIÓN --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }
    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px; /* Espacio entre el logo y el texto */
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }
    
    /* Control del tamaño del logo dentro del botón */
    .logo-btn {
      height: 36px;
      width: auto; /* Permite que el ancho se ajuste solo */
      object-fit: contain;
      transform: scale(1.8); /* Agranda la imagen visualmente un 40% omitiendo sus bordes vacíos */
      transform-origin: center;
    }
    
    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }
 

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* --- DISPOSICIÓN EN FILA DE TARJETAS SUPERIORES --- */
    .grid-superior {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      margin-bottom: 20px;
      align-items: stretch;
    }

    /* --- TARJETAS --- */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      border: 1px solid #e8ecef;
    }

    .titulo-card {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      letter-spacing: .5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* --- INDICADORES --- */
    .indicadores {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 10px;
    }

    .indicador-item {
      background: #f8f9fa;
      border: 1px solid #edf0f2;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
    }

    .indicador-item span {
      font-size: 11px;
      color: #666;
      margin-bottom: 2px;
    }

    .indicador-item strong {
      font-size: 18px;
      font-weight: 700;
      color: #111;
    }

    /* --- FORMULARIOS --- */
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input,
    select {
      width: 100%;
      height: 41px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    /* --- BOTONES --- */
    button,
    .btn {
      width: 100%;
      height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-consultar {
      background-color: #e0e0e0;
      color: #333333;
    }

    .btn-consultar:hover {
      background-color: #d0d0d0;
    }

    .btn-danger {
      background-color: #fee2e2;
      color: #dc2626;
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
      width: auto;
      border-radius: 6px;
    }

    .btn-danger:hover {
      background-color: #fca5a5;
    }

    /* --- MENSAJES --- */
    .mensaje {
      margin-top: 10px;
      font-weight: 700;
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
    }

    .exito {
      background: #dcfce7;
      color: #15803d;
    }

    .error {
      background: #fee2e2;
      color: #dc2626;
    }

    /* --- CONSULTA Y TABLA --- */
    .fila-consulta {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tabla-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf0f2;
      text-align: left;
    }

    th {
      color: #666;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    /* Estilos para los badges de estado */
.badge-estado {
  font-weight: 600;
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 6px;
  display: inline-block;
  text-transform: uppercase;
}

.estado-reservada {
  background-color: #fef3c7;
  color: #92400e;
}

.estado-checkin {
  background-color: #dcfce7;
  color: #15803d;
}

.estado-cancelada, .estado-noshow {
  background-color: #fee2e2;
  color: #dc2626;
}

    /* --- RESPONSIVE --- */
    @media (max-width: 820px) {
      .grid-superior {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }

      .card {
        padding: 16px;
      }
    }
</style>
</head>

<body>
  <div class="container">
    <!-- NAVEGACIÓN Y CABECERA -->
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome">
          <img src="img/logosn.png" alt="Logo" class="logo-btn">
          <span>←Inicio</span>
      </a>
    </div>
 <div class="full-width">
      <div class="card">
            <h1>Check-in</h1>
            <p>Ingresa el ID de reserva.</p>
            <input  id="reservaId"  placeholder="RES-XXXXXXXX"> 
      </div>
 </div>
 <div class="form-grid">
      <div class="card">
            <button  class= "btnAgregar" onclick="hacerCheckin()">Confirmar ingreso</button>
      </div>
      <div class="card">
            <button  class= "btnConfirmar" onclick="hacerCheckout()">Registrar salida</button>
            <div  id="resultado"></div>
      </div>
</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


async function api(body) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body:
          JSON.stringify(body)
      }
    );

  return response.json();
}


async function hacerCheckin() {
  const reservaId =
    document
      .getElementById('reservaId')
      .value
      .trim();
  if (!reservaId) {return; }
  const resultado =  await api({ action: 'checkin', reservaId, usuario: 'STAFF'  });
  document
    .getElementById( 'resultado' ).textContent =  resultado.mensaje;
}

async function hacerCheckout() {
  const reservaId =
    document
      .getElementById( 'reservaId' )
      .value
      .trim();
  if (!reservaId) { return; }
  const resultado =
    await api({ action:'checkout', reservaId, usuario:  'STAFF' });
  document
    .getElementById( 'resultado' ).textContent = resultado.mensaje;
}

</script>

</body>

</html>
