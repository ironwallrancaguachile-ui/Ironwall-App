<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironwall - Check-in</title>
  <style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* --- CABECERA Y NAVEGACIÓN --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }

    .logo-btn {
      height: 36px;
      width: auto;
      object-fit: contain;
      transform: scale(1.8);
      transform-origin: center;
    }

    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* --- TARJETAS --- */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      border: 1px solid #e8ecef;
    }

    .titulo-card {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      letter-spacing: .5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* --- FORMULARIOS --- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input,
    select {
      width: 100%;
      height: 41px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    /* --- BOTONES --- */
    button,
    .btn {
      width: 100%;
      height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-primary {
      background-color: #191919;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #333333;
    }

    .btn-consultar {
      background-color: #e0e0e0;
      color: #333333;
    }

    .btn-consultar:hover {
      background-color: #d0d0d0;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* --- MENSAJES --- */
    .mensaje {
      margin-top: 14px;
      font-weight: 700;
      font-size: 13px;
      padding: 12px;
      border-radius: 8px;
    }

    .exito {
      background: #dcfce7;
      color: #15803d;
    }

    .error {
      background: #fee2e2;
      color: #dc2626;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }

      .card {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- NAVEGACIÓN Y CABECERA -->
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome">
        <img src="img/logosn.png" alt="Logo" class="logo-btn">
        <span>← Inicio</span>
      </a>
    </div>

    <h1>Check-in / Check-out</h1>
    <p class="subtitulo">Ingresa el ID de la reserva para registrar asistencia o salida</p>

    <!-- CARD PRINCIPAL DE ACCIONES -->
    <div class="card">
      <div class="titulo-card">Registro de Acceso</div>
      
      <div style="margin-bottom: 16px;">
        <label for="reservaId">ID de Reserva</label>
        <input id="reservaId" placeholder="Ej: RES-XXXXXXXX" style="text-transform: uppercase;" autocomplete="off">
      </div>

      <div class="form-grid">
        <div>
          <button class="btn-primary" id="btnCheckin" onclick="hacerCheckin()">Confirmar ingreso</button>
        </div>
        <div>
          <button class="btn-consultar" id="btnCheckout" onclick="hacerCheckout()">Registrar salida</button>
        </div>
      </div>

      <div id="resultado" class="mensaje" style="display: none;"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';

    // Bloqueo simple: mientras una acción (checkin o checkout) está en
    // curso sobre un ID, se deshabilitan AMBOS botones, para evitar que
    // se disparen las dos acciones casi al mismo tiempo sobre la misma
    // reserva (por ejemplo, doble clic o clic accidental en el otro botón).
    let accionEnCurso = false;

    async function api(body, opciones = {}) {
      const timeout = opciones.timeout || 15000;
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeout);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(body),
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(`Error HTTP ${response.status}`);
        }

        return await response.json();

      } catch (error) {
        if (error.name === 'AbortError') {
          throw new Error('La solicitud tardó demasiado. Intenta nuevamente.');
        }
        throw error;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function mostrarMensaje(texto, esError = false) {
      const resDiv = document.getElementById('resultado');
      resDiv.className = `mensaje ${esError ? 'error' : 'exito'}`;
      resDiv.textContent = texto;
      resDiv.style.display = 'block';
    }

    function obtenerReservaIdNormalizado() {
      // FIX: el CSS solo cambia cómo se VE el texto, no el valor real.
      // Hay que normalizar a mayúsculas aquí antes de enviarlo, porque
      // el backend compara los IDs de forma sensible a mayúsculas.
      const input = document.getElementById('reservaId');
      const valor = input.value.trim().toUpperCase();
      input.value = valor; // refleja también en pantalla lo que se envía
      return valor;
    }

    function bloquearBotones(bloquear) {
      document.getElementById('btnCheckin').disabled = bloquear;
      document.getElementById('btnCheckout').disabled = bloquear;
    }

    function limpiarYEnfocarParaSiguiente() {
      const input = document.getElementById('reservaId');
      input.value = '';
      input.focus();
    }

    async function hacerCheckin() {
      if (accionEnCurso) return;

      const reservaId = obtenerReservaIdNormalizado();
      const btn = document.getElementById('btnCheckin');

      if (!reservaId) {
        mostrarMensaje('Por favor, ingresa un ID de reserva válido.', true);
        return;
      }

      accionEnCurso = true;
      bloquearBotones(true);
      btn.innerText = 'Procesando...';

      try {
        const resultado = await api({ action: 'checkin', reservaId, usuario: 'STAFF' });

        if (resultado.ok) {
          mostrarMensaje(resultado.mensaje || 'Check-in realizado correctamente.', false);
          limpiarYEnfocarParaSiguiente();
        } else {
          mostrarMensaje(resultado.mensaje || 'No se pudo realizar el check-in.', true);
        }
      } catch (error) {
        mostrarMensaje(error.message || 'Error de conexión con el servidor.', true);
      } finally {
        accionEnCurso = false;
        bloquearBotones(false);
        btn.innerText = 'Confirmar ingreso';
      }
    }

    async function hacerCheckout() {
      if (accionEnCurso) return;

      const reservaId = obtenerReservaIdNormalizado();
      const btn = document.getElementById('btnCheckout');

      if (!reservaId) {
        mostrarMensaje('Por favor, ingresa un ID de reserva válido.', true);
        return;
      }

      accionEnCurso = true;
      bloquearBotones(true);
      btn.innerText = 'Procesando...';

      try {
        const resultado = await api({ action: 'checkout', reservaId, usuario: 'STAFF' });

        if (resultado.ok) {
          mostrarMensaje(resultado.mensaje || 'Check-out realizado correctamente.', false);
          limpiarYEnfocarParaSiguiente();
        } else {
          mostrarMensaje(resultado.mensaje || 'No se pudo realizar el check-out.', true);
        }
      } catch (error) {
        mostrarMensaje(error.message || 'Error de conexión con el servidor.', true);
      } finally {
        accionEnCurso = false;
        bloquearBotones(false);
        btn.innerText = 'Registrar salida';
      }
    }

    // Enter en el campo dispara Check-in (la acción más común en un
    // flujo de entrada rápida: escanear/tipear el código y presionar Enter).
    document.getElementById('reservaId').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        hacerCheckin();
      }
    });

    // Foco inicial en el campo para que la página quede lista
    // para escanear/tipear apenas se abre.
    document.getElementById('reservaId').focus();
  </script>
</body>

</html>
