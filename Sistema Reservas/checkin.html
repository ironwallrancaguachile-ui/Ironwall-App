<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Ironwall - Check-in</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; max-width: 800px; margin: 0 auto; padding: 24px 16px 60px; background: #f7f7f7; color: #222; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    .sub { color: #666; font-size: 12px; margin: 0 0 10px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    select, input { width: 100%; padding: 10px; font-size: 12px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }
    button { width: 100%; padding: 8px; border: 0; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }

    /* Disposición obligatoria de 2 tarjetas por fila en cualquier dispositivo */
    .grid-2col { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
    .card { background: #fff; padding: 16px; border-radius: 10px; border: 1px solid #ddd; display: flex; flex-direction: column; justify-content: space-between; }

    .btnAgregar { margin-top: 10px; background: #1565C0; color: white; }
    .btnConfirmar { margin-top: 10px; background: #1e824c; color: white; font-size: 14px; }
    .btnConfirmar:disabled { background: #aaa; cursor: not-allowed; }


    .btnHome { display: inline-flex; align-items: center; gap: 8px; background: #ffffff; color: #222; text-decoration: none; padding: 10px 18px; border-radius: 12px; font-size: 16px; font-weight: 600; box-shadow: 0 3px 12px rgba(0,0,0,.12); transition: .2s; margin-bottom: 10px; }
    .btnHome:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(0,0,0,.15); }
  </style>
</head>

<body>
<a href="index.html" class="btnHome">  ← Inicio </a>
 <div class="grid-2col">
      <div class="card">
            <h1>Check-in</h1>
            <p>Ingresa el ID de reserva.</p>
            <input  id="reservaId"  placeholder="RES-XXXXXXXX"> 
      </div>
      <div class="card">
            <button  class= "btnAgregar" onclick="hacerCheckin()">Confirmar ingreso</button>
            <button  class= "btnConfirmar" onclick="hacerCheckout()">Registrar salida</button>
            <div  id="resultado"></div>
      </div>
</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


async function api(body) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body:
          JSON.stringify(body)
      }
    );

  return response.json();
}


async function hacerCheckin() {
  const reservaId =
    document
      .getElementById('reservaId')
      .value
      .trim();
  if (!reservaId) {return; }
  const resultado =  await api({ action: 'checkin', reservaId, usuario: 'STAFF'  });
  document
    .getElementById( 'resultado' ).textContent =  resultado.mensaje;
}

async function hacerCheckout() {
  const reservaId =
    document
      .getElementById( 'reservaId' )
      .value
      .trim();
  if (!reservaId) { return; }
  const resultado =
    await api({ action:'checkout', reservaId, usuario:  'STAFF' });
  document
    .getElementById( 'resultado' ).textContent = resultado.mensaje;
}

</script>

</body>

</html>
