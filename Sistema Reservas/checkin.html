<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Ironwall - Check-in</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 25px;
}

.container {
  max-width: 550px;
  margin: auto;
}

.card {
  background: white;
  padding: 25px;
  border-radius: 14px;
  box-shadow:
    0 2px 10px
    rgba(0,0,0,.08);
}

input,
button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

button {
  cursor: pointer;
  font-weight: bold;
}

#resultado {
  margin-top: 20px;
  font-weight: bold;
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Check-in</h1>

<p>
Ingresa el ID de reserva.
</p>

<input
  id="reservaId"
  placeholder="RES-XXXXXXXX">


<button
  onclick="hacerCheckin()">

Confirmar ingreso

</button>


<button
  onclick="hacerCheckout()">

Registrar salida

</button>


<div
  id="resultado">
</div>

</div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


async function api(body) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body:
          JSON.stringify(body)
      }
    );

  return response.json();
}


async function hacerCheckin() {

  const reservaId =
    document
      .getElementById(
        'reservaId'
      )
      .value
      .trim();

  if (!reservaId) {
    return;
  }


  const resultado =
    await api({

      action:
        'checkin',

      reservaId,

      usuario:
        'STAFF'
    });


  document
    .getElementById(
      'resultado'
    ).textContent =
    resultado.mensaje;
}


async function hacerCheckout() {

  const reservaId =
    document
      .getElementById(
        'reservaId'
      )
      .value
      .trim();

  if (!reservaId) {
    return;
  }


  const resultado =
    await api({

      action:
        'checkout',

      reservaId,

      usuario:
        'STAFF'
    });


  document
    .getElementById(
      'resultado'
    ).textContent =
    resultado.mensaje;
}

</script>

</body>

</html>
