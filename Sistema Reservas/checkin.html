<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironwall - Check-in</title>
  <style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* --- CABECERA Y NAVEGACIÓN --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }

    .logo-btn {
      height: 36px;
      width: auto;
      object-fit: contain;
      transform: scale(1.8);
      transform-origin: center;
    }

    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* --- TARJETAS --- */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      border: 1px solid #e8ecef;
    }

    .titulo-card {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      letter-spacing: .5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* --- FORMULARIOS --- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input,
    select {
      width: 100%;
      height: 41px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    /* --- BOTONES --- */
    button,
    .btn {
      width: 100%;
      height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-primary {
      background-color: #191919;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #333333;
    }

    .btn-consultar {
      background-color: #e0e0e0;
      color: #333333;
    }

    .btn-consultar:hover {
      background-color: #d0d0d0;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* --- MENSAJES --- */
    .mensaje {
      margin-top: 14px;
      font-weight: 700;
      font-size: 13px;
      padding: 12px;
      border-radius: 8px;
    }

    .exito {
      background: #dcfce7;
      color: #15803d;
    }

    .error {
      background: #fee2e2;
      color: #dc2626;
    }

    /* --- BÚSQUEDA POR NOMBRE --- */
    .fila-busqueda {
      display: grid;
      grid-template-columns: 150px 1fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 16px;
    }

    .lista-resultados {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .resultado-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f8f9fa;
      border: 1px solid #edf0f2;
      border-radius: 8px;
      padding: 10px 14px;
      flex-wrap: wrap;
    }

    .resultado-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 13px;
    }

    .resultado-info strong {
      font-size: 14px;
    }

    .resultado-meta {
      font-size: 12px;
      color: #666;
    }

    .badge-tipo-mini, .badge-estado-mini {
      font-weight: 700;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 5px;
      display: inline-block;
      text-transform: uppercase;
      margin-right: 4px;
    }

    .tipo-entrada { background: #eef2ff; color: #4338ca; }
    .tipo-clase { background: #fff8e6; color: #b47700; }
    .estado-checkin { background: #dcfce7; color: #15803d; }
    .estado-completada { background: #e0e7ff; color: #3730a3; }
    .estado-cancelada, .estado-noshow { background: #fee2e2; color: #dc2626; }

    .resultado-accion {
      width: auto;
      height: 34px;
      padding: 0 14px;
      font-size: 12px;
      flex-shrink: 0;
    }

    .sin-resultados {
      text-align: center;
      color: #888;
      padding: 20px;
      font-size: 13px;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }

      .card {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .fila-busqueda {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- NAVEGACIÓN Y CABECERA -->
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome">
        <img src="img/logosn.png" alt="Logo" class="logo-btn">
        <span>← Inicio</span>
      </a>
    </div>

    <h1>Check-in / Check-out</h1>
    <p class="subtitulo">Busca por nombre y fecha, o ingresa el ID de la reserva directamente</p>

    <!-- CARD: BUSCAR POR NOMBRE -->
    <div class="card">
      <div class="titulo-card">Buscar Reserva</div>

      <div class="fila-busqueda">
        <div>
          <label for="fechaBusqueda">Fecha</label>
          <input id="fechaBusqueda" type="date">
        </div>
        <div>
          <label for="nombreBusqueda">Nombre del cliente</label>
          <input id="nombreBusqueda" placeholder="Escribe para filtrar..." autocomplete="off">
        </div>
        <button class="btn-consultar" id="btnActualizarBusqueda" style="width:auto; padding:0 20px;" onclick="cargarReservasDelDia()">
          Actualizar
        </button>
      </div>

      <div id="listaResultados" class="lista-resultados">
        <div class="sin-resultados">Cargando reservas del día...</div>
      </div>
    </div>

    <!-- CARD: REGISTRO MANUAL POR ID (flujo rápido / kiosco) -->
    <div class="card">
      <div class="titulo-card">Registro por ID (rápido)</div>
      
      <div style="margin-bottom: 16px;">
        <label for="reservaId">ID de Reserva</label>
        <input id="reservaId" placeholder="Ej: RES-XXXXXXXX" style="text-transform: uppercase;" autocomplete="off">
      </div>

      <div class="form-grid">
        <div>
          <button class="btn-primary" id="btnCheckin" onclick="hacerCheckin()">Confirmar ingreso</button>
        </div>
        <div>
          <button class="btn-consultar" id="btnCheckout" onclick="hacerCheckout()">Registrar salida</button>
        </div>
      </div>

      <div id="resultado" class="mensaje" style="display: none;"></div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';

    /* =========================================================
       ESTADO GENERAL
    ========================================================= */
    // Bloqueo simple para el registro manual por ID: mientras una acción
    // está en curso, se deshabilitan ambos botones de esa tarjeta.
    let accionEnCurso = false;

    // Cancelación real de la consulta de reservas del día (mismo patrón
    // que reservas.html / hoy.html / semana.html / clases.html).
    let controladorBusqueda = null;

    // Reservas del día ya cargadas; el filtro por nombre se aplica
    // en el navegador sobre este arreglo, sin golpear el servidor
    // en cada tecla que el usuario escribe.
    let reservasDelDiaCache = [];

    // IDs de reserva con una acción de check-in/check-out en curso
    // desde la lista de resultados (para deshabilitar solo ese botón).
    const accionesEnCursoLista = new Set();

    function fechaHoy() {
      const d = new Date();
      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, '0'),
        String(d.getDate()).padStart(2, '0')
      ].join('-');
    }

    document.getElementById('fechaBusqueda').value = fechaHoy();

    /* =========================================================
       API
    ========================================================= */
    async function api(body, opciones = {}) {
      const timeout = opciones.timeout || 15000;
      const controller = new AbortController();

      if (opciones.signal) {
        if (opciones.signal.aborted) {
          controller.abort();
        } else {
          opciones.signal.addEventListener('abort', () => controller.abort());
        }
      }

      const timeoutId = setTimeout(() => controller.abort(), timeout);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(body),
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error(`Error HTTP ${response.status}`);
        }

        return await response.json();

      } catch (error) {
        if (error.name === 'AbortError') {
          throw error;
        }
        throw error;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    function mostrarMensaje(texto, esError = false) {
      const resDiv = document.getElementById('resultado');
      resDiv.className = `mensaje ${esError ? 'error' : 'exito'}`;
      resDiv.textContent = texto;
      resDiv.style.display = 'block';
    }

    /* =========================================================
       BÚSQUEDA POR NOMBRE / FECHA
    ========================================================= */
    async function cargarReservasDelDia() {
      const fecha = document.getElementById('fechaBusqueda').value;
      const btn = document.getElementById('btnActualizarBusqueda');
      const lista = document.getElementById('listaResultados');

      if (!fecha) return;

      // Cancela cualquier consulta anterior en vuelo antes de lanzar esta
      if (controladorBusqueda) {
        controladorBusqueda.abort();
      }
      const miControlador = new AbortController();
      controladorBusqueda = miControlador;

      const textoOriginal = btn.innerText;
      btn.innerText = 'Buscando...';
      btn.disabled = true;

      lista.innerHTML = '<div class="sin-resultados">Cargando reservas del día...</div>';

      try {
        const resultado = await api(
          { action: 'listarReservasFecha', fecha },
          { signal: miControlador.signal }
        );

        if (controladorBusqueda !== miControlador) return;

        if (!resultado || !resultado.ok) {
          lista.innerHTML = `<div class="sin-resultados">${resultado?.mensaje || 'Error al obtener las reservas'}</div>`;
          reservasDelDiaCache = [];
          return;
        }

        reservasDelDiaCache = resultado.reservas || [];
        renderizarResultados();

      } catch (error) {
        if (error.name === 'AbortError') return;
        if (controladorBusqueda !== miControlador) return;

        lista.innerHTML = '<div class="sin-resultados">Error de conexión al cargar las reservas.</div>';
        reservasDelDiaCache = [];

      } finally {
        if (controladorBusqueda === miControlador) {
          controladorBusqueda = null;
          btn.innerText = textoOriginal;
          btn.disabled = false;
        }
      }
    }

    function renderizarResultados() {
      const lista = document.getElementById('listaResultados');
      const filtro = document.getElementById('nombreBusqueda').value.trim().toLowerCase();

      const filtradas = reservasDelDiaCache.filter(r => {
        if (!filtro) return true;
        const nombre = String(r.ClienteID || r.NombreCliente || '').toLowerCase();
        return nombre.includes(filtro);
      });

      // Orden por hora, igual que en las otras vistas
      filtradas.sort((a, b) => String(a.HoraInicio || '').localeCompare(String(b.HoraInicio || '')));

      if (filtradas.length === 0) {
        lista.innerHTML = '<div class="sin-resultados">No hay reservas que coincidan con la búsqueda.</div>';
        return;
      }

      lista.innerHTML = '';

      filtradas.forEach(reserva => {
        const item = document.createElement('div');
        item.className = 'resultado-item';

        const tipo = String(reserva.Tipo || '').trim().toUpperCase();
        const esClase = tipo === 'CLASE';
        const claseTipoBadge = esClase ? 'tipo-clase' : 'tipo-entrada';
        const etiquetaTipo = esClase ? 'Clase' : 'Entrada';

        const estado = String(reserva.Estado || '').trim().toUpperCase();

        let badgeEstadoHtml = '';
        if (estado === 'CHECKIN') {
          badgeEstadoHtml = `<span class="badge-estado-mini estado-checkin">Check-in</span>`;
        } else if (estado === 'COMPLETADA') {
          badgeEstadoHtml = `<span class="badge-estado-mini estado-completada">Completada</span>`;
        } else if (estado === 'CANCELADA') {
          badgeEstadoHtml = `<span class="badge-estado-mini estado-cancelada">Cancelada</span>`;
        } else if (estado === 'NO_SHOW' || estado === 'NOSHOW' || estado === 'NO SHOW') {
          badgeEstadoHtml = `<span class="badge-estado-mini estado-noshow">No Show</span>`;
        }

        let botonAccionHtml = '';
        const reservaId = reserva.ReservaID;
        const bloqueado = accionesEnCursoLista.has(reservaId);

        if (estado === 'RESERVADA' || estado === 'CONFIRMADA') {
          botonAccionHtml = `
            <button class="btn-primary resultado-accion" ${bloqueado ? 'disabled' : ''}
              onclick="hacerCheckinDesdeListaConId('${reservaId}')">
              ${bloqueado ? 'Procesando...' : 'Check-in'}
            </button>
          `;
        } else if (estado === 'CHECKIN') {
          botonAccionHtml = `
            <button class="btn-consultar resultado-accion" ${bloqueado ? 'disabled' : ''}
              onclick="hacerCheckoutDesdeListaConId('${reservaId}')">
              ${bloqueado ? 'Procesando...' : 'Salida'}
            </button>
          `;
        }

        item.innerHTML = `
          <div class="resultado-info">
            <div>
              <span class="badge-tipo-mini ${claseTipoBadge}">${etiquetaTipo}</span>
              ${badgeEstadoHtml}
            </div>
            <strong>${reserva.ClienteID || reserva.NombreCliente || '-'}</strong>
            <span class="resultado-meta">${reserva.HoraInicio || ''} - ${reserva.HoraFin || ''} · ${reserva.Cantidad || 1} persona(s) · ${reservaId}</span>
          </div>
          ${botonAccionHtml}
        `;

        lista.appendChild(item);
      });
    }

    // Filtrado instantáneo mientras se escribe, sin nuevas consultas al servidor
    document.getElementById('nombreBusqueda').addEventListener('input', renderizarResultados);

    // Recargar automáticamente al cambiar la fecha
    document.getElementById('fechaBusqueda').addEventListener('change', cargarReservasDelDia);

    /* =========================================================
       ACCIONES DESDE LA LISTA DE RESULTADOS
    ========================================================= */
    async function hacerCheckinDesdeListaConId(reservaId) {
      if (accionesEnCursoLista.has(reservaId)) return;
      accionesEnCursoLista.add(reservaId);
      renderizarResultados();

      try {
        const resultado = await api({ action: 'checkin', reservaId, usuario: 'STAFF' });
        if (!resultado.ok) {
          alert(resultado.mensaje || 'No se pudo realizar el check-in.');
        } else {
          // Pequeña pausa para asegurar consistencia, igual que en hoy.html
          await new Promise(r => setTimeout(r, 500));
          await cargarReservasDelDia();
        }
      } catch (error) {
        alert('Error de conexión al procesar el check-in.');
      } finally {
        accionesEnCursoLista.delete(reservaId);
        renderizarResultados();
      }
    }

    async function hacerCheckoutDesdeListaConId(reservaId) {
      if (accionesEnCursoLista.has(reservaId)) return;
      accionesEnCursoLista.add(reservaId);
      renderizarResultados();

      try {
        const resultado = await api({ action: 'checkout', reservaId, usuario: 'STAFF' });
        if (!resultado.ok) {
          alert(resultado.mensaje || 'No se pudo realizar el check-out.');
        } else {
          await new Promise(r => setTimeout(r, 500));
          await cargarReservasDelDia();
        }
      } catch (error) {
        alert('Error de conexión al procesar el check-out.');
      } finally {
        accionesEnCursoLista.delete(reservaId);
        renderizarResultados();
      }
    }

    /* =========================================================
       REGISTRO MANUAL POR ID (flujo rápido / kiosco)
    ========================================================= */
    function obtenerReservaIdNormalizado() {
      // El CSS solo cambia cómo se VE el texto; hay que normalizar
      // el valor real a mayúsculas antes de enviarlo, porque el
      // backend compara los IDs de forma sensible a mayúsculas.
      const input = document.getElementById('reservaId');
      const valor = input.value.trim().toUpperCase();
      input.value = valor;
      return valor;
    }

    function bloquearBotonesManual(bloquear) {
      document.getElementById('btnCheckin').disabled = bloquear;
      document.getElementById('btnCheckout').disabled = bloquear;
    }

    function limpiarYEnfocarParaSiguiente() {
      const input = document.getElementById('reservaId');
      input.value = '';
      input.focus();
    }

    async function hacerCheckin() {
      if (accionEnCurso) return;

      const reservaId = obtenerReservaIdNormalizado();
      const btn = document.getElementById('btnCheckin');

      if (!reservaId) {
        mostrarMensaje('Por favor, ingresa un ID de reserva válido.', true);
        return;
      }

      accionEnCurso = true;
      bloquearBotonesManual(true);
      btn.innerText = 'Procesando...';

      try {
        const resultado = await api({ action: 'checkin', reservaId, usuario: 'STAFF' });

        if (resultado.ok) {
          mostrarMensaje(resultado.mensaje || 'Check-in realizado correctamente.', false);
          limpiarYEnfocarParaSiguiente();
        } else {
          mostrarMensaje(resultado.mensaje || 'No se pudo realizar el check-in.', true);
        }
      } catch (error) {
        mostrarMensaje(error.message || 'Error de conexión con el servidor.', true);
      } finally {
        accionEnCurso = false;
        bloquearBotonesManual(false);
        btn.innerText = 'Confirmar ingreso';
      }
    }

    async function hacerCheckout() {
      if (accionEnCurso) return;

      const reservaId = obtenerReservaIdNormalizado();
      const btn = document.getElementById('btnCheckout');

      if (!reservaId) {
        mostrarMensaje('Por favor, ingresa un ID de reserva válido.', true);
        return;
      }

      accionEnCurso = true;
      bloquearBotonesManual(true);
      btn.innerText = 'Procesando...';

      try {
        const resultado = await api({ action: 'checkout', reservaId, usuario: 'STAFF' });

        if (resultado.ok) {
          mostrarMensaje(resultado.mensaje || 'Check-out realizado correctamente.', false);
          limpiarYEnfocarParaSiguiente();
        } else {
          mostrarMensaje(resultado.mensaje || 'No se pudo realizar el check-out.', true);
        }
      } catch (error) {
        mostrarMensaje(error.message || 'Error de conexión con el servidor.', true);
      } finally {
        accionEnCurso = false;
        bloquearBotonesManual(false);
        btn.innerText = 'Registrar salida';
      }
    }

    // Enter en el campo de ID dispara Check-in
    document.getElementById('reservaId').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        hacerCheckin();
      }
    });

    /* =========================================================
       INICIALIZACIÓN
    ========================================================= */
    cargarReservasDelDia();
  </script>
</body>

</html>
