<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Ironwall - Check-in</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Arial, sans-serif;
    max-width: 580px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    background: #fafafa;
    color: #222;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; font-size: 13px; }
  label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #555; margin: 8px 0 3px; }
  
  select, input {
    width: 100%;
    padding: 9px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
  }

  /* Opcional: ajusta el video interno de la librería para que no desborde */
  #reader video {
    object-fit: cover !important;
  }

  /* ================= GRID DE EXACTAMENTE 2 COLUMNAS ================= */
  #resultado {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
    align-items: start;
  }

  .card {
    background: #ffffff;
    border: 1px solid #e8e8e8;
    border-radius: 10px;
    padding: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
  }

  .card h3 { 
    font-size: 11px; 
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #777;
    margin: 0 0 8px; 
    font-weight: 700;
    border-bottom: 1px solid #f0f0f0;
    padding-bottom: 4px;
  }

  .card p { 
    margin: 2px 0; 
    font-size: 12px; 
    line-height: 1.3;
    color: #222;
  }

  .card button {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    background: #1e824c;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .card button:disabled { opacity: 0.5; cursor: not-allowed; }

  .item-pase {
    background: #fafafa;
    border: 1px solid #ebebeb;
    border-radius: 6px;
    padding: 8px;
    margin-top: 6px;
  }

  .item { 
    border-top: 1px solid #f2f2f2; 
    padding-top: 4px; 
    margin-top: 4px; 
    font-size: 11px; 
  }
  .item:first-child { border-top: none; padding-top: 0; margin-top: 0; }

  .btnHome {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    color: #222;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
    transition: .2s;
  }
  
  .btnHome:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(0,0,0,.15);
  }
</style>
</head>

<body>
<a href="index.html" class="btnHome"> 🏠 Home </a>
<div class="container">
<div class="card">
<h1>Check-in</h1>

<p>
Ingresa el ID de reserva.
</p>

<input
  id="reservaId"
  placeholder="RES-XXXXXXXX">


<button
  onclick="hacerCheckin()">

Confirmar ingreso

</button>


<button
  onclick="hacerCheckout()">

Registrar salida

</button>


<div
  id="resultado">
</div>

</div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


async function api(body) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body:
          JSON.stringify(body)
      }
    );

  return response.json();
}


async function hacerCheckin() {

  const reservaId =
    document
      .getElementById(
        'reservaId'
      )
      .value
      .trim();

  if (!reservaId) {
    return;
  }


  const resultado =
    await api({

      action:
        'checkin',

      reservaId,

      usuario:
        'STAFF'
    });


  document
    .getElementById(
      'resultado'
    ).textContent =
    resultado.mensaje;
}


async function hacerCheckout() {

  const reservaId =
    document
      .getElementById(
        'reservaId'
      )
      .value
      .trim();

  if (!reservaId) {
    return;
  }


  const resultado =
    await api({

      action:
        'checkout',

      reservaId,

      usuario:
        'STAFF'
    });


  document
    .getElementById(
      'resultado'
    ).textContent =
    resultado.mensaje;
}

</script>

</body>

</html>
