<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Ironwall - Check-in</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      background: #fafafa;
      color: #222;
    }
    h1 { font-size: 22px; margin-bottom: 4px; margin-top: 4px; }
    p.sub { color: #666; margin-top: 0; margin-bottom: 24px; font-size: 14px; }
    
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #222;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #1a1a1a;
    }

    .seccion-dinamica {
      display: none;
      border-top: 1px dashed #ddd;
      padding-top: 16px;
      margin-top: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #1a1a1a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #333; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
      transition: .2s;
      margin-bottom: 20px;
    }
    .btnHome:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,.15);
    }
      /* CONTENEDOR GRID DE 2 COLUMNAS */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px 16px;
      align-items: start;
    }

    /* ELEMENTOS QUE OCUPAN 2 COLUMNAS SIEMPRE */
    .full-width {
      grid-column: span 2;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>

<body>
<a href="index.html" class="btnHome">  ← Inicio </a>
 <div class="form-grid">
      <div class="card">
            <h1>Check-in</h1>
            <p>Ingresa el ID de reserva.</p>
            <input  id="reservaId"  placeholder="RES-XXXXXXXX"> 
      </div>
      <div class="card">
            <button  class= "btnAgregar" onclick="hacerCheckin()">Confirmar ingreso</button>
            <button  class= "btnConfirmar" onclick="hacerCheckout()">Registrar salida</button>
            <div  id="resultado"></div>
      </div>
</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


async function api(body) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body:
          JSON.stringify(body)
      }
    );

  return response.json();
}


async function hacerCheckin() {
  const reservaId =
    document
      .getElementById('reservaId')
      .value
      .trim();
  if (!reservaId) {return; }
  const resultado =  await api({ action: 'checkin', reservaId, usuario: 'STAFF'  });
  document
    .getElementById( 'resultado' ).textContent =  resultado.mensaje;
}

async function hacerCheckout() {
  const reservaId =
    document
      .getElementById( 'reservaId' )
      .value
      .trim();
  if (!reservaId) { return; }
  const resultado =
    await api({ action:'checkout', reservaId, usuario:  'STAFF' });
  document
    .getElementById( 'resultado' ).textContent = resultado.mensaje;
}

</script>

</body>

</html>
