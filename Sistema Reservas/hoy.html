<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">
<title>Ironwall - Hoy</title>

<style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-SemiBold.ttf");
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* --- CABECERA Y NAVEGACIÓN --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }

    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* --- TARJETAS --- */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      border: 1px solid #e8ecef;
    }

    .titulo-card {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      letter-spacing: .5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* --- INDICADORES --- */
    .indicadores {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .indicador-item {
      background: #f8f9fa;
      border: 1px solid #edf0f2;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
    }

    .indicador-item span {
      font-size: 11px;
      color: #666;
      margin-bottom: 2px;
    }

    .indicador-item strong {
      font-size: 18px;
      font-weight: 700;
      color: #111;
    }

    /* --- FORMULARIOS --- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input,
    select {
      width: 100%;
      height: 41px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    /* --- HORARIO CALCULADO --- */
    .horario-calculado {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 8px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      color: #333;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .horario-calculado.activo {
      background: #eef6ff;
      border-color: #d5e7f8;
      color: #222;
    }

    .horario-calculado.error-horario {
      background: #fee2e2;
      border-color: #fecaca;
      color: #dc2626;
    }

    /* --- BOTONES --- */
    button,
    .btn {
      width: 100%;
      height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-consultar {
      background-color: #e0e0e0;
      color: #333333;
    }

    .btn-consultar:hover {
      background-color: #d0d0d0;
    }

    .btn-reservar {
      background-color: #191919;
      color: #ffffff;
      margin-top: 18px;
    }

    .btn-reservar:hover {
      background-color: #333333;
    }

    .btn-danger {
      background-color: #fee2e2;
      color: #dc2626;
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
      width: auto;
      border-radius: 6px;
    }

    .btn-danger:hover {
      background-color: #fca5a5;
    }

    .btn:disabled,
    .btn-reservar:disabled,
    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn:active:not(:disabled),
    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* --- MENSAJES --- */
    .mensaje {
      margin-top: 12px;
      font-weight: 700;
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
    }

    .exito {
      background: #dcfce7;
      color: #15803d;
    }

    .error {
      background: #fee2e2;
      color: #dc2626;
    }

    /* --- CONSULTA Y TABLA --- */
    .fila-consulta {
      display: flex;
      gap: 12px;
      align-items: end;
      max-width: 380px;
      margin-bottom: 16px;
    }

    .tabla-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf0f2;
      text-align: left;
    }

    th {
      color: #666;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }

      .card {
        padding: 16px;
      }

      .fila-consulta {
        max-width: 100%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  
</style>

</head>

<body>
<a href="index.html" class="btnHome">  ← Inicio </a>
<div class="container">

<h1>Ironwall Reservas</h1>

<p>
Panel operativo del día
</p>


<div class="top">

<input
  id="fecha"
  type="date">

<button onclick="cargarHoy()">
Actualizar
</button>

</div>


<div class="cards">

<div class="card">
Capacidad
<div
  class="numero"
  id="capacidad">
-
</div>
</div>

<div class="card">
Reservados
<div
  class="numero"
  id="reservado">
-
</div>
</div>

<div class="card">
Dentro ahora
<div
  class="numero"
  id="dentro">
-
</div>
</div>

<div class="card">
Disponibles
<div
  class="numero"
  id="disponibles">
-
</div>
</div>

<div class="card">
Clases
<div
  class="numero"
  id="clases">
-
</div>
</div>

</div>


<div id="mensaje"></div>


<div class="tabla">

<table>

<thead>

<tr>
<th>Hora</th>
<th>Cliente</th>
<th>Tipo</th>
<th>Cantidad</th>
<th>Estado</th>
<th>Acciones</th>
</tr>

</thead>

<tbody
  id="tablaReservas">
</tbody>

</table>

</div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


function fechaHoy() {

  const d =
    new Date();

  return [
    d.getFullYear(),
    String(
      d.getMonth()+1
    ).padStart(2,'0'),
    String(
      d.getDate()
    ).padStart(2,'0')
  ].join('-');
}


document
  .getElementById(
    'fecha'
  ).value =
  fechaHoy();


async function api(body) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body:
          JSON.stringify(body)
      }
    );

  return response.json();
}


async function cargarHoy() {

  const fecha =
    document
      .getElementById(
        'fecha'
      ).value;

  const resultado =
    await api({

      action:
        'resumenHoy',

      fecha
    });


  if (!resultado.ok) {

    document
      .getElementById(
        'mensaje'
      ).textContent =
      resultado.mensaje;

    return;
  }


  document
    .getElementById(
      'capacidad'
    ).textContent =
    resultado.capacidad;


  document
    .getElementById(
      'reservado'
    ).textContent =
    resultado.reservado;


  document
    .getElementById(
      'dentro'
    ).textContent =
    resultado.dentro;


  document
    .getElementById(
      'disponibles'
    ).textContent =
    resultado.disponibles;


  document
    .getElementById(
      'clases'
    ).textContent =
    resultado.clases.length;


  pintarReservas(
    resultado.reservas
  );
}


function pintarReservas(
  reservas
) {

  const tbody =
    document
      .getElementById(
        'tablaReservas'
      );

  tbody.innerHTML = '';


  if (!reservas.length) {

    tbody.innerHTML =
      '<tr>' +
      '<td colspan="6">' +
      'No hay reservas para este día' +
      '</td>' +
      '</tr>';

    return;
  }


  reservas.sort(
    (a,b) =>
      a.HoraInicio
        .localeCompare(
          b.HoraInicio
        )
  );


  reservas.forEach(
    reserva => {

      const tr =
        document.createElement(
          'tr'
        );


      let acciones = '';


      if (
        reserva.Estado ===
        'RESERVADA'
      ) {

        acciones = `

          <button
            onclick="checkin('${reserva.ReservaID}')">
            Check-in
          </button>

          <button
            onclick="cancelar('${reserva.ReservaID}')">
            Cancelar
          </button>

          <button
            onclick="noShow('${reserva.ReservaID}')">
            No Show
          </button>
        `;
      }


      if (
        reserva.Estado ===
        'CHECKIN'
      ) {

        acciones = `

          <button
            onclick="checkout('${reserva.ReservaID}')">
            Salida
          </button>
        `;
      }


      tr.innerHTML = `

        <td>
          ${reserva.HoraInicio}
          -
          ${reserva.HoraFin}
        </td>

        <td>
          ${reserva.ClienteID}
        </td>

        <td>
          ${reserva.Tipo}
        </td>

        <td>
          ${reserva.Cantidad}
        </td>

        <td>
          ${reserva.Estado}
        </td>

        <td class="acciones">
          ${acciones}
        </td>
      `;


      tbody.appendChild(
        tr
      );
    }
  );
}


async function checkin(
  reservaId
) {

  if (
    !confirm(
      '¿Confirmar ingreso?'
    )
  ) return;


  const resultado =
    await api({

      action:
        'checkin',

      reservaId,

      usuario:
        'STAFF'
    });


  alert(
    resultado.mensaje
  );

  cargarHoy();
}


async function checkout(
  reservaId
) {

  if (
    !confirm(
      '¿Registrar salida?'
    )
  ) return;


  const resultado =
    await api({

      action:
        'checkout',

      reservaId,

      usuario:
        'STAFF'
    });


  alert(
    resultado.mensaje
  );

  cargarHoy();
}


async function cancelar(
  reservaId
) {

  if (
    !confirm(
      '¿Cancelar esta reserva?'
    )
  ) return;


  const resultado =
    await api({

      action:
        'cancelarReserva',

      reservaId,

      usuario:
        'STAFF'
    });


  alert(
    resultado.mensaje
  );

  cargarHoy();
}


async function noShow(
  reservaId
) {

  if (
    !confirm(
      '¿Marcar esta reserva como NO SHOW?'
    )
  ) return;


  const resultado =
    await api({

      action:
        'marcarNoShow',

      reservaId,

      usuario:
        'STAFF'
    });


  alert(
    resultado.mensaje
  );

  cargarHoy();
}


cargarHoy();

</script>

</body>

</html>
