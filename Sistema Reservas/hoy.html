<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Ironwall - Hoy</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f5f5f5;
}

.container {
  max-width: 1150px;
  margin: auto;
}

.top {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

input,
button {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  cursor: pointer;
  font-weight: bold;
}

.cards {
  display: grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(160px, 1fr)
    );
  gap: 12px;
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 18px;
  box-shadow:
    0 2px 8px
    rgba(0,0,0,.08);
}

.numero {
  font-size: 30px;
  font-weight: bold;
  margin-top: 8px;
}

.tabla {
  background: white;
  border-radius: 12px;
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 12px;
  border-bottom: 1px solid #eee;
  text-align: left;
}

th {
  background: #fafafa;
}

.acciones button {
  margin: 2px;
}

#mensaje {
  margin: 15px 0;
  font-weight: bold;
}

</style>

</head>

<body>
<a href="index.html" class="btnHome">  ← Inicio </a>
<div class="container">

<h1>Ironwall Reservas</h1>

<p>
Panel operativo del día
</p>


<div class="top">

<input
  id="fecha"
  type="date">

<button onclick="cargarHoy()">
Actualizar
</button>

</div>


<div class="cards">

<div class="card">
Capacidad
<div
  class="numero"
  id="capacidad">
-
</div>
</div>

<div class="card">
Reservados
<div
  class="numero"
  id="reservado">
-
</div>
</div>

<div class="card">
Dentro ahora
<div
  class="numero"
  id="dentro">
-
</div>
</div>

<div class="card">
Disponibles
<div
  class="numero"
  id="disponibles">
-
</div>
</div>

<div class="card">
Clases
<div
  class="numero"
  id="clases">
-
</div>
</div>

</div>


<div id="mensaje"></div>


<div class="tabla">

<table>

<thead>

<tr>
<th>Hora</th>
<th>Cliente</th>
<th>Tipo</th>
<th>Cantidad</th>
<th>Estado</th>
<th>Acciones</th>
</tr>

</thead>

<tbody
  id="tablaReservas">
</tbody>

</table>

</div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


function fechaHoy() {

  const d =
    new Date();

  return [
    d.getFullYear(),
    String(
      d.getMonth()+1
    ).padStart(2,'0'),
    String(
      d.getDate()
    ).padStart(2,'0')
  ].join('-');
}


document
  .getElementById(
    'fecha'
  ).value =
  fechaHoy();


async function api(body) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body:
          JSON.stringify(body)
      }
    );

  return response.json();
}


async function cargarHoy() {

  const fecha =
    document
      .getElementById(
        'fecha'
      ).value;

  const resultado =
    await api({

      action:
        'resumenHoy',

      fecha
    });


  if (!resultado.ok) {

    document
      .getElementById(
        'mensaje'
      ).textContent =
      resultado.mensaje;

    return;
  }


  document
    .getElementById(
      'capacidad'
    ).textContent =
    resultado.capacidad;


  document
    .getElementById(
      'reservado'
    ).textContent =
    resultado.reservado;


  document
    .getElementById(
      'dentro'
    ).textContent =
    resultado.dentro;


  document
    .getElementById(
      'disponibles'
    ).textContent =
    resultado.disponibles;


  document
    .getElementById(
      'clases'
    ).textContent =
    resultado.clases.length;


  pintarReservas(
    resultado.reservas
  );
}


function pintarReservas(
  reservas
) {

  const tbody =
    document
      .getElementById(
        'tablaReservas'
      );

  tbody.innerHTML = '';


  if (!reservas.length) {

    tbody.innerHTML =
      '<tr>' +
      '<td colspan="6">' +
      'No hay reservas para este día' +
      '</td>' +
      '</tr>';

    return;
  }


  reservas.sort(
    (a,b) =>
      a.HoraInicio
        .localeCompare(
          b.HoraInicio
        )
  );


  reservas.forEach(
    reserva => {

      const tr =
        document.createElement(
          'tr'
        );


      let acciones = '';


      if (
        reserva.Estado ===
        'RESERVADA'
      ) {

        acciones = `

          <button
            onclick="checkin('${reserva.ReservaID}')">
            Check-in
          </button>

          <button
            onclick="cancelar('${reserva.ReservaID}')">
            Cancelar
          </button>

          <button
            onclick="noShow('${reserva.ReservaID}')">
            No Show
          </button>
        `;
      }


      if (
        reserva.Estado ===
        'CHECKIN'
      ) {

        acciones = `

          <button
            onclick="checkout('${reserva.ReservaID}')">
            Salida
          </button>
        `;
      }


      tr.innerHTML = `

        <td>
          ${reserva.HoraInicio}
          -
          ${reserva.HoraFin}
        </td>

        <td>
          ${reserva.ClienteID}
        </td>

        <td>
          ${reserva.Tipo}
        </td>

        <td>
          ${reserva.Cantidad}
        </td>

        <td>
          ${reserva.Estado}
        </td>

        <td class="acciones">
          ${acciones}
        </td>
      `;


      tbody.appendChild(
        tr
      );
    }
  );
}


async function checkin(
  reservaId
) {

  if (
    !confirm(
      '¿Confirmar ingreso?'
    )
  ) return;


  const resultado =
    await api({

      action:
        'checkin',

      reservaId,

      usuario:
        'STAFF'
    });


  alert(
    resultado.mensaje
  );

  cargarHoy();
}


async function checkout(
  reservaId
) {

  if (
    !confirm(
      '¿Registrar salida?'
    )
  ) return;


  const resultado =
    await api({

      action:
        'checkout',

      reservaId,

      usuario:
        'STAFF'
    });


  alert(
    resultado.mensaje
  );

  cargarHoy();
}


async function cancelar(
  reservaId
) {

  if (
    !confirm(
      '¿Cancelar esta reserva?'
    )
  ) return;


  const resultado =
    await api({

      action:
        'cancelarReserva',

      reservaId,

      usuario:
        'STAFF'
    });


  alert(
    resultado.mensaje
  );

  cargarHoy();
}


async function noShow(
  reservaId
) {

  if (
    !confirm(
      '¿Marcar esta reserva como NO SHOW?'
    )
  ) return;


  const resultado =
    await api({

      action:
        'marcarNoShow',

      reservaId,

      usuario:
        'STAFF'
    });


  alert(
    resultado.mensaje
  );

  cargarHoy();
}


cargarHoy();

</script>

</body>

</html>
