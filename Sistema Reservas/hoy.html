<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ironwall - Hoy</title>

<style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-SemiBold.ttf");
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* --- CABECERA Y NAVEGACIÓN --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }
    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px; /* Espacio entre el logo y el texto */
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }
    
    /* Control del tamaño del logo dentro del botón */
    .logo-btn {
      height: 36px;
      width: auto; /* Permite que el ancho se ajuste solo */
      object-fit: contain;
      transform: scale(1.8); /* Agranda la imagen visualmente un 40% omitiendo sus bordes vacíos */
      transform-origin: center;
    }
    
    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }
 

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* --- DISPOSICIÓN EN FILA DE TARJETAS SUPERIORES --- */
    .grid-superior {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 20px;
      margin-bottom: 20px;
      align-items: stretch;
    }

    /* --- TARJETAS --- */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      border: 1px solid #e8ecef;
    }

    .titulo-card {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      letter-spacing: .5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* --- INDICADORES --- */
    .indicadores {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 10px;
    }

    .indicador-item {
      background: #f8f9fa;
      border: 1px solid #edf0f2;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
    }

    .indicador-item span {
      font-size: 11px;
      color: #666;
      margin-bottom: 2px;
    }

    .indicador-item strong {
      font-size: 18px;
      font-weight: 700;
      color: #111;
    }

    /* --- FORMULARIOS --- */
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input,
    select {
      width: 100%;
      height: 41px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    /* --- BOTONES --- */
    button,
    .btn {
      width: 100%;
      height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-consultar {
      background-color: #e0e0e0;
      color: #333333;
    }

    .btn-consultar:hover {
      background-color: #d0d0d0;
    }

    .btn-danger {
      background-color: #fee2e2;
      color: #dc2626;
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
      width: auto;
      border-radius: 6px;
    }

    .btn-danger:hover {
      background-color: #fca5a5;
    }

    /* --- MENSAJES --- */
    .mensaje {
      margin-top: 10px;
      font-weight: 700;
      font-size: 12px;
      padding: 8px;
      border-radius: 6px;
    }

    .exito {
      background: #dcfce7;
      color: #15803d;
    }

    .error {
      background: #fee2e2;
      color: #dc2626;
    }

    /* --- CONSULTA Y TABLA --- */
    .fila-consulta {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .tabla-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf0f2;
      text-align: left;
    }

    th {
      color: #666;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    /* Estilos para los badges de estado */
    .badge-estado {
      font-weight: 600;
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      display: inline-block;
      text-transform: uppercase;
    }

    .estado-reservada {
      background-color: #fef3c7;
      color: #92400e;
    }

    .estado-checkin {
      background-color: #dcfce7;
      color: #15803d;
    }

    .estado-cancelada, .estado-noshow {
      background-color: #fee2e2;
      color: #dc2626;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 820px) {
      .grid-superior {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }

      .card {
        padding: 16px;
      }
    }
</style>
</head>

<body>
  <div class="container">
    <!-- NAVEGACIÓN Y CABECERA -->
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome">
          <img src="img/logosn.png" alt="Logo" class="logo-btn">
          <span>←Inicio</span>
      </a>
    </div>
    
    <h1>Reservas de Hoy</h1>
    <p class="subtitulo">Panel operativo del día</p>

    <!-- BLOQUE HORIZONTAL: FECHA Y RESUMEN -->
    <div class="grid-superior">
      <!-- TARJETA 1: FILTRO FECHA -->
      <div class="card">
        <div class="titulo-card">Fecha de Consulta</div>
        <div class="fila-consulta">
          <div>
            <input id="fecha" type="date">
          </div>
          <button class="btn btn-consultar" onclick="cargarHoy()">
            Actualizar
          </button>
        </div>
        <div id="mensaje"></div>
      </div>

      <!-- TARJETA 2: INDICADORES DEL DÍA -->
      <div class="card">
        <div class="titulo-card">Resumen del Día</div>
        <div class="indicadores">
          <div class="indicador-item">
            <span>Capacidad</span>
            <strong id="capacidad">0</strong>
          </div>
          <div class="indicador-item">
            <span>Reservados</span>
            <strong id="reservado">0</strong>
          </div>
          <div class="indicador-item">
            <span>Dentro ahora</span>
            <strong id="dentro">0</strong>
          </div>
          <div class="indicador-item">
            <span>Disponibles</span>
            <strong id="disponibles">0</strong>
          </div>
          <div class="indicador-item">
            <span>Clases</span>
            <strong id="clases">0</strong>
          </div>
        </div>
      </div>
    </div>

    <!-- TARJETA 3: TABLA DE RESERVAS -->
    <div class="card">
      <div class="titulo-card">Reservas Programadas</div>
      
      <div class="tabla-container">
        <table>
          <thead>
            <tr>
              <th>Hora</th>
              <th>Cliente</th>
              <th>Tipo</th>
              <th>Cantidad</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaReservas"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';

    function fechaHoy() {
      const d = new Date();
      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, '0'),
        String(d.getDate()).padStart(2, '0')
      ].join('-');
    }

    document.getElementById('fecha').value = fechaHoy();

    // Función api mejorada con reintentos para soportar el "cold start" de Google Apps Script
    async function api(body, reintentos = 2) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          body: JSON.stringify(body)
        });
        return await response.json();
      } catch (error) {
        if (reintentos > 0) {
          // Si la primera llamada falla por timeout de servidor, espera 1.5s y reintenta
          await new Promise(resolve => setTimeout(resolve, 1500));
          return api(body, reintentos - 1);
        }
        throw error;
      }
    }

    async function cargarHoy() {
      const fecha = document.getElementById('fecha').value;
      const mensajeEl = document.getElementById('mensaje');
      mensajeEl.textContent = '';
      mensajeEl.className = 'mensaje';

      const btn = document.querySelector('.fila-consulta button');
      const textoOriginal = btn ? btn.innerText : 'Actualizar';

        
      if (btn) {
        btn.innerText = 'Consultando...';
        btn.disabled = true;
        btn.style.opacity = '0.7';
        btn.style.cursor = 'not-allowed';
      }

      try {
        const resultado = await api({
          action: 'resumenHoy',
          fecha
        });

        if (!resultado || !resultado.ok) {
          mensajeEl.textContent = resultado?.mensaje || 'Error al obtener datos';
          mensajeEl.className = 'mensaje error';
          if (btn) {
            btn.innerText = 'Error';
            btn.style.backgroundColor = '#fee2e2';
            btn.style.color = '#dc2626';
          }
          return;
        }
              // En tu función de renderizado en hoy.html:
        document.getElementById('cant-capacidad').innerText   = respuesta.capacidad;   // Ej: 30
        document.getElementById('cant-reservados').innerText  = respuesta.reservado;   // Ej: 7 (personas sin entrar)
        document.getElementById('cant-dentro').innerText      = respuesta.dentro;      // Ej: 3 (personas dentro)
        document.getElementById('cant-disponibles').innerText = respuesta.disponibles; // Ej: 20 (30 - 7 - 3)  
          
        /*document.getElementById('capacidad').textContent = resultado.capacidad || 0;
        document.getElementById('reservado').textContent = resultado.reservado || 0;
        document.getElementById('dentro').textContent = resultado.dentro || 0;
        document.getElementById('disponibles').textContent = resultado.disponibles || 0;*/
        document.getElementById('clases').textContent = resultado.clases ? resultado.clases.length : 0;

        pintarReservas(resultado.reservas || []);

        if (btn) {
          btn.innerText = '¡Actualizado!';
          btn.style.backgroundColor = '#dcfce7';
          btn.style.color = '#15803d';
        }
      } catch (error) {
        mensajeEl.textContent = 'Error al conectar con el servidor';
        mensajeEl.className = 'mensaje error';
        if (btn) {
          btn.innerText = 'Error';
          btn.style.backgroundColor = '#fee2e2';
          btn.style.color = '#dc2626';
        }
      } finally {
        if (btn) {
          setTimeout(() => {
            btn.innerText = textoOriginal;
            btn.disabled = false;
            btn.style.backgroundColor = '#e0e0e0';
            btn.style.color = '#333333';
            btn.style.opacity = '1';
            btn.style.cursor = 'pointer';
          }, 1500);
        }
      }
    }

    function pintarReservas(reservas) {
      const tbody = document.getElementById('tablaReservas');
      tbody.innerHTML = '';

      if (!reservas.length) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6" style="text-align: center; color: #666; padding: 24px;">
              No hay reservas para este día
            </td>
          </tr>`;
        return;
      }

      reservas.sort((a, b) => a.HoraInicio.localeCompare(b.HoraInicio));

      reservas.forEach(reserva => {
        const tr = document.createElement('tr');
        let acciones = '';

        if (reserva.Estado === 'RESERVADA') {
          acciones = `
            <div style="display: flex; gap: 6px; flex-wrap: wrap;">
              <button class="btn btn-consultar" style="height: 32px; padding: 0 10px; font-size: 12px; width: auto;" onclick="checkin('${reserva.ReservaID}')">Check-in</button>
              <button class="btn btn-danger" onclick="cancelar('${reserva.ReservaID}')">Cancelar</button>
              <button class="btn btn-danger" style="background-color: #f3f4f6; color: #4b5563;" onclick="noShow('${reserva.ReservaID}')">No Show</button>
            </div>
          `;
        }

        if (reserva.Estado === 'CHECKIN') {
          acciones = `
            <button class="btn btn-consultar" style="height: 32px; padding: 0 10px; font-size: 12px; width: auto;" onclick="checkout('${reserva.ReservaID}')">Salida</button>
          `;
        }

        // Obtener clase según estado
        let claseEstado = 'estado-reservada';
        if (reserva.Estado === 'CHECKIN') claseEstado = 'estado-checkin';
        if (reserva.Estado === 'CANCELADA') claseEstado = 'estado-cancelada';
        if (reserva.Estado === 'NOSHOW' || reserva.Estado === 'NO SHOW') claseEstado = 'estado-noshow';

        tr.innerHTML = `
          <td><strong>${reserva.HoraInicio} - ${reserva.HoraFin}</strong></td>
          <td>${reserva.ClienteID}</td>
          <td>${reserva.Tipo}</td>
          <td>${reserva.Cantidad}</td>
          <td><span class="badge-estado ${claseEstado}">${reserva.Estado}</span></td>
          <td>${acciones}</td>
        `;

        tbody.appendChild(tr);
      });
    }

    async function checkin(reservaId) {
      if (!confirm('¿Confirmar ingreso?')) return;
      const resultado = await api({ action: 'checkin', reservaId, usuario: 'STAFF' });
      alert(resultado.mensaje);
      cargarHoy();
    }

    async function checkout(reservaId) {
      if (!confirm('¿Registrar salida?')) return;
      const resultado = await api({ action: 'checkout', reservaId, usuario: 'STAFF' });
      alert(resultado.mensaje);
      cargarHoy();
    }

    async function cancelar(reservaId) {
      if (!confirm('¿Cancelar esta reserva?')) return;
      const resultado = await api({ action: 'cancelarReserva', reservaId, usuario: 'STAFF' });
      alert(resultado.mensaje);
      cargarHoy();
    }

    async function noShow(reservaId) {
      if (!confirm('¿Marcar esta reserva como NO SHOW?')) return;
      const resultado = await api({ action: 'marcarNoShow', reservaId, usuario: 'STAFF' });
      alert(resultado.mensaje);
      cargarHoy();
    }

    cargarHoy();
  </script>
</body>
</html>
