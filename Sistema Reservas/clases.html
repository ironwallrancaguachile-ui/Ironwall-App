<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironwall - Clases</title>
  <style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-SemiBold.ttf");
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* --- CABECERA Y NAVEGACIÓN --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }

    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }

    .nombreModulo {
      font-family: 'Archivo Extra Condensed', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #666;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* --- TARJETAS (CARDS) --- */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      border: 1px solid #e8ecef;
    }

    .titulo-card {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      letter-spacing: .5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* --- FORMULARIOS Y GRIDS --- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }

    .campo {
      display: flex;
      flex-direction: column;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input, select {
      width: 100%;
      height: 41px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    /* --- BOTONES --- */
    button, .btn {
      width: 100%;
      height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-primary {
      background-color: #191919;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #333333;
    }

    .btn-secondary {
      background-color: #e0e0e0;
      color: #333333;
      white-space: nowrap;
    }

    .btn-secondary:hover {
      background-color: #d0d0d0;
    }

    .btn-danger {
      background-color: #fee2e2;
      color: #dc2626;
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
      width: auto;
    }

    .btn-danger:hover {
      background-color: #fca5a5;
      color: #991b1b;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* --- LAYOUTS ESPECÍFICOS --- */
    .fila-consulta {
      display: flex;
      gap: 12px;
      align-items: end;
      max-width: 350px;
      margin-bottom: 16px;
    }

    /* --- TABLA --- */
    .tabla-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf0f2;
      text-align: left;
    }

    th {
      color: #666;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ADAPTACIÓN RESPONSIVE */
    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }

      .card {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .fila-consulta {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome"> ← Inicio </a>
      <span class="nombreModulo">Reservas</span>
    </div>

    <h1>Clases</h1>
    <p class="subtitulo">Gestión e inscripción de nuevas clases programadas</p>

    <!-- CARD NUEVA CLASE -->
    <div class="card">
      <div class="titulo-card">Nueva clase</div>
      <div class="form-grid">
        <div class="campo">
          <label for="nombre">Nombre de clase</label>
          <input id="nombre" placeholder="Ej: Crossfit">
        </div>
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input id="fecha" type="date">
        </div>
        <div class="campo">
          <label for="horaInicio">Hora Inicio</label>
          <input id="horaInicio" type="time">
        </div>
        <div class="campo">
          <label for="horaFin">Hora Fin</label>
          <input id="horaFin" type="time">
        </div>
        <div class="campo">
          <label for="capacidad">Capacidad</label>
          <input id="capacidad" type="number" min="1" value="8">
        </div>
        <div class="campo">
          <label for="instructorId">ID Instructor</label>
          <input id="instructorId" placeholder="Ej: INST-01">
        </div>
        <div class="campo">
          <button class="btn-primary" onclick="crearClase()">Crear clase</button>
        </div>
      </div>
    </div>

    <!-- CARD CLASES DEL DÍA -->
    <div class="card">
      <div class="titulo-card">Clases del día</div>
      <div class="fila-consulta">
        <div class="campo" style="flex: 1;">
          <label for="fechaConsulta">Consultar Fecha</label>
          <input id="fechaConsulta" type="date">
        </div>
        <button class="btn-secondary" style="width: auto;" onclick="cargarClases()">Actualizar</button>
      </div>

      <div class="tabla-container">
        <table>
          <thead>
            <tr>
              <th>Clase</th>
              <th>Hora</th>
              <th>Capacidad</th>
              <th>Instructor</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';

    function fechaHoy() {
      const d = new Date();
      return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
    }

    document.getElementById('fecha').value = fechaHoy();
    document.getElementById('fechaConsulta').value = fechaHoy();

    async function api(body) {
      const response = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
      return response.json();
    }

    async function crearClase() {
      const nombre = document.getElementById('nombre').value.trim();
      const fecha = document.getElementById('fecha').value;
      const horaInicio = document.getElementById('horaInicio').value;
      const horaFin = document.getElementById('horaFin').value;
      const capacidad = document.getElementById('capacidad').value;
      const instructorId = document.getElementById('instructorId').value.trim();

      if (!nombre || !fecha || !horaInicio || !horaFin || !capacidad || !instructorId) {
        alert('Por favor, completa todas las casillas antes de crear la clase.');
        return;
      }

      const btn = document.querySelector('.btn-primary');
      const textoOriginal = btn.innerText;

      btn.innerText = 'Creando...';
      btn.disabled = true;

      try {
        const resultado = await api({ action: 'crearClase', nombre, fecha, horaInicio, horaFin, capacidad, instructorId, usuario: 'STAFF' });
        if (resultado.ok) {
          btn.innerText = '¡Creada con éxito!';
          btn.style.backgroundColor = '#16a34a';

          document.getElementById('nombre').value = '';
          document.getElementById('horaInicio').value = '';
          document.getElementById('horaFin').value = '';
          document.getElementById('capacidad').value = '8';
          document.getElementById('instructorId').value = '';

          cargarClases();
        } else {
          alert(resultado.mensaje || 'Error al crear la clase');
        }
      } catch (error) {
        alert('Ocurrió un error de conexión con el servidor');
      } finally {
        setTimeout(() => {
          btn.innerText = textoOriginal;
          btn.disabled = false;
          btn.style.backgroundColor = '';
        }, 2000);
      }
    }

    async function cargarClases() {
      const btn = document.querySelector('.btn-secondary');
      const textoOriginal = btn.innerText;

      btn.innerText = 'Consultando...';
      btn.disabled = true;

      const fecha = document.getElementById('fechaConsulta').value;

      try {
        const resultado = await api({ action: 'listarClasesFecha', fecha });
        const tbody = document.getElementById('tabla');
        tbody.innerHTML = '';

        if (!resultado.ok) {
          alert(resultado.mensaje || 'Error al obtener clases');
          return;
        }

        if (resultado.clases.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align: center; color: #888; padding: 20px;">
                No hay clases programadas para esta fecha
              </td>
            </tr>`;
        } else {
          resultado.clases.forEach(clase => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>${clase.Nombre}</td>
              <td>${clase.HoraInicio} - ${clase.HoraFin}</td>
              <td>${clase.Capacidad}</td>
              <td>${clase.InstructorID || '-'}</td>
              <td>${clase.Estado}</td>
              <td>
                ${clase.Estado === 'ACTIVA' ? `<button class="btn-danger" onclick="cancelarClase('${clase.ClaseID}')">Cancelar</button>` : ''}
              </td>
            `;
            tbody.appendChild(tr);
          });
        }

        btn.innerText = '¡Actualizado!';
        btn.style.backgroundColor = '#dcfce7';
        btn.style.color = '#15803d';
      } catch (error) {
        alert('Error al conectar con el servidor');
      } finally {
        setTimeout(() => {
          btn.innerText = textoOriginal;
          btn.disabled = false;
          btn.style.backgroundColor = '';
          btn.style.color = '';
        }, 1500);
      }
    }

    async function cancelarClase(claseId) {
      if (!confirm('¿Cancelar esta clase?')) {
        return;
      }
      const resultado = await api({ action: 'cancelarClase', claseId, usuario: 'STAFF' });
      alert(resultado.mensaje);
      cargarClases();
    }

    cargarClases();
  </script>
</body>

</html>
