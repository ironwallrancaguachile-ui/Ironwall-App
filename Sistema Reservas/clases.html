<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Ironwall - Clases</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
  max-width: 1100px; /* Corregido a 1100px para coincidir con container */
  margin: 0 auto;
  padding: 24px 16px 60px;
  background: #f7f7f7;
  color: #222;
}

h1 {
  font-size: 20px;
  margin-bottom: 16px;
}

.sub {
  color: #666;
  font-size: 12px;
  margin: 0 0 10px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  margin-bottom: 6px;
}

select, input {
  width: 100%;
  padding: 10px;
  font-size: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: #fff;
  transition: border-color 0.2s, box-shadow 0.2s;
}

select:focus, input:focus {
  outline: none;
  border-color: #222;
  box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
}

.container {
  width: 100%;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 16px; /* Separación con respecto al botón de abajo */
}

/* --- ESTILOS DE BOTONES --- */
button {
  width: 100%;
  padding: 10px 16px;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 0.2s, transform 0.1s;
}

/* Botón Principal (Crear / Guardar) */
.btn-primary {
  background-color: #222222;
  color: #ffffff;
}

.btn-primary:hover {
  background-color: #444444;
}

.btn-primary:active {
  transform: scale(0.99);
}

/* Botón Secundario (Actualizar / Filtrar) */
.btn-secondary {
  background-color: #e0e0e0;
  color: #333333;
  margin-top: 8px;
}

.btn-secondary:hover {
  background-color: #d0d0d0;
}

/* Botón Peligro / Cancelar */
.btn-danger {
  background-color: #fee2e2;
  color: #dc2626;
  padding: 6px 12px;
  font-size: 12px;
  width: auto;
}

.btn-danger:hover {
  background-color: #fca5a5;
  color: #991b1b;
}

/* --- TABLA --- */
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  margin-top: 12px;
}

th, td {
  padding: 12px 10px;
  border-bottom: 1px solid #eee;
  text-align: left;
}

th {
  color: #666;
  font-weight: 600;
}

/* --- NAVEGACIÓN --- */
.barraNavegacion {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 auto 16px;
  padding: 8px 0;
}

.btnHome {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #ffffff;
  color: #222;
  text-decoration: none;
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  transition: transform .2s, box-shadow .2s;
}

.btnHome:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

.nombreModulo {
  font-family: 'Archivo Extra Condensed', sans-serif;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #666;
}

</style>

</head>

<body>

<div class="barraNavegacion">
  <a href="index.html" class="btnHome">
    ← Inicio
  </a>
  <span class="nombreModulo">
    Reservas
  </span>

</div>      

<div class="container">
<h1>Clases</h1>

<div class="card">
  <h1>Nueva clase</h1>
  <div class="grid">
    <input id="nombre" placeholder="Nombre de clase">
    <input id="fecha" type="date">
    <input id="horaInicio" type="time">
    <input id="horaFin" type="time">
    <input id="capacidad" type="number" min="1" value="8">
    <input id="instructorId" placeholder="InstructorID">
    <!-- El botón ahora va aquí adentro -->
    <button class="btn-primary" onclick="crearClase()">Crear clase</button>
  </div>
</div>
</div>

<div class="card">
<h1>Clases del día</h1>
<div style="display: flex; gap: 10px; align-items: center; margin-bottom: 12px;">
  <input id="fechaConsulta" type="date" style="max-width: 200px;">
  <button class="btn-secondary" style="margin: 0; width: auto;" onclick="cargarClases()">Actualizar</button>
</div>
<br><br>
<table>
<thead>
<tr>
<th>Clase</th>
<th>Hora</th>
<th>Capacidad</th>
<th>Instructor</th>
<th>Estado</th>
<th></th>
</tr>
</thead>
<tbody
  id="tabla">
</tbody>
</table>
</div>
</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


function fechaHoy() {

  const d =
    new Date();

  return [
    d.getFullYear(),
    String(
      d.getMonth()+1
    ).padStart(2,'0'),
    String(
      d.getDate()
    ).padStart(2,'0')
  ].join('-');
}


document
  .getElementById(
    'fecha'
  ).value =
  fechaHoy();


document
  .getElementById(
    'fechaConsulta'
  ).value =
  fechaHoy();


async function api(body) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body:
          JSON.stringify(body)
      }
    );

  return response.json();
}

async function crearClase() {
  // 1. Obtener la referencia al botón
  const btn = document.querySelector('.btn-primary');
  const textoOriginal = btn.innerText;

  // 2. Cambiar el botón a estado "En proceso..." y deshabilitarlo
  btn.innerText = 'Creando...';
  btn.disabled = true;
  btn.style.opacity = '0.7';
  btn.style.cursor = 'not-allowed';

  try {
    const resultado = await api({
      action: 'crearClase',
      nombre: document.getElementById('nombre').value,
      fecha: document.getElementById('fecha').value,
      horaInicio: document.getElementById('horaInicio').value,
      horaFin: document.getElementById('horaFin').value,
      capacidad: document.getElementById('capacidad').value,
      instructorId: document.getElementById('instructorId').value,
      usuario: 'STAFF'
    });

    if (resultado.ok) {
      // 3. Estado de éxito temporal en el botón
      btn.innerText = '¡Creada con éxito!';
      btn.style.backgroundColor = '#16a34a'; // Verde

      // 4. Limpiar los campos del formulario
      document.getElementById('nombre').value = '';
      document.getElementById('horaInicio').value = '';
      document.getElementById('horaFin').value = '';
      document.getElementById('capacidad').value = '8'; // Valor por defecto
      document.getElementById('instructorId').value = '';
      // La fecha se mantiene en hoy para comodidad del usuario

      // 5. Actualizar la tabla
      cargarClases();
    } else {
      alert(resultado.mensaje || 'Error al crear la clase');
    }
  } catch (error) {
    alert('Ocurrió un error de conexión');
  } finally {
    // 6. Volver el botón a su estado inicial después de 2 segundos
    setTimeout(() => {
      btn.innerText = textoOriginal;
      btn.disabled = false;
      btn.style.backgroundColor = '#222222';
      btn.style.opacity = '1';
      btn.style.cursor = 'pointer';
    }, 2000);
  }
}

async function cargarClases() {
  // 1. Obtener la referencia al botón Actualizar
  const btn = document.querySelector('.btn-secondary');
  const textoOriginal = btn.innerText;

  // 2. Estado de carga
  btn.innerText = 'Consultando...';
  btn.disabled = true;
  btn.style.opacity = '0.7';
  btn.style.cursor = 'not-allowed';

  const fecha = document.getElementById('fechaConsulta').value;

  try {
    const resultado = await api({ action: 'listarClasesFecha', fecha });
    const tbody = document.getElementById('tabla');
    tbody.innerHTML = '';

    if (!resultado.ok) {
      alert(resultado.mensaje || 'Error al obtener clases');
      return;
    }

    // Si no hay clases en esa fecha, mostrar un mensaje claro en la tabla
    if (resultado.clases.length === 0) {
      tbody.innerHTML = `
        <tr>
          <td colspan="6" style="text-align: center; color: #888; padding: 20px;">
            No hay clases programadas para esta fecha
          </td>
        </tr>`;
    } else {
      resultado.clases.forEach(clase => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${clase.Nombre}</td>
          <td>${clase.HoraInicio} - ${clase.HoraFin}</td>
          <td>${clase.Capacidad}</td>
          <td>${clase.InstructorID || '-'}</td>
          <td>${clase.Estado}</td>
          <td>
            ${clase.Estado === 'ACTIVA' 
              ? `<button class="btn-danger" onclick="cancelarClase('${clase.ClaseID}')">Cancelar</button>` 
              : ''}
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 3. Feedback visual de éxito
    btn.innerText = '¡Actualizado!';
    btn.style.backgroundColor = '#dcfce7'; // Verde suave para botón secundario
    btn.style.color = '#15803d';

  } catch (error) {
    alert('Error al conectar con el servidor');
  } finally {
    // 4. Restaurar botón después de 1.5 segundos
    setTimeout(() => {
      btn.innerText = textoOriginal;
      btn.disabled = false;
      btn.style.backgroundColor = '#e0e0e0';
      btn.style.color = '#333333';
      btn.style.opacity = '1';
      btn.style.cursor = 'pointer';
    }, 1500);
  }
}

async function cancelarClase( claseId) {
  if (!confirm('¿Cancelar esta clase?') ) { return;}
  const resultado =
    await api({
      action:
        'cancelarClase',
      claseId,
      usuario:
        'STAFF'
    });


  alert(
    resultado.mensaje
  );


  cargarClases();
}


cargarClases();

</script>

</body>

</html>
