<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironwall Clases</title>
  <style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }
    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-SemiBold.ttf");
      font-weight: 600;
      font-display: swap;
    }
    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* --- CABECERA Y NAVEGACIÓN --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }

    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* --- TARJETAS (CARDS) --- */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      border: 1px solid #e8ecef;
    }

    .titulo-card {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      letter-spacing: .5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* --- INDICADORES Y MÉTRICAS COMPACTAS --- */
    .indicadores {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 20px;
    }

    .indicador-item {
      background: #f8f9fa;
      border: 1px solid #edf0f2;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
    }

    .indicador-item span {
      font-size: 11px;
      color: #666;
      margin-bottom: 2px;
    }

    .indicador-item strong {
      font-size: 18px;
      font-weight: 700;
      color: #111;
    }

    /* --- FORMULARIOS Y GRID --- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input, select {
      width: 100%;
      height: 41px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    /* --- BOTONES INTERACTIVOS --- */
    button, .btn {
      width: 100%;
      height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-consultar {
      background-color: #e0e0e0;
      color: #333333;
    }

    .btn-consultar:hover {
      background-color: #d0d0d0;
    }

    .btn-reservar {
      background-color: #191919;
      color: #ffffff;
      margin-top: 18px;
    }

    .btn-reservar:hover {
      background-color: #333333;
    }

    .btn-danger {
      background-color: #fee2e2;
      color: #dc2626;
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
      width: auto;
      border-radius: 6px;
    }

    .btn-danger:hover {
      background-color: #fca5a5;
    }

    .btn:disabled, .btn-reservar:disabled, button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn:active:not(:disabled), button:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* --- MENSAJES DE ESTADO --- */
    #claseBox {
      display: none;
    }

    .mensaje {
      margin-top: 12px;
      font-weight: 700;
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
    }

    .exito {
      background: #dcfce7;
      color: #15803d;
    }

    .error {
      background: #fee2e2;
      color: #dc2626;
    }

    /* --- LAYOUT FILAS DE CONSULTA Y TABLA --- */
    .fila-consulta {
      display: flex;
      gap: 12px;
      align-items: end;
      max-width: 380px;
      margin-bottom: 16px;
    }

    .tabla-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf0f2;
      text-align: left;
    }

    th {
      color: #666;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ADAPTACIÓN RESPONSIVE */
    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }
      .card {
        padding: 16px;
      }
      .fila-consulta {
        max-width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome"> ← Inicio </a>
    </div>

    <h1>Ironwall Clases</h1>
    <p class="subtitulo">Gestión e inscripción de clases programadas</p>

    <!-- INDICADORES -->
    <div class="indicadores">
      <div class="indicador-item">
        <span>Total del Día</span>
        <strong id="indTotal">0</strong>
      </div>
      <div class="indicador-item">
        <span>Activas</span>
        <strong id="indActivas">0</strong>
      </div>
      <div class="indicador-item">
        <span>Canceladas</span>
        <strong id="indCanceladas">0</strong>
      </div>
    </div>

    <!-- CARD CREAR CLASE -->
    <div class="card">
      <div class="titulo-card">Nueva Clase</div>
      <div class="form-grid">
        <div>
          <label for="nombre">Nombre de la clase</label>
          <input id="nombre" placeholder="Ej: Crossfit">
        </div>
        <div>
          <label for="fecha">Fecha</label>
          <input id="fecha" type="date">
        </div>
        <div>
          <label for="horaInicio">Hora Inicio</label>
          <input id="horaInicio" type="time">
        </div>
        <div>
          <label for="horaFin">Hora Fin</label>
          <input id="horaFin" type="time">
        </div>
        <div>
          <label for="capacidad">Capacidad</label>
          <input id="capacidad" type="number" min="1" value="8">
        </div>
        <div>
          <label for="instructorId">ID Instructor</label>
          <input id="instructorId" placeholder="Ej: INST-01">
        </div>
      </div>
      <button class="btn-reservar" id="btnCrear" onclick="crearClase()">Crear Clase</button>
      <div id="msj" class="mensaje" style="display:none;"></div>
    </div>

    <!-- CARD CONSULTA Y TABLA -->
    <div class="card">
      <div class="titulo-card">Clases del Día</div>
      <div class="fila-consulta">
        <div style="flex: 1;">
          <label for="fechaConsulta">Consultar Fecha</label>
          <input id="fechaConsulta" type="date">
        </div>
        <button class="btn-consultar" id="btnConsultar" style="width: auto; padding: 0 20px;" onclick="cargarClases()">Consultar</button>
      </div>

      <div class="tabla-container">
        <table>
          <thead>
            <tr>
              <th>Clase</th>
              <th>Horario</th>
              <th>Capacidad</th>
              <th>Instructor</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>
          </thead>
          <tbody id="tabla">
            <tr>
              <td colspan="6" style="text-align: center; color: #888; padding: 20px;">Cargando clases...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';

    function fechaHoy() {
      const d = new Date();
      return [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
    }

    document.getElementById('fecha').value = fechaHoy();
    document.getElementById('fechaConsulta').value = fechaHoy();

    async function api(body) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      return response.json();
    }

    function mostrarMensaje(texto, esError = false) {
      const msj = document.getElementById('msj');
      msj.className = `mensaje ${esError ? 'error' : 'exito'}`;
      msj.innerText = texto;
      msj.style.display = 'block';
    }

    async function crearClase() {
      const nombre = document.getElementById('nombre').value.trim();
      const fecha = document.getElementById('fecha').value;
      const horaInicio = document.getElementById('horaInicio').value;
      const horaFin = document.getElementById('horaFin').value;
      const capacidad = document.getElementById('capacidad').value;
      const instructorId = document.getElementById('instructorId').value.trim();
      const msj = document.getElementById('msj');

      msj.style.display = 'none';

      if (!nombre || !fecha || !horaInicio || !horaFin || !capacidad || !instructorId) {
        mostrarMensaje('Por favor completa todos los campos.', true);
        return;
      }

      const btn = document.getElementById('btnCrear');
      btn.innerText = 'Creando clase...';
      btn.disabled = true;

      try {
        const resultado = await api({
          action: 'crearClase',
          nombre,
          fecha,
          horaInicio,
          horaFin,
          capacidad,
          instructorId,
          creadoPor: 'STAFF'
        });

        if (resultado.ok) {
          mostrarMensaje('¡Clase creada exitosamente!');
          document.getElementById('nombre').value = '';
          document.getElementById('horaInicio').value = '';
          document.getElementById('horaFin').value = '';
          document.getElementById('capacidad').value = '8';
          document.getElementById('instructorId').value = '';

          cargarClases();
        } else {
          mostrarMensaje(resultado.mensaje || 'Error en el servidor al crear la clase', true);
        }
      } catch (error) {
        mostrarMensaje('Error de conexión con el servidor', true);
      } finally {
        btn.innerText = 'Crear Clase';
        btn.disabled = false;
      }
    }

    async function cargarClases() {
      const btn = document.getElementById('btnConsultar');
      const fecha = document.getElementById('fechaConsulta').value;

      btn.innerText = 'Buscando...';
      btn.disabled = true;

      try {
        const resultado = await api({ action: 'listarClasesFecha', fecha });
        const tbody = document.getElementById('tabla');
        tbody.innerHTML = '';

        if (!resultado.ok) {
          mostrarMensaje(resultado.mensaje || 'Error al obtener las clases', true);
          btn.innerText = 'Consultar';
          btn.disabled = false;
          return;
        }

        const clases = resultado.clases || [];
        
        // Actualizar Indicadores
        document.getElementById('indTotal').innerText = clases.length;
        document.getElementById('indActivas').innerText = clases.filter(c => c.Estado === 'ACTIVA').length;
        document.getElementById('indCanceladas').innerText = clases.filter(c => c.Estado === 'CANCELADA').length;

        if (clases.length === 0) {
          tbody.innerHTML = `
            <tr>
              <td colspan="6" style="text-align: center; color: #888; padding: 20px;">
                No hay clases programadas para esta fecha
              </td>
            </tr>`;
        } else {
          clases.forEach(clase => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td><strong>${clase.Nombre}</strong></td>
              <td>${clase.HoraInicio} - ${clase.HoraFin}</td>
              <td>${clase.Capacidad}</td>
              <td>${clase.InstructorID || '-'}</td>
              <td><span style="font-weight: 600; color: ${clase.Estado === 'ACTIVA' ? '#16a34a' : '#dc2626'}">${clase.Estado}</span></td>
              <td>
                ${clase.Estado === 'ACTIVA' ? `<button class="btn-danger" onclick="cancelarClase('${clase.ClaseID}')">Cancelar</button>` : '-'}
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (error) {
        mostrarMensaje('Error de conexión al cargar la lista', true);
      } finally {
        btn.innerText = 'Consultar';
        btn.disabled = false;
      }
    }

    async function cancelarClase(claseId) {
      if (!confirm('¿Seguro que deseas cancelar esta clase?')) {
        return;
      }

      try {
        const resultado = await api({ action: 'cancelarClase', claseId, canceladoPor: 'STAFF' });
        if (resultado.ok) {
          cargarClases();
        } else {
          alert(resultado.mensaje || 'No se pudo cancelar la clase');
        }
      } catch (e) {
        alert('Error de conexión al intentar cancelar');
      }
    }

    // Carga inicial
    cargarClases();
  </script>
</body>

</html>
