<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironwall Clases</title>

  <style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* --- CABECERA Y NAVEGACIÓN --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px; /* Espacio entre el logo y el texto */
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }
    
    /* Control del tamaño del logo dentro del botón */
    .logo-btn {
      height: 36px;
      width: auto; /* Permite que el ancho se ajuste solo */
      object-fit: contain;
      transform: scale(1.8); /* Agranda la imagen visualmente un 40% omitiendo sus bordes vacíos */
      transform-origin: center;
    }
    
    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }
    /* --- DISPOSICIÓN EN FILA DE TARJETAS SUPERIORES --- */
    .grid-superior {
      display: block;
      gap: 20px;
      margin-bottom: 20px;
      align-items: stretch;
    }
    /* --- TARJETAS --- */

    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      border: 1px solid #e8ecef;
    }

    .titulo-card {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      letter-spacing: .5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* --- INDICADORES --- */
    .indicadores {
      display: flex; /* Cambiado a flexbox horizontal */
      flex-direction: row;
      gap: 12px;
      margin-bottom: 0;
    }

    .indicador-item {
      flex: 1; /* Hace que todos los elementos compartan el mismo ancho horizontal */
      background: #f8f9fa;
      border: 1px solid #edf0f2;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
    }

    .indicador-item span {
      font-size: 11px;
      color: #666;
      margin-bottom: 2px;
    }

    .indicador-item strong {
      font-size: 18px;
      font-weight: 700;
      color: #111;
    }

    /* --- FORMULARIOS --- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input,
    select {
      width: 100%;
      height: 41px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    /* --- HORARIO CALCULADO --- */
    .horario-calculado {
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 8px;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      color: #333;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .horario-calculado.activo {
      background: #eef6ff;
      border-color: #d5e7f8;
      color: #222;
    }

    .horario-calculado.error-horario {
      background: #fee2e2;
      border-color: #fecaca;
      color: #dc2626;
    }

    /* --- BOTONES --- */
    button,
    .btn {
      width: 100%;
      height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-consultar {
      background-color: #e0e0e0;
      color: #333333;
    }

    .btn-consultar:hover {
      background-color: #d0d0d0;
    }

    .btn-reservar {
      background-color: #191919;
      color: #ffffff;
      margin-top: 18px;
    }

    .btn-reservar:hover {
      background-color: #333333;
    }

    .btn-danger {
      background-color: #fee2e2;
      color: #dc2626;
      height: 32px;
      padding: 0 12px;
      font-size: 12px;
      width: auto;
      border-radius: 6px;
    }

    .btn-danger:hover {
      background-color: #fca5a5;
    }

    .btn:disabled,
    .btn-reservar:disabled,
    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    .btn:active:not(:disabled),
    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* --- MENSAJES --- */
    .mensaje {
      margin-top: 12px;
      font-weight: 700;
      font-size: 13px;
      padding: 10px;
      border-radius: 8px;
    }

    .exito {
      background: #dcfce7;
      color: #15803d;
    }

    .error {
      background: #fee2e2;
      color: #dc2626;
    }

    /* --- CONSULTA Y TABLA --- */
    .fila-consulta {
      display: flex;
      gap: 12px;
      align-items: end;
      max-width: 380px;
      margin-bottom: 16px;
    }

    .tabla-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid #edf0f2;
      text-align: left;
    }

    th {
      color: #666;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }
      .indicadores {
        flex-direction: column; /* Se vuelven vertical solo en teléfonos pequeños */
      }
      .card {
        padding: 16px;
      }

      .fila-consulta {
        max-width: 100%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- NAVEGACIÓN Y CABECERA -->
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome">
          <img src="img/logosn.png" alt="Logo" class="logo-btn">
          <span>←Inicio</span>
      </a>
    </div>

    <h1>Ironwall Clases</h1>
    <p class="subtitulo">
      Gestión e inscripción de clases programadas
    </p>

    <!-- ==================================================
         INDICADORES
    ================================================== -->
      <!-- TARJETA 2: INDICADORES DEL DÍA -->
    <div class="grid-superior">
      <div class="card">
        <div class="titulo-card">Resumen del Día</div>
        <div class="indicadores">
          <div class="indicador-item">
            <span>Total del Día</span>
            <strong id="indTotal">0</strong>
          </div>
          <div class="indicador-item">
            <span>Activas</span>
            <strong id="indActivas">0</strong>
          </div>
          <div class="indicador-item">
            <span>Canceladas</span>
            <strong id="indCanceladas">0</strong>
          </div>
        </div>
      </div>
     </div>

    <!-- ==================================================
         CREAR CLASE
    ================================================== -->

    <div class="card">

      <div class="titulo-card">
        Nueva Clase
      </div>

      <div class="form-grid">

        <!-- NOMBRE -->
        <div>
          <label for="nombre"> Nombre de la clase </label>
          <input id="nombre" placeholder="Ej: Boulder Inicial">
        </div>

        <!-- FECHA -->
        <div>
          <label for="fecha"> Fecha </label>
          <input id="fecha"  type="date">
        </div>


        <!-- HORA INICIO -->
        <div>
          <label for="horaInicio"> Hora Inicio  </label>
          <select id="horaInicio">
            <option value=""> Selecciona una hora </option>
          </select>
        </div>

        <!-- DURACIÓN -->
        <div>
          <label for="duracion">  Duración </label>
          <select id="duracion">
            <option value="1"> 1 hora </option>
            <option value="2" selected> 2 horas </option>
            <option value="3"> 3 horas  </option>
            <option value="4"> 4 horas  </option>
          </select>
        </div>

        <!-- CAPACIDAD -->
        <div>
          <label for="capacidad"> Capacidad </label>
          <input id="capacidad" type="number" min="1" value="8">
        </div>

        <!-- INSTRUCTOR -->
        <div>
          <label for="instructorId"> ID Instructor</label>
          <input id="instructorId" placeholder="Ej: INST-01">
        </div>
        
      <!-- HORARIO CALCULADO (este era el que faltaba) -->
      <div id="horarioCalculado" class="horario-calculado">
        Selecciona hora de inicio y duración
      </div>
      <!-- CREAR -->
      <button class="btn-reservar" id="btnCrear" onclick="crearClase()">
        Crear Clase
      </button>
    </div>
      <!-- MENSAJE -->
      <div  id="msj" class="mensaje"  style="display:none;"> </div>
    </div>
    


    <!-- ==================================================
         CONSULTAR CLASES
    ================================================== -->

    <div class="card">

      <div class="titulo-card">
        Clases del Día
      </div>

      <div class="fila-consulta">

        <div style="flex: 1;">

          <label for="fechaConsulta">
            Consultar Fecha
          </label>

          <input
            id="fechaConsulta"
            type="date">

        </div>

        <button
          class="btn-consultar"
          id="btnConsultar"
          style="width:auto; padding:0 20px;"
          onclick="cargarClases()">
          Consultar
        </button>

      </div>


      <!-- TABLA -->

      <div class="tabla-container">

        <table>

          <thead>

            <tr>
              <th>Clase</th>
              <th>Horario</th>
              <th>Capacidad</th>
              <th>Instructor</th>
              <th>Estado</th>
              <th>Acción</th>
            </tr>

          </thead>

          <tbody id="tabla">

            <tr>

              <td
                colspan="6"
                style="
                  text-align:center;
                  color:#888;
                  padding:20px;
                ">
                Cargando clases...
              </td>

            </tr>

          </tbody>

        </table>

      </div>

    </div>

  </div>


  <script>

    /* ==================================================
       CONFIGURACIÓN
    ================================================== */

    const API_URL =
      'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


    /* ==================================================
       FECHA LOCAL
    ================================================== */

    function fechaHoy() {

      const d = new Date();

      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, '0'),
        String(d.getDate()).padStart(2, '0')
      ].join('-');

    }


    /* ==================================================
       API
    ================================================== */

    async function api(body) {

      const response = await fetch(API_URL, {

        method: 'POST',

        headers: {
          'Content-Type':
            'text/plain;charset=utf-8'
        },

        body: JSON.stringify(body)

      });

      return response.json();

    }


    /* ==================================================
       MENSAJES
    ================================================== */

    function mostrarMensaje(
      texto,
      esError = false
    ) {

      const msj =
        document.getElementById('msj');

      msj.className =
        `mensaje ${esError ? 'error' : 'exito'}`;

      msj.innerText = texto;

      msj.style.display = 'block';

    }


    /* ==================================================
       GENERAR HORAS
       Solo horas completas.
    ================================================== */

    function generarHoras() {

      const select =
        document.getElementById('horaInicio');

      select.innerHTML = `
        <option value="">
          Selecciona una hora
        </option>
      `;

      for (let hora = 0; hora < 24; hora++) {

        const valor =
          String(hora).padStart(2, '0') + ':00';

        const option =
          document.createElement('option');

        option.value = valor;
        option.textContent = valor;

        select.appendChild(option);

      }

    }


    /* ==================================================
       CALCULAR HORA FIN
    ================================================== */

    function calcularHoraFin() {

      const horaInicio =
        document.getElementById('horaInicio').value;

      const duracion =
        Number(
          document.getElementById('duracion').value
        );

      const box =
        document.getElementById('horarioCalculado');


      if (!horaInicio || !duracion) {

        box.className =
          'horario-calculado';

        box.innerText =
          'Selecciona hora de inicio y duración';

        return null;

      }


      const partes =
        horaInicio.split(':');

      const hora =
        Number(partes[0]);

      const minutos =
        Number(partes[1]);


      const inicioMinutos =
        hora * 60 + minutos;

      const finMinutos =
        inicioMinutos +
        duracion * 60;


      /*
       * No permitimos que una clase
       * termine al día siguiente.
       */

      if (finMinutos > 24 * 60) {

        box.className =
          'horario-calculado error-horario';

        box.innerText =
          'La duración seleccionada supera las 24:00. Elige una hora de inicio anterior.';

        return null;

      }


      const finHora =
        Math.floor(finMinutos / 60);

      const finMinuto =
        finMinutos % 60;


      const horaFin =
        String(finHora).padStart(2, '0') +
        ':' +
        String(finMinuto).padStart(2, '0');


      box.className =
        'horario-calculado activo';

      box.innerText =
        `Horario de la clase: ${horaInicio} – ${horaFin}`;


      return horaFin;

    }


    /* ==================================================
       CREAR CLASE
    ================================================== */
async function crearClase() {
  const nombre = document.getElementById('nombre').value.trim();
  const fecha = document.getElementById('fecha').value;
  const horaInicio = document.getElementById('horaInicio').value;
  const horaFin = calcularHoraFin();
  const capacidad = document.getElementById('capacidad').value;
  const instructorId = document.getElementById('instructorId').value.trim();
  const btn = document.getElementById('btnCrear');

  // Validar antes de deshabilitar
if (!nombre || !fecha || !horaInicio || !horaFin || !capacidad || !instructorId) {
    mostrarMensaje('Por favor completa todos los campos requeridos y verifica el horario.', true);
    return;
  }

  // 1. ESTADO EN PROGRESO (Bloquear botón y actualizar texto)
  const textoOriginal = btn.innerText;
  btn.innerText = 'Creando clase...';
  btn.disabled = true;

  try {
    const resultado = await api({
      action: 'crearClase',
      nombre: nombre,
      fecha: fecha,
      horaInicio: horaInicio,
      horaFin: horaFin,
      capacidad: Number(capacidad),
      instructorId: instructorId,
      usuario: 'STAFF',   // Prueba 'usuario' o 'creadoPor' según lo que reciba tu Apps Script
      creadoPor: 'STAFF'
    });

    if (resultado.ok) {
      // Feedback de éxito
      mostrarMensaje('¡Clase creada con éxito!');
      btn.innerText = '¡Creada con éxito!';
      btn.style.backgroundColor = '#16a34a';

      // Limpiar formulario
      document.getElementById('nombre').value = '';
      document.getElementById('horaInicio').value = '';
      document.getElementById('instructorId').value = '';
      calcularHoraFin();

      // Actualizar la lista
cargarClases();
    } else {
      mostrarMensaje(resultado.mensaje || 'Error del servidor al crear clase.', true);
    }
  } catch (error) {
    console.error(error);
    mostrarMensaje('Error de conexión con el servidor.', true);
  } finally {
    setTimeout(() => {
      btn.innerText = textoOriginal;
      btn.disabled = false;
      btn.style.backgroundColor = '';
    }, 2000);
  }
}


    /* ==================================================
       CARGAR CLASES
    ================================================== */

    async function cargarClases() {

      const btn =
        document.getElementById(
          'btnConsultar'
        );

      const fecha =
        document.getElementById(
          'fechaConsulta'
        ).value;


      btn.innerText =
        'Buscando...';

      btn.disabled =
        true;


      try {

        const resultado =
          await api({

            action:
              'listarClasesFecha',

            fecha

          });


        const tbody =
          document.getElementById(
            'tabla'
          );

        tbody.innerHTML = '';


        /* ---------------------------------------------
           ERROR
        ---------------------------------------------- */

        if (!resultado.ok) {

          mostrarMensaje(
            resultado.mensaje ||
            'Error al obtener las clases',
            true
          );

          return;

        }


        const clases =
          resultado.clases || [];


        /* ---------------------------------------------
           INDICADORES
        ---------------------------------------------- */

        document.getElementById(
          'indTotal'
        ).innerText =
          clases.length;


        document.getElementById(
          'indActivas'
        ).innerText =
          clases.filter(
            c => c.Estado === 'ACTIVA'
          ).length;


        document.getElementById(
          'indCanceladas'
        ).innerText =
          clases.filter(
            c => c.Estado === 'CANCELADA'
          ).length;


        /* ---------------------------------------------
           SIN CLASES
        ---------------------------------------------- */

        if (clases.length === 0) {

          tbody.innerHTML = `

            <tr>

              <td
                colspan="6"
                style="
                  text-align:center;
                  color:#888;
                  padding:20px;
                ">

                No hay clases programadas para esta fecha

              </td>

            </tr>

          `;

          return;

        }


        /* ---------------------------------------------
           MOSTRAR CLASES
        ---------------------------------------------- */

        clases.forEach(clase => {

          const tr =
            document.createElement('tr');


          const colorEstado =
            clase.Estado === 'ACTIVA'
              ? '#16a34a'
              : '#dc2626';


          tr.innerHTML = `

            <td>
              <strong>
                ${clase.Nombre}
              </strong>
            </td>

            <td>
              ${clase.HoraInicio}
              -
              ${clase.HoraFin}
            </td>

            <td>
              ${clase.Capacidad}
            </td>

            <td>
              ${clase.InstructorID || '-'}
            </td>

            <td>

              <span
                style="
                  font-weight:600;
                  color:${colorEstado};
                ">

                ${clase.Estado}

              </span>

            </td>

            <td>

              ${
                clase.Estado === 'ACTIVA'

                  ? `

                    <button
                      class="btn-danger"
                      onclick="
                        cancelarClase(
                          '${clase.ClaseID}'
                        )
                      ">

                      Cancelar

                    </button>

                  `

                  : '-'
              }

            </td>

          `;


          tbody.appendChild(tr);

        });


      } catch (error) {

        console.error(error);

        mostrarMensaje(
          'Error de conexión al cargar la lista',
          true
        );

      } finally {

        btn.innerText =
          'Consultar';

        btn.disabled =
          false;

      }

    }


    /* ==================================================
       CANCELAR CLASE
    ================================================== */

    async function cancelarClase(
      claseId
    ) {

      if (
        !confirm(
          '¿Seguro que deseas cancelar esta clase?'
        )
      ) {

        return;

      }


      try {

        const resultado =
          await api({

            action:
              'cancelarClase',

            claseId,

            canceladoPor:
              'STAFF'

          });


        if (resultado.ok) {

          cargarClases();

        } else {

          alert(
            resultado.mensaje ||
            'No se pudo cancelar la clase'
          );

        }

      } catch (e) {

        console.error(e);

        alert(
          'Error de conexión al intentar cancelar'
        );

      }

    }


    /* ==================================================
       EVENTOS DE HORARIO
    ================================================== */

    document
      .getElementById('horaInicio')
      .addEventListener(
        'change',
        calcularHoraFin
      );


    document
      .getElementById('duracion')
      .addEventListener(
        'change',
        calcularHoraFin
      );


    /* ==================================================
       INICIALIZACIÓN
    ================================================== */

    document.getElementById('fecha')
      .value = fechaHoy();

    document.getElementById('fechaConsulta')
      .value = fechaHoy();


    generarHoras();


    calcularHoraFin();


    cargarClases();

  </script>

</body>

</html>
