<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Ironwall - Clases</title>

<style>

body {
  font-family: Arial, sans-serif;
  background: #f5f5f5;
  padding: 20px;
}

.container {
  max-width: 1100px;
  margin: auto;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 20px;
  border-radius: 12px;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(180px,1fr)
    );
  gap: 10px;
}

input,
button {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

button {
  cursor: pointer;
  font-weight: bold;
}

table {
  width: 100%;
  border-collapse: collapse;
}

th,
td {
  padding: 10px;
  border-bottom:
    1px solid #ddd;
  text-align: left;
}

</style>

</head>

<body>

<div class="container">

<h1>Clases</h1>


<div class="card">

<h2>Nueva clase</h2>


<div class="grid">

<input
  id="nombre"
  placeholder="Nombre de clase">


<input
  id="fecha"
  type="date">


<input
  id="horaInicio"
  type="time">


<input
  id="horaFin"
  type="time">


<input
  id="capacidad"
  type="number"
  min="1"
  value="8">


<input
  id="instructorId"
  placeholder="InstructorID">

</div>


<button
  onclick="crearClase()">

Crear clase

</button>

</div>


<div class="card">

<h2>Clases del día</h2>


<input
  id="fechaConsulta"
  type="date">


<button
  onclick="cargarClases()">

Actualizar

</button>


<br><br>


<table>

<thead>

<tr>

<th>Clase</th>
<th>Hora</th>
<th>Capacidad</th>
<th>Instructor</th>
<th>Estado</th>
<th></th>

</tr>

</thead>

<tbody
  id="tabla">
</tbody>

</table>

</div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


function fechaHoy() {

  const d =
    new Date();

  return [
    d.getFullYear(),
    String(
      d.getMonth()+1
    ).padStart(2,'0'),
    String(
      d.getDate()
    ).padStart(2,'0')
  ].join('-');
}


document
  .getElementById(
    'fecha'
  ).value =
  fechaHoy();


document
  .getElementById(
    'fechaConsulta'
  ).value =
  fechaHoy();


async function api(body) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body:
          JSON.stringify(body)
      }
    );

  return response.json();
}


async function crearClase() {

  const resultado =
    await api({

      action:
        'crearClase',

      nombre:
        document
          .getElementById(
            'nombre'
          ).value,

      fecha:
        document
          .getElementById(
            'fecha'
          ).value,

      horaInicio:
        document
          .getElementById(
            'horaInicio'
          ).value,

      horaFin:
        document
          .getElementById(
            'horaFin'
          ).value,

      capacidad:
        document
          .getElementById(
            'capacidad'
          ).value,

      instructorId:
        document
          .getElementById(
            'instructorId'
          ).value,

      usuario:
        'STAFF'
    });


  alert(
    resultado.mensaje
  );


  if (
    resultado.ok
  ) {

    cargarClases();
  }
}


async function cargarClases() {

  const fecha =
    document
      .getElementById(
        'fechaConsulta'
      ).value;


  const resultado =
    await api({

      action:
        'listarClasesFecha',

      fecha
    });


  const tbody =
    document
      .getElementById(
        'tabla'
      );

  tbody.innerHTML = '';


  if (!resultado.ok) {

    alert(
      resultado.mensaje
    );

    return;
  }


  resultado.clases.forEach(
    clase => {

      const tr =
        document
          .createElement(
            'tr'
          );


      tr.innerHTML = `

        <td>
          ${clase.Nombre}
        </td>

        <td>
          ${clase.HoraInicio}
          -
          ${clase.HoraFin}
        </td>

        <td>
          ${clase.Capacidad}
        </td>

        <td>
          ${clase.InstructorID || '-'}
        </td>

        <td>
          ${clase.Estado}
        </td>

        <td>

          ${
            clase.Estado ===
            'ACTIVA'

            ?

            `<button
              onclick="
                cancelarClase(
                  '${clase.ClaseID}'
                )
              ">
              Cancelar
            </button>`

            :

            ''
          }

        </td>
      `;


      tbody.appendChild(
        tr
      );
    }
  );
}


async function cancelarClase(
  claseId
) {

  if (
    !confirm(
      '¿Cancelar esta clase?'
    )
  ) {
    return;
  }


  const resultado =
    await api({

      action:
        'cancelarClase',

      claseId,

      usuario:
        'STAFF'
    });


  alert(
    resultado.mensaje
  );


  cargarClases();
}


cargarClases();

</script>

</body>

</html>
