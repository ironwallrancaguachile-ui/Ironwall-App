<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Ironwall Reservas</title>
<style>
* {  box-sizing: border-box;}

body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  margin: 0;
  color: #222;
}

.container {
  width: min(570px, 94%);
  margin: 0 auto;
  padding: 25px 0 40px;
}

h1 {
  margin: 0 0 5px;
}

.subtitulo {
  color: #666;
  margin-bottom: 22px;
}

.card {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 18px;
}

.disponibilidad {
  background: #f0fff5;
  border-color: #9be8b7;
}

.titulo-card {
  font-weight: bold;
  margin-bottom: 10px;
}

.indicadores {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.indicador {
  border: 1px solid #6bdc96;
  border-radius: 20px;
  padding: 7px 12px;
}

.indicador span {
  background: #16c96a;
  color: white;
  border-radius: 12px;
  padding: 2px 7px;
  font-weight: bold;
}

label {
  display: block;
  margin: 17px 0 7px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
}

.horas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.tipos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.tipo {
  background: white;
  font-weight: bold;
}

.tipo.activo {
  background: #fff8e6;
  border: 2px solid #c98b00;
  color: #b47700;
}

.btn {
  margin-top: 18px;
  font-weight: bold;
  cursor: pointer;
}

.btn-consultar {
  background: #e7e9ec;
}

.btn-reservar {
  background: #191919;
  color: white;
}

.btn-reservar:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#claseBox {
  display: none;
}

.mensaje {
  margin-top: 12px;
  font-weight: bold;
}

.exito {
  color: #008c4a;
}

.error {
  color: #c62828;
}

</style>

</head>

<body>

<div class="container">

<h1>Ironwall Reservas</h1>

<div class="subtitulo">Gestión de cupos y confirmación de accesos</div>
<div class="card disponibilidad"><div class="titulo-card">CUPOS DISPONIBLES EN EL PERIODO</div>
      <div class="indicadores">
            <div class="indicador">
            Ocupación
            <span id="ocupacion">-</span>
            </div>
      
            <div class="indicador">
            Disponibles
            <span id="disponibles">-</span>
            </div>
      
            <div class="indicador">
            Capacidad
            <span id="capacidad">-</span>
            </div>
      </div>
</div>

<div class="card">

      <label>
      Fecha
      </label>
      
      <input
        id="fecha"
        type="date">
      
      
      <div class="horas">
      
      <div>
      
      <label>
      Hora Inicio
      </label>
      
      <input
        id="horaInicio"
        type="time"
        value="18:00">
      
      </div>
      
      
      <div>
      
      <label>
      Hora Término
      </label>
      
      <input
        id="horaFin"
        type="time"
        value="20:00">
      
      </div>
      
      </div>
      
      
      <button
        class="btn btn-consultar"
        onclick="consultarCupos()">
      
      Paso 1: Consultar Cupos Disponibles
      
      </button>
      
      
      <label>
      Tipo de Reserva
      </label>
      
      <div class="tipos">
      
      <button
        id="btnEntrada"
        class="tipo activo"
        onclick="seleccionarTipo('ENTRADA')">
      
      Entrada General
      
      </button>
      
      <button
        id="btnClase"
        class="tipo"
        onclick="seleccionarTipo('CLASE')">
      
      Clase
      
      </button>
      
      </div>
      
      
      <div id="claseBox">
      
      <label>
      Seleccionar Clase
      </label>
      
      <select id="claseId"
              onchange="seleccionarClase()">
      
      <option value="">
      Selecciona una clase
      </option>
      
      </select>
      
      </div>
      
      
      <label>
      ID Cliente
      </label>
      
      <input
        id="clienteId"
        placeholder="Ej: CLI-001">
      
      
      <small>
      Código asignado en el sistema de gestión
      </small>
      
      
      <label>
      Cantidad de Personas
      </label>
      
      <input
        id="cantidad"
        type="number"
        min="1"
        max="5"
        value="1">
          
      <button
        id="btnReservar"
        class="btn btn-reservar"
        disabled
        onclick="realizarReserva()">
      
      Paso 2: Confirmar Reserva
      
      </button>
           
      <div
        id="mensaje"
        class="mensaje">
      </div>

</div>

</div>


<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';

let tipoSeleccionado = 'ENTRADA';
let consultaRealizada = false;
let disponiblesActuales = 0;
let tipoReserva = 'ENTRADA';
let cuposConsultados = false;

function fechaHoyLocal() {

  const d =
    new Date();

  return [
    d.getFullYear(),
    String(
      d.getMonth() + 1
    ).padStart(2, '0'),
    String(
      d.getDate()
    ).padStart(2, '0')
  ].join('-');
}


document
  .getElementById('fecha')
  .value =
  fechaHoyLocal();

function seleccionarTipo(tipo) {

  tipoSeleccionado = tipo;

  const btnEntrada = document.getElementById('btnEntrada');
  const btnClase = document.getElementById('btnClase');

  if (tipo === 'ENTRADA') {

    btnEntrada.className = 'activo-entrada';
    btnClase.className = '';

  } else {

    btnEntrada.className = '';
    btnClase.className = 'activo-clase';
  }

  actualizarEstadoBotonReserva();
}


async function api(
  body
) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body:
          JSON.stringify(body)
      }
    );

  return await response.json();
}

async function consultarCupos() {

  const fecha =
    document
      .getElementById('fecha')
      .value;

  const horaInicio =
    document
      .getElementById(
        'horaInicio'
      ).value;

  const horaFin =
    document
      .getElementById(
        'horaFin'
      ).value;

  if (
    !fecha ||
    !horaInicio ||
    !horaFin
  ) {

    mostrar(
      'Completa fecha y horario',
      'error'
    );

    return;
  }

  try {

    const resultado =
      await api({

        action:
          'ocupacion',

        fecha,

        horaInicio,

        horaFin
      });

    if (!resultado.ok) {
      throw new Error(
        resultado.mensaje
      );
    }

    document
      .getElementById(
        'ocupacion'
      ).textContent =
      resultado.ocupacion;


    document
      .getElementById(
        'disponibles'
      ).textContent =
      resultado.disponibles;


    document
      .getElementById(
        'capacidad'
      ).textContent =
      resultado.capacidad;

    cuposConsultados =
      resultado.disponibles > 0;

    if (
      tipoReserva ===
      'CLASE'
    ) {

      await cargarClases();

      const claseId =
        document
          .getElementById(
            'claseId'
          ).value;

      if (!claseId) {
        cuposConsultados =
          false;
      }
    }

    document
      .getElementById(
        'btnReservar'
      ).disabled =
      !cuposConsultados;


    if (
      resultado.lleno
    ) {

      mostrar(
        'No hay cupos disponibles para este periodo',
        'error'
      );

    } else {

      mostrar(
        'Cupos disponibles',
        'exito'
      );
    }

  } catch (error) {

    mostrar(
      'Error: ' +
      error.message,
      'error'
    );
  }
}

async function cargarClases() {

  const fecha =
    document
      .getElementById(
        'fecha'
      ).value;

  if (!fecha) return;


  const resultado =
    await api({

      action:
        'listarClasesFecha',

      fecha
    });

  const select =
    document
      .getElementById(
        'claseId'
      );

  select.innerHTML =
    '<option value="">Selecciona una clase</option>';

  if (!resultado.ok) {
    return;
  }

  resultado.clases
    .filter(
      c =>
        c.Estado ===
        'ACTIVA'
    )
    .forEach(
      clase => {

        const option =
          document.createElement(
            'option'
          );

        option.value =
          clase.ClaseID;

        option.textContent =
          `${clase.Nombre} — ${clase.HoraInicio}-${clase.HoraFin} — ${clase.Capacidad} cupos`;

        select.appendChild(
          option
        );
      }
    );
}

function seleccionarClase() {

  const claseId =
    document
      .getElementById(
        'claseId'
      ).value;

  document
    .getElementById(
      'btnReservar'
    ).disabled =
    !(
      cuposConsultados &&
      claseId
    );
}

async function realizarReserva() {

  const clienteId =
    document
      .getElementById(
        'clienteId'
      ).value
      .trim();

  const fecha =
    document
      .getElementById(
        'fecha'
      ).value;

  const horaInicio =
    document
      .getElementById(
        'horaInicio'
      ).value;

  const horaFin =
    document
      .getElementById(
        'horaFin'
      ).value;

  const cantidad =
    Number(
      document
        .getElementById(
          'cantidad'
        ).value
    );

  const claseId =
    document
      .getElementById(
        'claseId'
      ).value;


  if (!clienteId) {

    mostrar(
      'Ingresa el ClienteID',
      'error'
    );

    return;
  }

  if (
    tipoReserva ===
    'CLASE' &&
    !claseId
  ) {

    mostrar(
      'Selecciona una clase',
      'error'
    );

    return;
  }

  try {

    const resultado =
      await api({

        action:
          'crearReserva',

        clienteId,

        tipoReserva,

        fecha,

        horaInicio,

        horaFin,

        cantidad,

        claseId,

        origen:
          'WEB',

        usuario:
          'WEB'
      });


    if (!resultado.ok) {

      mostrar(
        resultado.mensaje,
        'error'
      );

      return;
    }


    mostrar(
      `¡Reserva exitosa! ID: ${resultado.reservaId}`,
      'exito'
    );


    document
      .getElementById(
        'btnReservar'
      ).disabled =
      true;


    await consultarCupos();

  } catch (error) {

    mostrar(
      'Error: ' +
      error.message,
      'error'
    );
  }
}

function mostrar(
  texto,
  tipo
) {

  const elemento =
    document
      .getElementById(
        'mensaje'
      );

  elemento.textContent =
    texto;

  elemento.className =
    'mensaje ' +
    tipo;
}

function actualizarEstadoBotonReserva() {

  const btn = document.getElementById('btnEnviar');
  const clienteId = document.getElementById('clienteId').value.trim();
  const cantidad = Number(document.getElementById('cantidad').value);

  const claseSelect = document.getElementById('claseId');

  let claseValida = true;

  if (tipoSeleccionado === 'CLASE') {
    claseValida = claseSelect && claseSelect.value.trim() !== '';
  }

  const puedeReservar =
    consultaRealizada &&
    disponiblesActuales >= cantidad &&
    clienteId !== '' &&
    cantidad >= 1 &&
    claseValida;

  btn.disabled = !puedeReservar;
}

</script>

</body>

</html>
