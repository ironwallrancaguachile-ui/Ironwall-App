<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ironwall Reservas</title>
<style>
/* --- FUENTES DEL SISTEMA --- */
@font-face {
  font-family: 'Archivo Extra Condensed';
  src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Archivo Extra Condensed';
  src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
  font-weight: 700;
  font-display: swap;
}
@font-face {
  font-family: Boris;
  src: url("fonts/BorisBlackBloxx.ttf");
  font-weight: 400;
  font-display: swap;
}

/* --- RESET Y ESTILOS BASE --- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
  color: #222;
  padding: 24px 20px 60px;
  min-height: 100vh;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
}

/* --- CABECERA Y NAVEGACIÓN --- */
.barraNavegacion {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 auto 16px;
}

  .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }

    .logo-btn {
      height: 36px;
      width: auto;
      object-fit: contain;
      transform: scale(1.8);
      transform-origin: center;
    }

h1 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}

.subtitulo {
  color: #666;
  font-size: 13px;
  margin-bottom: 20px;
}

/* --- TARJETAS (CARDS) --- */
.card {
  background: #ffffff;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
  border: 1px solid #e8ecef;
}

.titulo-card {
  font-size: 13px;
  font-weight: 700;
  color: #666;
  letter-spacing: .5px;
  margin-bottom: 14px;
  text-transform: uppercase;
}

/* --- INDICADORES Y MÉTRICAS COMPACTAS --- */
.indicadores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}

.indicador-item {
  background: #f8f9fa;
  border: 1px solid #edf0f2;
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
}

.indicador-item span {
  font-size: 11px;
  color: #666;
  margin-bottom: 2px;
}

.indicador-item strong {
  font-size: 18px;
  font-weight: 700;
  color: #111;
}

/* --- FORMULARIOS --- */
label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: #333;
}

input, select {
  width: 100%;
  padding: 10px 12px;
  font-size: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: #fff;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus, select:focus {
  outline: none;
  border-color: #222;
  box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
}

.horario-preview {
  display: flex;
  align-items: center;
  height: 41px;
  padding: 0 12px;
  background: #f4f6f8;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-weight: 700;
  font-size: 14px;
  color: #111;
  white-space: nowrap;
}

/* --- TIPOS Y SELECCIONABLES --- */
.tipos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.tipo {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 14px 10px;
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: .2s;
}

.tipo small {
  display: block;
  font-weight: 500;
  font-size: 11px;
  color: #888;
  margin-top: 2px;
}

.tipo.activo {
  background: #fff8e6;
  border: 2px solid #c98b00;
  color: #b47700;
}

.tipo.activo small {
  color: #b47700;
}

/* --- FILA HORIZONTAL ÚNICA (Fecha + campos dinámicos + botón) --- */
.fila-horizontal {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: end;
}

.campo {
  flex: 1 1 130px;
  min-width: 0;
}

.campo-fecha {
  flex: 1 1 150px;
}

.campo-clase {
  flex: 2 1 240px;
}

.campo-boton {
  flex: 0 0 auto;
}

.campo-oculto {
  display: none !important;
}

/* --- BOTONES INTERACTIVOS --- */
button, .btn {
  height: 41px;
  padding: 0 20px;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  white-space: nowrap;
  transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
}

.btn-consultar {
  background-color: #e0e0e0;
  color: #333333;
}

.btn-consultar:hover {
  background-color: #d0d0d0;
}

.btn-reservar {
  background-color: #191919;
  color: #ffffff;
  width: 100%;
}

.btn-reservar:hover {
  background-color: #333333;
}

.btn:disabled, .btn-reservar:disabled {
  opacity: .45;
  cursor: not-allowed;
  transform: none !important;
}

.btn:active:not(:disabled) {
  transform: scale(0.99);
}

/* --- MENSAJES DE ESTADO --- */
.mensaje {
  margin-top: 12px;
  font-weight: 700;
  font-size: 13px;
  padding: 10px;
  border-radius: 8px;
}

.exito {
  background: #dcfce7;
  color: #15803d;
}

.error {
  background: #fee2e2;
  color: #dc2626;
}

/* --- FILA RESERVA --- */
.fila-reserva {
  display: grid;
  grid-template-columns: 2fr 1fr auto;
  gap: 12px;
  align-items: end;
}

/* --- RESULTADOS COMPARTIDOS --- */
.resultado-box {
  display: none;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid #edf0f2;
}

/* ADAPTACIÓN RESPONSIVE */
@media (max-width: 640px) {
  body {
    padding: 16px 12px 40px;
  }
  .card {
    padding: 16px;
  }
  .fila-horizontal {
    flex-direction: column;
    align-items: stretch;
  }
  .fila-horizontal .campo,
  .fila-horizontal .campo-boton {
    flex: 1 1 auto;
    width: 100%;
  }
  .fila-reserva {
    grid-template-columns: 1fr;
  }
}
</style>

</head>

<body>
<div class="container">

<!-- BARRA DE NAVEGACIÓN -->
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome">
          <img src="img/logosn.png" alt="Logo" class="logo-btn">
          <span>←Inicio</span>
      </a>
    </div>

  <h1>Sistema de Reservas</h1>
  <p class="subtitulo">Consulta disponibilidad y gestiona reservas en línea</p>

<!-- TARJETA 1: TIPO DE RESERVA -->
<div class="card">
  <div class="titulo-card">1. Tipo de Reserva</div>
  <div class="tipos">
    <div class="tipo activo" onclick="seleccionarTipo('ENTRADA')">
      Entrada Libre
      <small>Aforo general del recinto</small>
    </div>
    <div class="tipo" onclick="seleccionarTipo('CLASE')">
      Clase Guiada
      <small>Cupo específico de la clase</small>
    </div>
  </div>
</div>

<!-- TARJETA 2: FECHA Y HORARIO (todo en una sola fila horizontal) -->
<div class="card">
  <div class="titulo-card">2. Fecha y Horario</div>

  <div class="fila-horizontal">
    <div class="campo campo-fecha">
      <label>Fecha</label>
      <input id="fecha" type="date">
    </div>

    <!-- Campos de ENTRADA LIBRE -->
    <div class="campo" id="campoHoraInicio">
      <label>Hora Inicio</label>
      <select id="horaInicio" onchange="calcularHorarioResultante()">
        <option value="08:00">08:00</option>
        <option value="09:00">09:00</option>
        <option value="10:00">10:00</option>
        <option value="11:00">11:00</option>
        <option value="12:00">12:00</option>
        <option value="13:00">13:00</option>
        <option value="14:00" selected>14:00</option>
        <option value="15:00">15:00</option>
        <option value="16:00">16:00</option>
        <option value="17:00">17:00</option>
        <option value="18:00">18:00</option>
        <option value="19:00">19:00</option>
        <option value="20:00">20:00</option>
      </select>
    </div>
    <div class="campo" id="campoDuracion">
      <label>Duración</label>
      <select id="duracionHoras" onchange="calcularHorarioResultante()">
        <option value="2" selected>2 horas (normal)</option>
        <option value="3">3 horas</option>
        <option value="4">4 horas</option>
        <option value="5">5 horas</option>
        <option value="6">6 horas</option>
      </select>
    </div>
    <div class="campo" id="campoHorarioResultante">
      <label>Horario Resultante</label>
      <div id="horarioResultanteText" class="horario-preview">14:00 - 16:00</div>
    </div>

    <!-- Campo de CLASE GUIADA (oculto por defecto) -->
    <div class="campo campo-clase campo-oculto" id="campoClase">
      <label for="claseSelect">Clase Disponible</label>
      <select id="claseSelect" onchange="alSeleccionarClase()">
        <option value="">Cargando clases...</option>
      </select>
    </div>

    <div class="campo campo-boton">
      <button class="btn-consultar" onclick="consultarDisponibilidad()">Consultar</button>
    </div>
  </div>

  <!-- RESULTADOS DE LA CONSULTA -->
  <div id="resultadoConsulta" class="resultado-box">
    <div class="indicadores">
      <div class="indicador-item">
        <span>Capacidad</span>
        <strong id="capacidad">0</strong>
      </div>
      <div class="indicador-item">
        <span>Ocupados</span>
        <strong id="ocupacion">0</strong>
      </div>
      <div class="indicador-item">
        <span>Disponibles</span>
        <strong id="disponibles" style="color: #15803d;">0</strong>
      </div>
    </div>
    <div id="mensajeEstado" class="mensaje" style="display: none; margin-top: 10px;"></div>
  </div>
</div>

  <!-- TARJETA 3: CONFIRMACIÓN -->
  <div class="card">
    <div class="titulo-card">3. Confirmación de Reserva</div>
    <div class="fila-reserva">
      <div>
        <label>Cliente / Nombre</label>
        <input id="clienteId" placeholder="Ej: Juan Pérez">
      </div>
      <div>
        <label>Cantidad personas</label>
        <input id="cantidad" type="number" min="1" value="1">
      </div>
      <button class="btn-reservar" onclick="realizarReserva()">Reservar</button>
    </div>
  </div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';

/* =========================================================
   ESTADO GENERAL
========================================================= */
let tipoReserva = 'ENTRADA';
let cuposConsultados = false;
let disponiblesActuales = 0;
let horaFinCalculada = '16:00';

// Controladores de concurrencia: uno por "canal" de peticiones.
// Cuando se lanza una petición nueva de un canal, se cancela
// de verdad la anterior de ese mismo canal (no solo se ignora).
let controladorConsulta = null;
let controladorClases = null;

// "Sello" de qué rango exacto fue el que arrojó disponiblesActuales.
// Sirve para que el botón Reservar solo se habilite si el rango
// vigente (tipo + horario + claseId) coincide con el consultado.
let rangoConsultado = null;

/* =========================================================
   INICIALIZACIÓN
========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  const fecha = document.getElementById('fecha');
  if (fecha) {
    const d = new Date();
    fecha.value = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
  }

  const cliente = document.getElementById('clienteId');
  if (cliente) cliente.addEventListener('input', actualizarEstadoBotonReserva);

  const cantidad = document.getElementById('cantidad');
  if (cantidad) {
    cantidad.addEventListener('input', actualizarEstadoBotonReserva);
    cantidad.addEventListener('change', actualizarEstadoBotonReserva);
  }

  if (fecha) {
    fecha.addEventListener('change', async () => {
      invalidarConsulta();
      if (tipoReserva === 'CLASE') {
        await cargarClases();
      }
    });
  }

  calcularHorarioResultante();
  actualizarEstadoBotonReserva();
});

/* =========================================================
   CALCULADORA DE RANGOS DE HORARIO (Entrada Libre)
========================================================= */
function calcularHorarioResultante() {
  const hInicioSelect = document.getElementById('horaInicio');
  const duracionSelect = document.getElementById('duracionHoras');
  const previewDiv = document.getElementById('horarioResultanteText');

  if (!hInicioSelect || !duracionSelect) return;

  const hInicioStr = hInicioSelect.value;
  const duracion = parseInt(duracionSelect.value, 10);

  const partes = hInicioStr.split(':');
  let horaNum = parseInt(partes[0], 10);
  let minNum = parseInt(partes[1] || '0', 10);

  let horaFinNum = horaNum + duracion;

  if (horaFinNum > 24) horaFinNum = 24;

  const hFinStr = `${String(horaFinNum).padStart(2, '0')}:${String(minNum).padStart(2, '0')}`;
  horaFinCalculada = hFinStr;

  if (previewDiv) {
    previewDiv.textContent = `${hInicioStr} - ${hFinStr}`;
  }

  invalidarConsulta();
}

/* =========================================================
   RANGO VIGENTE Y COMPARACIÓN (para habilitar Reservar)
========================================================= */
function obtenerRangoVigente() {
  let horaInicio = document.getElementById('horaInicio').value;
  let horaFin = horaFinCalculada;
  let claseId = '';

  if (tipoReserva === 'CLASE') {
    const claseSelect = document.getElementById('claseSelect');
    const opt = claseSelect ? claseSelect.options[claseSelect.selectedIndex] : null;
    if (opt && opt.dataset.inicio && opt.dataset.fin && claseSelect.value) {
      horaInicio = opt.dataset.inicio;
      horaFin = opt.dataset.fin;
      claseId = claseSelect.value;
    } else {
      return null; // no hay clase seleccionada todavía
    }
  }

  return { tipo: tipoReserva, horaInicio, horaFin, claseId };
}

function rangosCoinciden(a, b) {
  if (!a || !b) return false;
  return a.tipo === b.tipo &&
         a.horaInicio === b.horaInicio &&
         a.horaFin === b.horaFin &&
         a.claseId === b.claseId;
}

/* =========================================================
   RESET DEL BOTÓN CONSULTAR (inmediato, sin depender de timeouts)
========================================================= */
function resetBotonConsultar() {
  const btn = document.querySelector('.btn-consultar');
  if (btn) {
    btn.innerText = 'Consultar';
    btn.disabled = false;
    btn.style.opacity = '1';
    btn.style.backgroundColor = '#e0e0e0';
    btn.style.color = '#333333';
    btn.style.cursor = 'pointer';
  }
}

/* =========================================================
   INVALIDAR CONSULTA
========================================================= */
function invalidarConsulta() {
  // Cancela DE VERDAD cualquier consulta pendiente (no solo la ignora)
  if (controladorConsulta) {
    controladorConsulta.abort();
    controladorConsulta = null;
  }

  cuposConsultados = false;
  rangoConsultado = null;
  disponiblesActuales = 0;

  const resBox = document.getElementById('resultadoConsulta');
  if (resBox) {
    resBox.style.display = 'none';
  }
  const msg = document.getElementById('mensajeEstado');
  if (msg) {
    msg.style.display = 'none';
    msg.textContent = '';
  }

  // Clave: resetear el botón Consultar YA, sin esperar ningún timeout viejo
  resetBotonConsultar();

  actualizarEstadoBotonReserva();
}

/* =========================================================
   SELECCIÓN DE TIPO DE RESERVA
========================================================= */
async function seleccionarTipo(tipo) {
  invalidarConsulta();

  tipoReserva = tipo;

  const opciones = document.querySelectorAll('.tipos .tipo');
  opciones.forEach(el => {
    if (el.textContent.toUpperCase().includes(tipo)) {
      el.classList.add('activo');
    } else {
      el.classList.remove('activo');
    }
  });

  const camposEntrada = [
    document.getElementById('campoHoraInicio'),
    document.getElementById('campoDuracion'),
    document.getElementById('campoHorarioResultante')
  ];
  const campoClase = document.getElementById('campoClase');
  const claseSelect = document.getElementById('claseSelect');

  if (tipo === 'ENTRADA') {
    camposEntrada.forEach(el => el && el.classList.remove('campo-oculto'));
    if (campoClase) campoClase.classList.add('campo-oculto');
    if (claseSelect) claseSelect.value = '';
  } else if (tipo === 'CLASE') {
    camposEntrada.forEach(el => el && el.classList.add('campo-oculto'));
    if (campoClase) campoClase.classList.remove('campo-oculto');
    if (claseSelect) {
      claseSelect.innerHTML = '<option value="">Cargando clases disponibles...</option>';
    }
    await cargarClases();
  }

  actualizarEstadoBotonReserva();
}

async function alSeleccionarClase() {
  // Cambiar de clase invalida cualquier consulta anterior (rango distinto)
  invalidarConsulta();
  actualizarEstadoBotonReserva();

  const claseSelect = document.getElementById('claseSelect');
  if (claseSelect && claseSelect.value) {
    // Auto-consulta: apenas se elige una clase, se consulta su cupo específico
    await consultarDisponibilidad();
  }
}

/* =========================================================
   1. CONSULTAR DISPONIBILIDAD
========================================================= */
async function consultarDisponibilidad() {
  const fecha = document.getElementById('fecha').value;
  let horaInicio = document.getElementById('horaInicio').value;
  let horaFin = horaFinCalculada;
  let claseId = '';

  if (tipoReserva === 'CLASE') {
    const claseSelect = document.getElementById('claseSelect');
    const opt = claseSelect ? claseSelect.options[claseSelect.selectedIndex] : null;

    if (opt && opt.dataset.inicio && opt.dataset.fin && claseSelect.value) {
      horaInicio = opt.dataset.inicio;
      horaFin = opt.dataset.fin;
      claseId = claseSelect.value;
    } else {
      mostrarMensaje('Por favor selecciona una clase disponible.', 'error');
      return;
    }
  }

  if (!fecha || !horaInicio || !horaFin) {
    mostrarMensaje('Por favor, selecciona Fecha y Horario.', 'error');
    return;
  }

  // Cancela cualquier consulta anterior en vuelo antes de lanzar esta
  if (controladorConsulta) {
    controladorConsulta.abort();
  }
  const miControlador = new AbortController();
  controladorConsulta = miControlador;

  const btn = document.querySelector('.btn-consultar');

  if (btn) {
    btn.innerText = 'Consultando...';
    btn.disabled = true;
    btn.style.opacity = '0.7';
    btn.style.cursor = 'not-allowed';
  }

  try {
    const payload = {
      action: 'ocupacion',
      fecha,
      horaInicio,
      horaFin
    };
    if (tipoReserva === 'CLASE') {
      payload.claseId = claseId;
    }

    const resultado = await api(payload, { signal: miControlador.signal });

    // Si ya existe una consulta más nueva en curso, esta respuesta ya no sirve.
    if (controladorConsulta !== miControlador) {
      return;
    }

    if (!resultado.ok) {
      throw new Error(resultado.mensaje || 'Error al obtener disponibilidad');
    }

    document.getElementById('capacidad').textContent = resultado.capacidad || 0;
    document.getElementById('ocupacion').textContent = resultado.ocupacion || 0;
    document.getElementById('disponibles').textContent = resultado.disponibles || 0;

    const resBox = document.getElementById('resultadoConsulta');
    if (resBox) {
      resBox.style.display = 'block';
    }

    disponiblesActuales = Number(resultado.disponibles || 0);
    cuposConsultados = true;
    // Sello: guardamos exactamente qué rango (tipo + horario + claseId)
    // produjo este resultado, para validar luego en actualizarEstadoBotonReserva.
    rangoConsultado = obtenerRangoVigente();

    actualizarEstadoBotonReserva();

    if (resultado.lleno || disponiblesActuales === 0) {
      mostrarMensaje(
        tipoReserva === 'CLASE'
          ? 'No hay cupos disponibles para esta clase.'
          : 'No hay cupos disponibles para este horario.',
        'error'
      );
    } else {
      mostrarMensaje(`¡Hay ${disponiblesActuales} cupos disponibles! Puedes continuar.`, 'exito');
    }

    if (btn) {
      btn.innerText = '¡Actualizado!';
      btn.style.backgroundColor = '#dcfce7';
      btn.style.color = '#15803d';
    }

  } catch (error) {
    if (error.name === 'AbortError') {
      // Cancelación intencional (se lanzó otra consulta más nueva): no es un error real
      return;
    }
    if (controladorConsulta !== miControlador) {
      return;
    }

    mostrarMensaje('Error: ' + error.message, 'error');
    cuposConsultados = false;
    rangoConsultado = null;
    actualizarEstadoBotonReserva();

  } finally {
    // Reseteo inmediato del botón, ya no depende de comparar IDs tras un timeout.
    if (controladorConsulta === miControlador) {
      controladorConsulta = null;
      resetBotonConsultar();
    }
  }
}

/* =========================================================
   2. CARGAR CLASES
========================================================= */
async function cargarClases() {
  const select = document.getElementById('claseSelect');
  const fecha = document.getElementById('fecha').value;

  if (!select || !fecha) return;

  // Cancela cualquier carga de clases anterior en vuelo
  if (controladorClases) {
    controladorClases.abort();
  }
  const miControlador = new AbortController();
  controladorClases = miControlador;

  select.innerHTML = '<option value="">Cargando clases disponibles...</option>';

  try {
    const res = await api({ action: 'listarClasesFecha', fecha: fecha }, { signal: miControlador.signal });

    if (controladorClases !== miControlador) {
      return; // esta respuesta ya quedó obsoleta
    }

    if (!res.ok || !res.clases || res.clases.length === 0) {
      select.innerHTML = '<option value="">No hay clases programadas para esta fecha</option>';
      return;
    }

    const clasesActivas = res.clases.filter(c => c.Estado === 'ACTIVA');

    if (clasesActivas.length === 0) {
      select.innerHTML = '<option value="">No hay clases activas disponibles</option>';
      return;
    }

    select.innerHTML = '<option value="">-- Selecciona una clase --</option>';
    clasesActivas.forEach(clase => {
      const opt = document.createElement('option');
      opt.value = clase.ClaseID;
      opt.dataset.inicio = clase.HoraInicio;
      opt.dataset.fin = clase.HoraFin;
      opt.textContent = `${clase.Nombre} (${clase.HoraInicio} - ${clase.HoraFin})`;
      select.appendChild(opt);
    });

  } catch (error) {
    if (error.name === 'AbortError') {
      return;
    }
    if (controladorClases !== miControlador) {
      return;
    }
    select.innerHTML = '<option value="">Error al cargar clases</option>';
  } finally {
    if (controladorClases === miControlador) {
      controladorClases = null;
    }
  }
}

/* =========================================================
   3. PROCESAR RESERVA
========================================================= */
async function realizarReserva() {
  const clienteId = document.getElementById('clienteId').value.trim();
  const cantidad = Number(document.getElementById('cantidad').value || 1);
  const fecha = document.getElementById('fecha').value;

  let hInicio = document.getElementById('horaInicio').value;
  let hFin = horaFinCalculada;

  const claseSelect = document.getElementById('claseSelect');
  const claseId = claseSelect ? claseSelect.value : '';

  if (tipoReserva === 'CLASE' && claseSelect) {
    const optSeleccionada = claseSelect.options[claseSelect.selectedIndex];
    if (optSeleccionada && optSeleccionada.dataset.inicio && optSeleccionada.dataset.fin) {
      hInicio = optSeleccionada.dataset.inicio;
      hFin = optSeleccionada.dataset.fin;
    }
  }

  // VALIDACIONES
  if (!fecha || !hInicio || !hFin) {
    mostrarMensaje('Debes seleccionar fecha y rango horario.', 'error');
    return;
  }

  if (!clienteId) {
    mostrarMensaje('Debes ingresar el nombre o ID del cliente.', 'error');
    return;
  }

  if (!cantidad || cantidad < 1) {
    mostrarMensaje('La cantidad de personas debe ser al menos 1.', 'error');
    return;
  }

  if (tipoReserva === 'CLASE' && !claseId) {
    mostrarMensaje('Por favor selecciona una clase disponible.', 'error');
    return;
  }

  const rangoVigente = obtenerRangoVigente();
  if (!cuposConsultados || !rangosCoinciden(rangoConsultado, rangoVigente)) {
    mostrarMensaje('Debes consultar la disponibilidad de este horario/clase antes de reservar.', 'error');
    return;
  }

  if (cantidad > disponiblesActuales) {
    mostrarMensaje(`Solo quedan ${disponiblesActuales} cupos disponibles.`, 'error');
    return;
  }

  const btn = document.querySelector('.btn-reservar');
  const textoOriginal = btn ? btn.innerText : 'Reservar';

  if (btn) {
    btn.innerText = 'Reservando...';
    btn.disabled = true;
    btn.style.opacity = '0.7';
  }

  try {
    const payload = {
      action: 'crearReserva',
      tipo: tipoReserva,
      clienteId: clienteId,
      cantidad: cantidad,
      fecha: fecha,
      horaInicio: hInicio,
      horaFin: hFin,
      claseId: tipoReserva === 'CLASE' ? claseId : '',
      usuario: 'STAFF'
    };

    const res = await api(payload);

    if (!res || !res.ok) {
      throw new Error(res?.mensaje || 'Error al procesar la reserva.');
    }

    // El backend ya devuelve la ocupación y disponibilidad tras crear la reserva.
    if (
      typeof res.capacidad !== 'undefined' &&
      typeof res.ocupacion !== 'undefined' &&
      typeof res.disponibles !== 'undefined'
    ) {
      document.getElementById('capacidad').textContent = res.capacidad;
      document.getElementById('ocupacion').textContent = res.ocupacion;
      document.getElementById('disponibles').textContent = res.disponibles;

      disponiblesActuales = Number(res.disponibles);

      const resBox = document.getElementById('resultadoConsulta');
      if (resBox) {
        resBox.style.display = 'block';
      }

      cuposConsultados = true;
    }

    if (btn) {
      btn.innerText = '¡Reservado!';
      btn.style.backgroundColor = '#dcfce7';
      btn.style.color = '#15803d';
    }

    mostrarMensaje(`Reserva realizada con éxito a nombre de ${clienteId}.`, 'exito');

    document.getElementById('clienteId').value = '';

  } catch (error) {
    console.error('Error al reservar:', error);
    mostrarMensaje('Error al reservar: ' + error.message, 'error');
  } finally {
    setTimeout(() => {
      if (btn) {
        btn.innerText = textoOriginal;
        btn.disabled = false;
        btn.style.backgroundColor = '#191919';
        btn.style.color = '#ffffff';
        btn.style.opacity = '1';
      }
      actualizarEstadoBotonReserva();
    }, 1500);
  }
}

/* =========================================================
   ESTADO DEL BOTÓN RESERVAR
========================================================= */
function actualizarEstadoBotonReserva() {
  const btnReservar = document.querySelector('.btn-reservar');
  const cliente = document.getElementById('clienteId')?.value.trim();
  const cantidad = Number(document.getElementById('cantidad')?.value || 0);

  if (!btnReservar) return;

  const rangoVigente = obtenerRangoVigente();
  const coincide = rangosCoinciden(rangoConsultado, rangoVigente);

  let esValido = cuposConsultados && coincide && cliente !== '' && cantidad > 0 && cantidad <= disponiblesActuales;

  if (tipoReserva === 'CLASE' && !rangoVigente) {
    esValido = false; // aún no hay clase seleccionada
  }

  btnReservar.disabled = !esValido;
  btnReservar.style.opacity = esValido ? '1' : '0.5';
  btnReservar.style.cursor = esValido ? 'pointer' : 'not-allowed';
}

/* =========================================================
   PETICIÓN A LA API
   - Cancelable mediante signal (AbortController)
   - Timeout controlado
   - Sin reintentos automáticos
========================================================= */

async function api(body, opciones = {}) {
  const timeout = opciones.timeout || 15000;

  const controller = new AbortController();

  // Si nos pasan un signal externo (del canal de consulta/clases),
  // lo encadenamos: al abortar el externo, abortamos también esta fetch.
  if (opciones.signal) {
    if (opciones.signal.aborted) {
      controller.abort();
    } else {
      opciones.signal.addEventListener('abort', () => controller.abort());
    }
  }

  const timeoutId = setTimeout(() => controller.abort(), timeout);

  try {
    const response = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify(body),
      signal: controller.signal
    });

    if (!response.ok) {
      throw new Error(`Error HTTP ${response.status}`);
    }

    return await response.json();

  } catch (error) {
    if (error.name === 'AbortError') {
      throw error;
    }
    throw error;
  } finally {
    clearTimeout(timeoutId);
  }
}

function mostrarMensaje(texto, tipo) {
  const msgDiv = document.getElementById('mensajeEstado');
  if (!msgDiv) return;

  msgDiv.textContent = texto;
  msgDiv.className = `mensaje ${tipo}`;
  msgDiv.style.display = 'block';
}
