<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Ironwall Reservas</title>
<style>
/* --- FUENTES DEL SISTEMA --- */
@font-face {
  font-family: 'Archivo Extra Condensed';
  src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Archivo Extra Condensed';
  src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
  font-weight: 700;
  font-display: swap;
}
@font-face {
  font-family: Boris;
  src: url("fonts/BorisBlackBloxx.ttf");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Archivo';
  src: url("fonts/Archivo-Regular.ttf");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Archivo';
  src: url("fonts/Archivo-SemiBold.ttf");
  font-weight: 600;
  font-display: swap;
}
@font-face {
  font-family: 'Archivo';
  src: url("fonts/Archivo-Bold.ttf");
  font-weight: 700;
  font-display: swap;
}

/* --- RESET Y ESTILOS BASE --- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
  color: #222;
  padding: 24px 20px 60px;
  min-height: 100vh;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
}

/* --- CABECERA Y NAVEGACIÓN --- */
.barraNavegacion {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 auto 16px;
}

.btnHome {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #ffffff;
  color: #222;
  text-decoration: none;
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  border: 1px solid #e8ecef;
  transition: transform .2s, box-shadow .2s;
}

.btnHome:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

h1 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}

.subtitulo {
  color: #666;
  font-size: 13px;
  margin-bottom: 20px;
}

/* --- TARJETAS (CARDS) --- */
.card {
  background: #ffffff;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
  border: 1px solid #e8ecef;
}

.titulo-card {
  font-size: 13px;
  font-weight: 700;
  color: #666;
  letter-spacing: .5px;
  margin-bottom: 14px;
  text-transform: uppercase;
}

/* --- INDICADORES Y MÉTRICAS COMPACTAS --- */
.indicadores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}

.indicador-item {
  background: #f8f9fa;
  border: 1px solid #edf0f2;
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
}

.indicador-item span {
  font-size: 11px;
  color: #666;
  margin-bottom: 2px;
}

.indicador-item strong {
  font-size: 18px;
  font-weight: 700;
  color: #111;
}

/* --- FORMULARIOS Y GRID --- */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  align-items: end;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: #333;
}

input, select {
  width: 100%;
  padding: 10px 12px;
  font-size: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: #fff;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus, select:focus {
  outline: none;
  border-color: #222;
  box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
}

/* --- TIPOS Y SELECCIONABLES --- */
.tipos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.tipo {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: .2s;
}

.tipo.activo {
  background: #fff8e6;
  border: 2px solid #c98b00;
  color: #b47700;
}

/* --- BOTONES INTERACTIVOS --- */
button, .btn {
  width: 100%;
  height: 41px;
  padding: 0 16px;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
}

.btn-consultar {
  background-color: #e0e0e0;
  color: #333333;
}

.btn-consultar:hover {
  background-color: #d0d0d0;
}

.btn-reservar {
  background-color: #191919;
  color: #ffffff;
  margin-top: 18px;
}

.btn-reservar:hover {
  background-color: #333333;
}

.btn:disabled, .btn-reservar:disabled {
  opacity: .45;
  cursor: not-allowed;
  transform: none !important;
}

.btn:active:not(:disabled) {
  transform: scale(0.99);
}

/* --- MENSAJES DE ESTADO --- */
#claseBox {
  display: none;
}

.mensaje {
  margin-top: 12px;
  font-weight: 700;
  font-size: 13px;
  padding: 10px;
  border-radius: 8px;
}

.exito {
  background: #dcfce7;
  color: #15803d;
}

.error {
  background: #fee2e2;
  color: #dc2626;
}

/* --- RESPONSIVE / MÓVIL --- */
@media (max-width: 768px) {
  body {
    padding: 16px 12px 40px;
  }

  .card {
    padding: 16px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }
}
      /* --- FILA 1: CONSULTA EN UNA SOLA LÍNEA --- */
.fila-consulta {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr auto; /* Fecha, Hora Inicio, Hora Fin y Botón */
  gap: 12px;
  align-items: end; /* Alinea los inputs y el botón por la base */
}

/* --- FILA 3: CLIENTE, CANTIDAD Y RESERVAR EN UNA SOLA LÍNEA --- */
.fila-reserva {
  display: grid;
  grid-template-columns: 2fr 1fr auto; /* Cliente ancho, Cantidad angosto, Botón */
  gap: 12px;
  align-items: end;
}

/* Ajustes de ancho mínimo para los inputs de tiempo/fecha */
.fila-consulta input, 
.fila-reserva input {
  width: 100%;
}

/* Ajustes de tamaño y estado del Botón Consultar (estilo botón secundario/actualizar) */
.btn-consultar {
  background-color: #e0e0e0;
  color: #333333;
  height: 41px;
  padding: 0 20px;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.2s, transform 0.1s;
}

.btn-consultar:hover {
  background-color: #d0d0d0;
}

/* Ajuste del Botón Reservar (estilo primario destacado) */
.btn-reservar {
  background-color: #191919;
  color: #ffffff;
  height: 41px;
  padding: 0 24px;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 0; /* Cancela márgenes verticales para alinearse */
  transition: background-color 0.2s, transform 0.1s;
}

.btn-reservar:hover {
  background-color: #333333;
}

/* Adaptación responsive para pantallas de celular estrechas */
@media (max-width: 640px) {
  .fila-consulta, .fila-reserva {
    grid-template-columns: 1fr; /* Pasa a columna si no cabe en móviles */
  }
}
</style>


</head>

<body>
<div class="container">
  
  <!-- BARRA DE NAVEGACIÓN -->
  <div class="barraNavegacion">
    <a href="index.html" class="btnHome">
      <span>← Inicio</span>
    </a>
  </div>

  <h1>Sistema de Reservas</h1>
  <p class="subtitulo">Consulta disponibilidad y gestiona reservas en línea</p>

  <!-- TARJETA 1: CONSULTA DE DISPONIBILIDAD (TODO EN UNA LÍNEA) -->
  <div class="card">
    <div class="titulo-card">1. Consulta de Horario</div>
    <div class="fila-consulta">
      <div>
        <label>Fecha</label>
        <input id="fecha" type="date">
      </div>
      <div>
        <label>Hora Inicio</label>
        <input id="horaInicio" type="time">
      </div>
      <div>
        <label>Hora Fin</label>
        <input id="horaFin" type="time">
      </div>
      <button class="btn-consultar" onclick="consultarDisponibilidad()">Consultar</button>
    </div>
  </div>

  <!-- TARJETA 2: TIPO DE RESERVA (ENTRADA / CLASE) -->
  <div class="card">
    <div class="titulo-card">2. Tipo de Reserva</div>
    <div class="tipos">
      <div class="tipo activo" onclick="seleccionarTipo('ENTRADA')">Entrada Libre</div>
      <div class="tipo" onclick="seleccionarTipo('CLASE')">Clase Guiada</div>
    </div>
  </div>

  <!-- TARJETA 3: DATOS Y BOTÓN RESERVAR (TODO EN UNA LÍNEA) -->
  <div class="card">
    <div class="titulo-card">3. Confirmación de Reserva</div>
    <div class="fila-reserva">
      <div>
        <label>Cliente / Nombre</label>
        <input id="clienteId" placeholder="Ej: Juan Pérez">
      </div>
      <div>
        <label>Cantidad personas</label>
        <input id="cantidad" type="number" min="1" value="1">
      </div>
      <button class="btn-reservar" onclick="realizarReserva()">Reservar</button>
    </div>
  </div>

</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


/* =========================================================
   ESTADO GENERAL
========================================================= */

let tipoReserva = 'ENTRADA';

let cuposConsultados = false;

let disponiblesActuales = 0;


/* =========================================================
   FECHA LOCAL
   Evita problemas de zona horaria
========================================================= */

function fechaHoyLocal() {

  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, '0'),
    String(d.getDate()).padStart(2, '0')
  ].join('-');

}


/* =========================================================
   INICIALIZACIÓN
========================================================= */

document.addEventListener('DOMContentLoaded', () => {

  const fecha =
    document.getElementById('fecha');

  if (fecha) {
    fecha.value = fechaHoyLocal();
  }


  /*
   * Eventos que deben volver a evaluar
   * si se puede confirmar la reserva.
   */

  const cliente =
    document.getElementById('clienteId');

  if (cliente) {

    cliente.addEventListener(
      'input',
      actualizarEstadoBotonReserva
    );

  }


  const cantidad =
    document.getElementById('cantidad');

  if (cantidad) {

    cantidad.addEventListener(
      'input',
      actualizarEstadoBotonReserva
    );

    cantidad.addEventListener(
      'change',
      actualizarEstadoBotonReserva
    );

  }


  const clase =
    document.getElementById('claseId');

  if (clase) {

    clase.addEventListener(
      'change',
      seleccionarClase
    );

  }


  /*
   * Si cambia la fecha, la consulta anterior
   * deja de ser válida.
   */

  if (fecha) {

    fecha.addEventListener(
      'change',
      invalidarConsulta
    );

  }


  const horaInicio =
    document.getElementById('horaInicio');

  if (horaInicio) {

    horaInicio.addEventListener(
      'change',
      invalidarConsulta
    );

  }


  const horaFin =
    document.getElementById('horaFin');

  if (horaFin) {

    horaFin.addEventListener(
      'change',
      invalidarConsulta
    );

  }


  actualizarEstadoBotonReserva();

});


/* =========================================================
   INVALIDAR CONSULTA
   Si cambia fecha u horario, hay que volver a consultar.
========================================================= */

function invalidarConsulta() {

  cuposConsultados = false;

  disponiblesActuales = 0;

  const btn =
    document.getElementById('btnReservar');

  if (btn) {
    btn.disabled = true;
  }


  /*
   * Si estamos trabajando con clases,
   * también limpiamos la selección anterior.
   */

  if (tipoReserva === 'CLASE') {

    const select =
      document.getElementById('claseId');

    if (select) {

      select.value = '';

    }

  }


  actualizarEstadoBotonReserva();

}


/* =========================================================
   SELECCIÓN ENTRADA / CLASE
========================================================= */

function seleccionarTipo(tipo) {

  tipoReserva = tipo;

  const btnEntrada = document.getElementById('btnEntrada');
  const btnClase = document.getElementById('btnClase');
  const claseBox = document.getElementById('claseBox');

  if (tipo === 'ENTRADA') {

    if (btnEntrada) {
      btnEntrada.className = 'tipo activo';
    }

    if (btnClase) {
      btnClase.className = 'tipo';
    }

    if (claseBox) {
      claseBox.style.display = 'none';
    }

    if (cuposConsultados) {
      actualizarEstadoBotonReserva();
    }

  }

  else if (tipo === 'CLASE') {

    if (btnEntrada) {
      btnEntrada.className = 'tipo';
    }

    if (btnClase) {
      btnClase.className = 'tipo activo';
    }

    if (claseBox) {
      claseBox.style.display = 'block';
    }

    if (cuposConsultados) {
      cargarClases();
    }

    actualizarEstadoBotonReserva();
  }
}


/* =========================================================
   API
========================================================= */

async function api(body) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body: JSON.stringify(body)
      }
    );


  if (!response.ok) {

    throw new Error(
      'Error de comunicación con el servidor'
    );

  }


  return await response.json();

}


/* =========================================================
   PASO 1 — CONSULTAR CUPOS
========================================================= */

async function consultarCupos() {

  const fecha =
    document
      .getElementById('fecha')
      .value;


  const horaInicio =
    document
      .getElementById('horaInicio')
      .value;


  const horaFin =
    document
      .getElementById('horaFin')
      .value;


  if (
    !fecha ||
    !horaInicio ||
    !horaFin
  ) {

    mostrar(
      'Completa fecha y horario',
      'error'
    );

    return;

  }


  if (horaFin <= horaInicio) {

    mostrar(
      'La hora de término debe ser posterior a la hora de inicio',
      'error'
    );

    return;

  }


  /*
   * Mientras consulta el servidor,
   * Paso 2 queda bloqueado.
   */

  cuposConsultados = false;

  disponiblesActuales = 0;

  actualizarEstadoBotonReserva();


  try {

    const resultado =
      await api({

        action: 'ocupacion',

        fecha,

        horaInicio,

        horaFin

      });


    if (!resultado.ok) {

      throw new Error(
        resultado.mensaje
      );

    }


    /*
     * Mostrar información de capacidad.
     */

    document
      .getElementById('ocupacion')
      .textContent =
      resultado.ocupacion;


    document
      .getElementById('disponibles')
      .textContent =
      resultado.disponibles;


    document
      .getElementById('capacidad')
      .textContent =
      resultado.capacidad;


    /*
     * Guardamos el resultado de la consulta.
     */

    disponiblesActuales =
      Number(
        resultado.disponibles || 0
      );


    cuposConsultados =
      disponiblesActuales > 0;


    /*
     * Si es una reserva de CLASE,
     * cargamos las clases de esa fecha.
     */

    if (tipoReserva === 'CLASE') {

      await cargarClases();

    }


    actualizarEstadoBotonReserva();


    if (resultado.lleno) {

      mostrar(
        'No hay cupos disponibles para este periodo',
        'error'
      );

    }

    else {

      if (tipoReserva === 'CLASE') {

        mostrar(
          'Cupos disponibles. Selecciona una clase.',
          'exito'
        );

      }

      else {

        mostrar(
          'Cupos disponibles',
          'exito'
        );

      }

    }

  }


  catch (error) {

    cuposConsultados = false;

    disponiblesActuales = 0;

    actualizarEstadoBotonReserva();


    mostrar(
      'Error: ' + error.message,
      'error'
    );

  }

}


/* =========================================================
   CARGAR CLASES DE UNA FECHA
========================================================= */

async function cargarClases() {

  const fecha =
    document
      .getElementById('fecha')
      .value;


  if (!fecha) {
    return;
  }


  const select =
    document
      .getElementById('claseId');


  if (!select) {
    return;
  }


  /*
   * Mientras se cargan las clases,
   * dejamos la selección limpia.
   */

  select.innerHTML =
    '<option value="">Cargando clases...</option>';


  try {

    const resultado =
      await api({

        action:
          'listarClasesFecha',

        fecha

      });


    select.innerHTML =
      '<option value="">Selecciona una clase</option>';


    if (!resultado.ok) {

      mostrar(
        resultado.mensaje ||
        'No se pudieron cargar las clases',
        'error'
      );

      actualizarEstadoBotonReserva();

      return;

    }


    const clases =
      (resultado.clases || [])
        .filter(
          c =>
            String(c.Estado).trim() ===
            'ACTIVA'
        );


    if (clases.length === 0) {

      select.innerHTML =
        '<option value="">No hay clases disponibles</option>';

      actualizarEstadoBotonReserva();

      return;

    }


    clases.forEach(
      clase => {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          clase.ClaseID;


        option.textContent =
          `${clase.Nombre} — ${clase.HoraInicio}-${clase.HoraFin} — ${clase.Capacidad} cupos`;


        select.appendChild(
          option
        );

      }
    );


  }


  catch (error) {

    select.innerHTML =
      '<option value="">Error al cargar clases</option>';


    mostrar(
      'Error al cargar clases: ' +
      error.message,
      'error'
    );

  }


  actualizarEstadoBotonReserva();

}


/* =========================================================
   SELECCIÓN DE CLASE
========================================================= */

function seleccionarClase() {

  actualizarEstadoBotonReserva();

}


/* =========================================================
   CONTROL CENTRAL DEL BOTÓN PASO 2
========================================================= */

function actualizarEstadoBotonReserva() {

  const btn =
    document.getElementById('btnReservar');


  if (!btn) {
    return;
  }


  const clienteElement =
    document.getElementById('clienteId');


  const cantidadElement =
    document.getElementById('cantidad');


  const claseElement =
    document.getElementById('claseId');


  const clienteId =
    clienteElement
      ? clienteElement.value.trim()
      : '';


  const cantidad =
    cantidadElement
      ? Number(cantidadElement.value)
      : 0;


  /*
   * Primero verificamos las condiciones
   * comunes a cualquier reserva.
   */

  let puedeReservar =

    cuposConsultados &&

    disponiblesActuales >= cantidad &&

    clienteId !== '' &&

    Number.isInteger(cantidad) &&

    cantidad >= 1;


  /*
   * Las reservas de CLASE requieren
   * obligatoriamente una clase.
   */

  if (
    tipoReserva === 'CLASE'
  ) {

    const claseId =
      claseElement
        ? claseElement.value.trim()
        : '';


    if (!claseId) {

      puedeReservar = false;

    }

  }


  btn.disabled =
    !puedeReservar;

}


/* =========================================================
   PASO 2 — CREAR RESERVA
========================================================= */

async function realizarReserva() {

  const clienteId =
    document
      .getElementById('clienteId')
      .value
      .trim();


  const fecha =
    document
      .getElementById('fecha')
      .value;


  const horaInicio =
    document
      .getElementById('horaInicio')
      .value;


  const horaFin =
    document
      .getElementById('horaFin')
      .value;


  const cantidad =
    Number(
      document
        .getElementById('cantidad')
        .value
    );


  const claseElement =
    document
      .getElementById('claseId');


  const claseId =
    claseElement
      ? claseElement.value
      : '';


  /*
   * Validaciones.
   */

  if (!cuposConsultados) {

    mostrar(
      'Primero consulta los cupos disponibles',
      'error'
    );

    return;

  }


  if (!clienteId) {

    mostrar(
      'Ingresa el ClienteID',
      'error'
    );

    return;

  }


  if (
    !Number.isInteger(cantidad) ||
    cantidad < 1
  ) {

    mostrar(
      'La cantidad debe ser un número válido',
      'error'
    );

    return;

  }


  if (
    tipoReserva === 'CLASE' &&
    !claseId
  ) {

    mostrar(
      'Selecciona una clase',
      'error'
    );

    return;

  }


  /*
   * Evita doble clic / doble reserva.
   */

  const btn =
    document
      .getElementById('btnReservar');


  btn.disabled = true;


  try {

    const resultado =
      await api({

        action:
          'crearReserva',

        clienteId,

        tipoReserva,

        fecha,

        horaInicio,

        horaFin,

        cantidad,

        claseId,

        origen:
          'WEB',

        usuario:
          'WEB'

      });


    if (!resultado.ok) {

      /*
       * Si el servidor rechazó la reserva,
       * volvemos a permitir el botón solamente
       * si las condiciones siguen siendo válidas.
       */

      mostrar(
        resultado.mensaje,
        'error'
      );

      actualizarEstadoBotonReserva();

      return;

    }


    /*
     * Reserva creada.
     */

    mostrar(
      `¡Reserva exitosa! ID: ${resultado.reservaId}`,
      'exito'
    );


    /*
     * Bloqueamos temporalmente el botón
     * para evitar duplicados.
     */

    btn.disabled = true;


    /*
     * Volvemos a consultar capacidad.
     * Esto actualiza el número de cupos.
     */

    await consultarCupos();


  }


  catch (error) {

    mostrar(
      'Error: ' +
      error.message,
      'error'
    );


    actualizarEstadoBotonReserva();

  }

}


/* =========================================================
   MENSAJES
========================================================= */

function mostrar(
  texto,
  tipo
) {

  const elemento =
    document
      .getElementById('mensaje');


  if (!elemento) {
    return;
  }


  elemento.textContent =
    texto;


  elemento.className =
    'mensaje ' + tipo;

}

</script>
