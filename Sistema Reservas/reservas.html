<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Ironwall Reservas</title>
<style>
* {  box-sizing: border-box;}

body {
  font-family: Arial, sans-serif;
  background: #ffffff;
  margin: 0;
  color: #222;
}

.container {
  width: min(570px, 94%);
  margin: 0 auto;
  padding: 25px 0 40px;
}

h1 {
  margin: 0 0 5px;
}

.subtitulo {
  color: #666;
  margin-bottom: 22px;
}

.card {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 18px;
}

.disponibilidad {
  background: #f0fff5;
  border-color: #9be8b7;
}

.titulo-card {
  font-weight: bold;
  margin-bottom: 10px;
}

.indicadores {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.indicador {
  border: 1px solid #6bdc96;
  border-radius: 20px;
  padding: 7px 12px;
}

.indicador span {
  background: #16c96a;
  color: white;
  border-radius: 12px;
  padding: 2px 7px;
  font-weight: bold;
}

label {
  display: block;
  margin: 17px 0 7px;
  font-weight: bold;
}

input,
select,
button {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 15px;
}

.horas {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.tipos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.tipo {
  background: white;
  font-weight: bold;
}

.tipo.activo {
  background: #fff8e6;
  border: 2px solid #c98b00;
  color: #b47700;
}

.btn {
  margin-top: 18px;
  font-weight: bold;
  cursor: pointer;
}

.btn-consultar {
  background: #e7e9ec;
}

.btn-reservar {
  background: #191919;
  color: white;
}

.btn-reservar:disabled {
  opacity: .45;
  cursor: not-allowed;
}

#claseBox {
  display: none;
}

.mensaje {
  margin-top: 12px;
  font-weight: bold;
}

.exito {
  color: #008c4a;
}

.error {
  color: #c62828;
}

</style>

</head>

<body>

<div class="container">

<h1>Ironwall Reservas</h1>

<div class="subtitulo">Gestión de cupos y confirmación de accesos</div>
<div class="card disponibilidad"><div class="titulo-card">CUPOS DISPONIBLES EN EL PERIODO</div>
      <div class="indicadores">
            <div class="indicador">
            Ocupación
            <span id="ocupacion">-</span>
            </div>
      
            <div class="indicador">
            Disponibles
            <span id="disponibles">-</span>
            </div>
      
            <div class="indicador">
            Capacidad
            <span id="capacidad">-</span>
            </div>
      </div>
</div>

<div class="card">

      <label>
      Fecha
      </label>
      
      <input
        id="fecha"
        type="date">
      
      
      <div class="horas">
      
      <div>
      
      <label>
      Hora Inicio
      </label>
      
      <input
        id="horaInicio"
        type="time"
        value="18:00">
      
      </div>
      
      
      <div>
      
      <label>
      Hora Término
      </label>
      
      <input
        id="horaFin"
        type="time"
        value="20:00">
      
      </div>
      
      </div>
      
      
      <button
        class="btn btn-consultar"
        onclick="consultarCupos()">
      
      Paso 1: Consultar Cupos Disponibles
      
      </button>
      
      
      <label>
      Tipo de Reserva
      </label>
      
      <div class="tipos">
      
      <button
        id="btnEntrada"
        class="tipo activo"
        onclick="seleccionarTipo('ENTRADA')">
      
      Entrada General
      
      </button>
      
      <button
        id="btnClase"
        class="tipo"
        onclick="seleccionarTipo('CLASE')">
      
      Clase
      
      </button>
      
      </div>
      
      
      <div id="claseBox">
      
      <label>
      Seleccionar Clase
      </label>
      
      <select id="claseId"
              onchange="seleccionarClase()">
      
      <option value="">
      Selecciona una clase
      </option>
      
      </select>
      
      </div>
      
      
      <label>
      ID Cliente
      </label>
      
      <input
        id="clienteId"
        placeholder="Ej: CLI-001">
      
      
      <small>
      Código asignado en el sistema de gestión
      </small>
      
      
      <label>
      Cantidad de Personas
      </label>
      
      <input
        id="cantidad"
        type="number"
        min="1"
        max="5"
        value="1">
          
      <button
        id="btnReservar"
        class="btn btn-reservar"
        disabled
        onclick="realizarReserva()">
      
      Paso 2: Confirmar Reserva
      
      </button>
           
      <div
        id="mensaje"
        class="mensaje">
      </div>

</div>

</div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';


/* =========================================================
   ESTADO GENERAL
========================================================= */

let tipoReserva = 'ENTRADA';

let cuposConsultados = false;

let disponiblesActuales = 0;


/* =========================================================
   FECHA LOCAL
   Evita problemas de zona horaria
========================================================= */

function fechaHoyLocal() {

  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, '0'),
    String(d.getDate()).padStart(2, '0')
  ].join('-');

}


/* =========================================================
   INICIALIZACIÓN
========================================================= */

document.addEventListener('DOMContentLoaded', () => {

  const fecha =
    document.getElementById('fecha');

  if (fecha) {
    fecha.value = fechaHoyLocal();
  }


  /*
   * Eventos que deben volver a evaluar
   * si se puede confirmar la reserva.
   */

  const cliente =
    document.getElementById('clienteId');

  if (cliente) {

    cliente.addEventListener(
      'input',
      actualizarEstadoBotonReserva
    );

  }


  const cantidad =
    document.getElementById('cantidad');

  if (cantidad) {

    cantidad.addEventListener(
      'input',
      actualizarEstadoBotonReserva
    );

    cantidad.addEventListener(
      'change',
      actualizarEstadoBotonReserva
    );

  }


  const clase =
    document.getElementById('claseId');

  if (clase) {

    clase.addEventListener(
      'change',
      seleccionarClase
    );

  }


  /*
   * Si cambia la fecha, la consulta anterior
   * deja de ser válida.
   */

  if (fecha) {

    fecha.addEventListener(
      'change',
      invalidarConsulta
    );

  }


  const horaInicio =
    document.getElementById('horaInicio');

  if (horaInicio) {

    horaInicio.addEventListener(
      'change',
      invalidarConsulta
    );

  }


  const horaFin =
    document.getElementById('horaFin');

  if (horaFin) {

    horaFin.addEventListener(
      'change',
      invalidarConsulta
    );

  }


  actualizarEstadoBotonReserva();

});


/* =========================================================
   INVALIDAR CONSULTA
   Si cambia fecha u horario, hay que volver a consultar.
========================================================= */

function invalidarConsulta() {

  cuposConsultados = false;

  disponiblesActuales = 0;

  const btn =
    document.getElementById('btnReservar');

  if (btn) {
    btn.disabled = true;
  }


  /*
   * Si estamos trabajando con clases,
   * también limpiamos la selección anterior.
   */

  if (tipoReserva === 'CLASE') {

    const select =
      document.getElementById('claseId');

    if (select) {

      select.value = '';

    }

  }


  actualizarEstadoBotonReserva();

}


/* =========================================================
   SELECCIÓN ENTRADA / CLASE
========================================================= */

function seleccionarTipo(tipo) {

  tipoReserva = tipo;


  const btnEntrada =
    document.getElementById('btnEntrada');

  const btnClase =
    document.getElementById('btnClase');


  if (tipo === 'ENTRADA') {

    if (btnEntrada) {
      btnEntrada.className =
        'activo-entrada';
    }

    if (btnClase) {
      btnClase.className = '';
    }


    /*
     * Entrada general no necesita
     * seleccionar una clase.
     */

    actualizarEstadoBotonReserva();

  }


  else if (tipo === 'CLASE') {

    if (btnEntrada) {
      btnEntrada.className = '';
    }

    if (btnClase) {
      btnClase.className =
        'activo-clase';
    }


    /*
     * Si ya se había hecho Paso 1,
     * cargamos inmediatamente las clases
     * correspondientes a la fecha.
     */

    if (cuposConsultados) {

      cargarClases();

    }


    actualizarEstadoBotonReserva();

  }

}


/* =========================================================
   API
========================================================= */

async function api(body) {

  const response =
    await fetch(
      API_URL,
      {
        method: 'POST',
        body: JSON.stringify(body)
      }
    );


  if (!response.ok) {

    throw new Error(
      'Error de comunicación con el servidor'
    );

  }


  return await response.json();

}


/* =========================================================
   PASO 1 — CONSULTAR CUPOS
========================================================= */

async function consultarCupos() {

  const fecha =
    document
      .getElementById('fecha')
      .value;


  const horaInicio =
    document
      .getElementById('horaInicio')
      .value;


  const horaFin =
    document
      .getElementById('horaFin')
      .value;


  if (
    !fecha ||
    !horaInicio ||
    !horaFin
  ) {

    mostrar(
      'Completa fecha y horario',
      'error'
    );

    return;

  }


  if (horaFin <= horaInicio) {

    mostrar(
      'La hora de término debe ser posterior a la hora de inicio',
      'error'
    );

    return;

  }


  /*
   * Mientras consulta el servidor,
   * Paso 2 queda bloqueado.
   */

  cuposConsultados = false;

  disponiblesActuales = 0;

  actualizarEstadoBotonReserva();


  try {

    const resultado =
      await api({

        action: 'ocupacion',

        fecha,

        horaInicio,

        horaFin

      });


    if (!resultado.ok) {

      throw new Error(
        resultado.mensaje
      );

    }


    /*
     * Mostrar información de capacidad.
     */

    document
      .getElementById('ocupacion')
      .textContent =
      resultado.ocupacion;


    document
      .getElementById('disponibles')
      .textContent =
      resultado.disponibles;


    document
      .getElementById('capacidad')
      .textContent =
      resultado.capacidad;


    /*
     * Guardamos el resultado de la consulta.
     */

    disponiblesActuales =
      Number(
        resultado.disponibles || 0
      );


    cuposConsultados =
      disponiblesActuales > 0;


    /*
     * Si es una reserva de CLASE,
     * cargamos las clases de esa fecha.
     */

    if (tipoReserva === 'CLASE') {

      await cargarClases();

    }


    actualizarEstadoBotonReserva();


    if (resultado.lleno) {

      mostrar(
        'No hay cupos disponibles para este periodo',
        'error'
      );

    }

    else {

      if (tipoReserva === 'CLASE') {

        mostrar(
          'Cupos disponibles. Selecciona una clase.',
          'exito'
        );

      }

      else {

        mostrar(
          'Cupos disponibles',
          'exito'
        );

      }

    }

  }


  catch (error) {

    cuposConsultados = false;

    disponiblesActuales = 0;

    actualizarEstadoBotonReserva();


    mostrar(
      'Error: ' + error.message,
      'error'
    );

  }

}


/* =========================================================
   CARGAR CLASES DE UNA FECHA
========================================================= */

async function cargarClases() {

  const fecha =
    document
      .getElementById('fecha')
      .value;


  if (!fecha) {
    return;
  }


  const select =
    document
      .getElementById('claseId');


  if (!select) {
    return;
  }


  /*
   * Mientras se cargan las clases,
   * dejamos la selección limpia.
   */

  select.innerHTML =
    '<option value="">Cargando clases...</option>';


  try {

    const resultado =
      await api({

        action:
          'listarClasesFecha',

        fecha

      });


    select.innerHTML =
      '<option value="">Selecciona una clase</option>';


    if (!resultado.ok) {

      mostrar(
        resultado.mensaje ||
        'No se pudieron cargar las clases',
        'error'
      );

      actualizarEstadoBotonReserva();

      return;

    }


    const clases =
      (resultado.clases || [])
        .filter(
          c =>
            String(c.Estado).trim() ===
            'ACTIVA'
        );


    if (clases.length === 0) {

      select.innerHTML =
        '<option value="">No hay clases disponibles</option>';

      actualizarEstadoBotonReserva();

      return;

    }


    clases.forEach(
      clase => {

        const option =
          document.createElement(
            'option'
          );


        option.value =
          clase.ClaseID;


        option.textContent =
          `${clase.Nombre} — ${clase.HoraInicio}-${clase.HoraFin} — ${clase.Capacidad} cupos`;


        select.appendChild(
          option
        );

      }
    );


  }


  catch (error) {

    select.innerHTML =
      '<option value="">Error al cargar clases</option>';


    mostrar(
      'Error al cargar clases: ' +
      error.message,
      'error'
    );

  }


  actualizarEstadoBotonReserva();

}


/* =========================================================
   SELECCIÓN DE CLASE
========================================================= */

function seleccionarClase() {

  actualizarEstadoBotonReserva();

}


/* =========================================================
   CONTROL CENTRAL DEL BOTÓN PASO 2
========================================================= */

function actualizarEstadoBotonReserva() {

  const btn =
    document.getElementById('btnReservar');


  if (!btn) {
    return;
  }


  const clienteElement =
    document.getElementById('clienteId');


  const cantidadElement =
    document.getElementById('cantidad');


  const claseElement =
    document.getElementById('claseId');


  const clienteId =
    clienteElement
      ? clienteElement.value.trim()
      : '';


  const cantidad =
    cantidadElement
      ? Number(cantidadElement.value)
      : 0;


  /*
   * Primero verificamos las condiciones
   * comunes a cualquier reserva.
   */

  let puedeReservar =

    cuposConsultados &&

    disponiblesActuales >= cantidad &&

    clienteId !== '' &&

    Number.isInteger(cantidad) &&

    cantidad >= 1;


  /*
   * Las reservas de CLASE requieren
   * obligatoriamente una clase.
   */

  if (
    tipoReserva === 'CLASE'
  ) {

    const claseId =
      claseElement
        ? claseElement.value.trim()
        : '';


    if (!claseId) {

      puedeReservar = false;

    }

  }


  btn.disabled =
    !puedeReservar;

}


/* =========================================================
   PASO 2 — CREAR RESERVA
========================================================= */

async function realizarReserva() {

  const clienteId =
    document
      .getElementById('clienteId')
      .value
      .trim();


  const fecha =
    document
      .getElementById('fecha')
      .value;


  const horaInicio =
    document
      .getElementById('horaInicio')
      .value;


  const horaFin =
    document
      .getElementById('horaFin')
      .value;


  const cantidad =
    Number(
      document
        .getElementById('cantidad')
        .value
    );


  const claseElement =
    document
      .getElementById('claseId');


  const claseId =
    claseElement
      ? claseElement.value
      : '';


  /*
   * Validaciones.
   */

  if (!cuposConsultados) {

    mostrar(
      'Primero consulta los cupos disponibles',
      'error'
    );

    return;

  }


  if (!clienteId) {

    mostrar(
      'Ingresa el ClienteID',
      'error'
    );

    return;

  }


  if (
    !Number.isInteger(cantidad) ||
    cantidad < 1
  ) {

    mostrar(
      'La cantidad debe ser un número válido',
      'error'
    );

    return;

  }


  if (
    tipoReserva === 'CLASE' &&
    !claseId
  ) {

    mostrar(
      'Selecciona una clase',
      'error'
    );

    return;

  }


  /*
   * Evita doble clic / doble reserva.
   */

  const btn =
    document
      .getElementById('btnReservar');


  btn.disabled = true;


  try {

    const resultado =
      await api({

        action:
          'crearReserva',

        clienteId,

        tipoReserva,

        fecha,

        horaInicio,

        horaFin,

        cantidad,

        claseId,

        origen:
          'WEB',

        usuario:
          'WEB'

      });


    if (!resultado.ok) {

      /*
       * Si el servidor rechazó la reserva,
       * volvemos a permitir el botón solamente
       * si las condiciones siguen siendo válidas.
       */

      mostrar(
        resultado.mensaje,
        'error'
      );

      actualizarEstadoBotonReserva();

      return;

    }


    /*
     * Reserva creada.
     */

    mostrar(
      `¡Reserva exitosa! ID: ${resultado.reservaId}`,
      'exito'
    );


    /*
     * Bloqueamos temporalmente el botón
     * para evitar duplicados.
     */

    btn.disabled = true;


    /*
     * Volvemos a consultar capacidad.
     * Esto actualiza el número de cupos.
     */

    await consultarCupos();


  }


  catch (error) {

    mostrar(
      'Error: ' +
      error.message,
      'error'
    );


    actualizarEstadoBotonReserva();

  }

}


/* =========================================================
   MENSAJES
========================================================= */

function mostrar(
  texto,
  tipo
) {

  const elemento =
    document
      .getElementById('mensaje');


  if (!elemento) {
    return;
  }


  elemento.textContent =
    texto;


  elemento.className =
    'mensaje ' + tipo;

}

</script>



</body>

</html>
