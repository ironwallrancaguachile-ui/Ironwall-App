<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>Ironwall Reservas</title>
<style>
/* --- FUENTES DEL SISTEMA --- */
@font-face {
  font-family: 'Archivo Extra Condensed';
  src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Archivo Extra Condensed';
  src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
  font-weight: 700;
  font-display: swap;
}
@font-face {
  font-family: Boris;
  src: url("fonts/BorisBlackBloxx.ttf");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Archivo';
  src: url("fonts/Archivo-Regular.ttf");
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Archivo';
  src: url("fonts/Archivo-SemiBold.ttf");
  font-weight: 600;
  font-display: swap;
}
@font-face {
  font-family: 'Archivo';
  src: url("fonts/Archivo-Bold.ttf");
  font-weight: 700;
  font-display: swap;
}

/* --- RESET Y ESTILOS BASE --- */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
  color: #222;
  padding: 24px 20px 60px;
  min-height: 100vh;
}

.container {
  max-width: 1100px;
  margin: 0 auto;
}

/* --- CABECERA Y NAVEGACIÓN --- */
.barraNavegacion {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 0 auto 16px;
}

.btnHome {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #ffffff;
  color: #222;
  text-decoration: none;
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  box-shadow: 0 2px 8px rgba(0,0,0,.08);
  border: 1px solid #e8ecef;
  transition: transform .2s, box-shadow .2s;
}

.btnHome:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(0,0,0,.12);
}

h1 {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 4px;
}

.subtitulo {
  color: #666;
  font-size: 13px;
  margin-bottom: 20px;
}

/* --- TARJETAS (CARDS) --- */
.card {
  background: #ffffff;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
  border: 1px solid #e8ecef;
}

.titulo-card {
  font-size: 13px;
  font-weight: 700;
  color: #666;
  letter-spacing: .5px;
  margin-bottom: 14px;
  text-transform: uppercase;
}

/* --- INDICADORES Y MÉTRICAS COMPACTAS --- */
.indicadores {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 10px;
}

.indicador-item {
  background: #f8f9fa;
  border: 1px solid #edf0f2;
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
}

.indicador-item span {
  font-size: 11px;
  color: #666;
  margin-bottom: 2px;
}

.indicador-item strong {
  font-size: 18px;
  font-weight: 700;
  color: #111;
}

/* --- FORMULARIOS Y GRID --- */
.form-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  align-items: end;
}

label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 6px;
  color: #333;
}

input, select {
  width: 100%;
  padding: 10px 12px;
  font-size: 13px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: #fff;
  transition: border-color 0.2s, box-shadow 0.2s;
}

input:focus, select:focus {
  outline: none;
  border-color: #222;
  box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
}

/* --- TIPOS Y SELECCIONABLES --- */
.tipos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.tipo {
  background: #fff;
  border: 1px solid #ccc;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: .2s;
}

.tipo.activo {
  background: #fff8e6;
  border: 2px solid #c98b00;
  color: #b47700;
}

/* --- BOTONES INTERACTIVOS --- */
button, .btn {
  width: 100%;
  height: 41px;
  padding: 0 16px;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
}

.btn-consultar {
  background-color: #e0e0e0;
  color: #333333;
}

.btn-consultar:hover {
  background-color: #d0d0d0;
}

.btn-reservar {
  background-color: #191919;
  color: #ffffff;
  margin-top: 18px;
}

.btn-reservar:hover {
  background-color: #333333;
}

.btn:disabled, .btn-reservar:disabled {
  opacity: .45;
  cursor: not-allowed;
  transform: none !important;
}

.btn:active:not(:disabled) {
  transform: scale(0.99);
}

/* --- MENSAJES DE ESTADO --- */
#claseBox {
  display: none;
}

.mensaje {
  margin-top: 12px;
  font-weight: 700;
  font-size: 13px;
  padding: 10px;
  border-radius: 8px;
}

.exito {
  background: #dcfce7;
  color: #15803d;
}

.error {
  background: #fee2e2;
  color: #dc2626;
}

/* --- RESPONSIVE / MÓVIL --- */
@media (max-width: 768px) {
  body {
    padding: 16px 12px 40px;
  }

  .card {
    padding: 16px;
  }

  .form-grid {
    grid-template-columns: 1fr;
  }
}
      /* --- FILA 1: CONSULTA EN UNA SOLA LÍNEA --- */
.fila-consulta {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr auto; /* Fecha, Hora Inicio, Hora Fin y Botón */
  gap: 12px;
  align-items: end; /* Alinea los inputs y el botón por la base */
}

/* --- FILA 3: CLIENTE, CANTIDAD Y RESERVAR EN UNA SOLA LÍNEA --- */
.fila-reserva {
  display: grid;
  grid-template-columns: 2fr 1fr auto; /* Cliente ancho, Cantidad angosto, Botón */
  gap: 12px;
  align-items: end;
}

/* Ajustes de ancho mínimo para los inputs de tiempo/fecha */
.fila-consulta input, 
.fila-reserva input {
  width: 100%;
}

/* Ajustes de tamaño y estado del Botón Consultar (estilo botón secundario/actualizar) */
.btn-consultar {
  background-color: #e0e0e0;
  color: #333333;
  height: 41px;
  padding: 0 20px;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: background-color 0.2s, transform 0.1s;
}

.btn-consultar:hover {
  background-color: #d0d0d0;
}

/* Ajuste del Botón Reservar (estilo primario destacado) */
.btn-reservar {
  background-color: #191919;
  color: #ffffff;
  height: 41px;
  padding: 0 24px;
  border: 0;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 0; /* Cancela márgenes verticales para alinearse */
  transition: background-color 0.2s, transform 0.1s;
}

.btn-reservar:hover {
  background-color: #333333;
}

/* Adaptación responsive para pantallas de celular estrechas */
@media (max-width: 640px) {
  .fila-consulta, .fila-reserva {
    grid-template-columns: 1fr; /* Pasa a columna si no cabe en móviles */
  }
}
</style>


</head>

<body>
<div class="container">
  
  <!-- BARRA DE NAVEGACIÓN -->
  <div class="barraNavegacion">
    <a href="index.html" class="btnHome">
      <span>← Inicio</span>
    </a>
  </div>

  <h1>Sistema de Reservas</h1>
  <p class="subtitulo">Consulta disponibilidad y gestiona reservas en línea</p>

<!-- TARJETA 1: CONSULTA DE HORARIO -->
<div class="card">
  <div class="titulo-card">1. Consulta de Horario</div>
  
  <div class="fila-consulta">
    <div>
      <label>Fecha</label>
      <input id="fecha" type="date">
    </div>
    <div>
      <label>Hora Inicio</label>
      <input id="horaInicio" type="time">
    </div>
    <div>
      <label>Hora Fin</label>
      <input id="horaFin" type="time">
    </div>
    <button class="btn-consultar" onclick="consultarDisponibilidad()">Consultar</button>
  </div>

  <!-- RESULTADOS DE LA CONSULTA (Aparecen aquí abajo) -->
  <div id="resultadoConsulta" style="display: none; margin-top: 16px; padding-top: 14px; border-top: 1px solid #edf0f2;">
    <div class="indicadores">
      <div class="indicador-item">
        <span>Capacidad Total</span>
        <strong id="capacidad">0</strong>
      </div>
      <div class="indicador-item">
        <span>Ocupados</span>
        <strong id="ocupacion">0</strong>
      </div>
      <div class="indicador-item">
        <span>Disponibles</span>
        <strong id="disponibles" style="color: #15803d;">0</strong>
      </div>
    </div>
    <div id="mensajeEstado" class="mensaje" style="display: none; margin-top: 10px;"></div>
  </div>
</div>

<!-- TARJETA 2: TIPO DE RESERVA -->
<div class="card">
  <div class="titulo-card">2. Tipo de Reserva</div>
  <div class="tipos">
    <div class="tipo activo" onclick="seleccionarTipo('ENTRADA')">Entrada Libre</div>
    <div class="tipo" onclick="seleccionarTipo('CLASE')">Clase Guiada</div>
  </div>

  <!-- DESPLEGABLE DE CLASES (Se muestra solo cuando tipoReserva === 'CLASE') -->
  <div id="claseBox" style="display: none; margin-top: 14px; padding-top: 12px; border-top: 1px solid #edf0f2;">
    <label for="claseSelect">Selecciona la Clase Disponible</label>
    <select id="claseSelect" onchange="actualizarEstadoBotonReserva()">
      <option value="">Cargando clases...</option>
    </select>
  </div>
</div>

  <!-- TARJETA 3: DATOS Y BOTÓN RESERVAR (TODO EN UNA LÍNEA) -->
  <div class="card">
    <div class="titulo-card">3. Confirmación de Reserva</div>
    <div class="fila-reserva">
      <div>
        <label>Cliente / Nombre</label>
        <input id="clienteId" placeholder="Ej: Juan Pérez">
      </div>
      <div>
        <label>Cantidad personas</label>
        <input id="cantidad" type="number" min="1" value="1">
      </div>
      <button class="btn-reservar" onclick="realizarReserva()">Reservar</button>
    </div>
  </div>

</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';

/* =========================================================
   ESTADO GENERAL
========================================================= */
let tipoReserva = 'ENTRADA';
let cuposConsultados = false;
let disponiblesActuales = 0;

/* =========================================================
   INICIALIZACIÓN
========================================================= */
document.addEventListener('DOMContentLoaded', () => {
  const fecha = document.getElementById('fecha');
  if (fecha) {
    const d = new Date();
    fecha.value = [d.getFullYear(), String(d.getMonth() + 1).padStart(2, '0'), String(d.getDate()).padStart(2, '0')].join('-');
  }

  const cliente = document.getElementById('clienteId');
  if (cliente) cliente.addEventListener('input', actualizarEstadoBotonReserva);

  const cantidad = document.getElementById('cantidad');
  if (cantidad) {
    cantidad.addEventListener('input', actualizarEstadoBotonReserva);
    cantidad.addEventListener('change', actualizarEstadoBotonReserva);
  }

  if (fecha) fecha.addEventListener('change', invalidarConsulta);
  const horaInicio = document.getElementById('horaInicio');
  if (horaInicio) horaInicio.addEventListener('change', invalidarConsulta);
  const horaFin = document.getElementById('horaFin');
  if (horaFin) horaFin.addEventListener('change', invalidarConsulta);

  actualizarEstadoBotonReserva();
});

function invalidarConsulta() {
  cuposConsultados = false;
  disponiblesActuales = 0;
  actualizarEstadoBotonReserva();
}

      /* =========================================================
   1. SELECCIÓN ENTRADA / CLASE
========================================================= */
async function seleccionarTipo(tipo) {
  tipoReserva = tipo;
  const opciones = document.querySelectorAll('.tipos .tipo');

  opciones.forEach(el => {
    if (el.textContent.toUpperCase().includes(tipo)) {
      el.classList.add('activo');
    } else {
      el.classList.remove('activo');
    }
  });

  const claseBox = document.getElementById('claseBox');
  if (claseBox) {
    claseBox.style.display = (tipo === 'CLASE') ? 'block' : 'none';
  }

  // Si selecciona CLASE y ya había consultado fecha/hora, cargar el listado de clases
  if (tipo === 'CLASE' && cuposConsultados) {
    await cargarClases();
  }

  actualizarEstadoBotonReserva();
}

/* =========================================================
   2. CONSULTA DE DISPONIBILIDAD (Con llamada a cargarClases)
========================================================= */
async function consultarDisponibilidad() {
  const fecha = document.getElementById('fecha').value;
  const horaInicio = document.getElementById('horaInicio').value;
  const horaFin = document.getElementById('horaFin').value;

  if (!fecha || !horaInicio || !horaFin) {
    mostrarMensaje('Por favor, selecciona la Fecha, Hora de Inicio y Hora de Fin.', 'error');
    return;
  }

  if (horaFin <= horaInicio) {
    mostrarMensaje('La Hora de Fin debe ser posterior a la Hora de Inicio.', 'error');
    return;
  }

  const btn = document.querySelector('.btn-consultar');
  const textoOriginal = btn ? btn.innerText : 'Consultar';

  if (btn) {
    btn.innerText = 'Consultando...';
    btn.disabled = true;
    btn.style.opacity = '0.7';
    btn.style.cursor = 'not-allowed';
  }

  try {
    const resultado = await api({ action: 'ocupacion', fecha, horaInicio, horaFin });

    if (!resultado.ok) {
      throw new Error(resultado.mensaje || 'Error al obtener disponibilidad');
    }

    // Insertar métricas en los marcadores del HTML
    document.getElementById('capacidad').textContent = resultado.capacidad || 0;
    document.getElementById('ocupacion').textContent = resultado.ocupacion || 0;
    document.getElementById('disponibles').textContent = resultado.disponibles || 0;

    const resBox = document.getElementById('resultadoConsulta');
    if (resBox) resBox.style.display = 'block';

    disponiblesActuales = Number(resultado.disponibles || 0);
    cuposConsultados = disponiblesActuales > 0;

    // SI EL TIPO SELECCIONADO ES CLASE, CARGAR EL LISTADO DESDE LA API
    if (tipoReserva === 'CLASE' && cuposConsultados) {
      await cargarClases();
    }

    actualizarEstadoBotonReserva();

    if (resultado.lleno || disponiblesActuales === 0) {
      mostrarMensaje('No hay cupos disponibles para este horario.', 'error');
    } else {
      mostrarMensaje(`¡Hay ${disponiblesActuales} cupos disponibles! Puedes continuar con la reserva.`, 'exito');
    }

    if (btn) {
      btn.innerText = '¡Actualizado!';
      btn.style.backgroundColor = '#dcfce7';
      btn.style.color = '#15803d';
    }

  } catch (error) {
    mostrarMensaje('Error: ' + error.message, 'error');
    invalidarConsulta();
  } finally {
    if (btn) {
      setTimeout(() => {
        btn.innerText = textoOriginal;
        btn.disabled = false;
        btn.style.backgroundColor = '#e0e0e0';
        btn.style.color = '#333333';
        btn.style.opacity = '1';
        btn.style.cursor = 'pointer';
      }, 1500);
    }
  }
}

/* =========================================================
   3. OBTENER Y POBLAR DESPLEGABLE DE CLASES
========================================================= */
async function cargarClases() {
  const select = document.getElementById('claseSelect');
  const fecha = document.getElementById('fecha').value;

  if (!select || !fecha) return;

  select.innerHTML = '<option value="">Cargando clases disponibles...</option>';

  try {
    const res = await api({ action: 'listarClasesFecha', fecha });

    if (!res.ok || !res.clases || res.clases.length === 0) {
      select.innerHTML = '<option value="">No hay clases programadas para esta fecha</option>';
      return;
    }

    // Filtrar solo clases activas
    const clasesActivas = res.clases.filter(c => c.Estado === 'ACTIVA');

    if (clasesActivas.length === 0) {
      select.innerHTML = '<option value="">No hay clases activas disponibles</option>';
      return;
    }

    select.innerHTML = '<option value="">-- Selecciona una clase --</option>';
    clasesActivas.forEach(clase => {
      const opt = document.createElement('option');
      opt.value = clase.ClaseID;
      opt.textContent = `${clase.Nombre} (${clase.HoraInicio} - ${clase.HoraFin})`;
      select.appendChild(opt);
    });

  } catch (error) {
    select.innerHTML = '<option value="">Error al cargar clases</option>';
  }
}

/* Función auxiliar para desplegar alertas dentro de la tarjeta */
function mostrarMensaje(texto, tipo) {
  const msgDiv = document.getElementById('mensajeEstado');
  if (!msgDiv) return;

  msgDiv.textContent = texto;
  msgDiv.className = `mensaje ${tipo}`;
  msgDiv.style.display = 'block';
}
/* =========================================================
   ESTADO Y VALIDACIÓN DEL BOTÓN RESERVAR
========================================================= */
function actualizarEstadoBotonReserva() {
  const btnReservar = document.querySelector('.btn-reservar');
  const cliente = document.getElementById('clienteId')?.value.trim();
  const cantidad = Number(document.getElementById('cantidad')?.value || 0);

  if (!btnReservar) return;

  // Solo se habilita si hay consulta válida, datos del cliente y cupos suficientes
  const esValido = cuposConsultados && cliente !== '' && cantidad > 0 && cantidad <= disponiblesActuales;
  btnReservar.disabled = !esValido;
}

/* =========================================================
   PETICIÓN A LA API
========================================================= */
async function api(body) {
  const response = await fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(body)
  });
  if (!response.ok) throw new Error('Error de conexión con el servidor');
  return await response.json();
}

/* =========================================================
   1. VALIDAR Y ACCIONAR EL BOTÓN RESERVAR
========================================================= */
function actualizarEstadoBotonReserva() {
  const btnReservar = document.querySelector('.btn-reservar');
  const cliente = document.getElementById('clienteId')?.value.trim();
  const cantidad = Number(document.getElementById('cantidad')?.value || 0);
  const claseSelect = document.getElementById('claseSelect')?.value;

  if (!btnReservar) return;

  // Requisitos obligatorios
  let esValido = cuposConsultados && cliente !== '' && cantidad > 0 && cantidad <= disponiblesActuales;

  // Si eligió CLASE, también debe seleccionar una clase del desplegable
  if (tipoReserva === 'CLASE' && !claseSelect) {
    esValido = false;
  }

  btnReservar.disabled = !esValido;
  btnReservar.style.opacity = esValido ? '1' : '0.5';
  btnReservar.style.cursor = esValido ? 'pointer' : 'not-allowed';
}

/* =========================================================
   2. EJECUCIÓN Y ESTADOS DE RESERVA
========================================================= */
async function realizarReserva() {
  const cliente = document.getElementById('clienteId').value.trim();
  const cantidad = Number(document.getElementById('cantidad').value);
  const fecha = document.getElementById('fecha').value;
  const horaInicio = document.getElementById('horaInicio').value;
  const horaFin = document.getElementById('horaFin').value;
  const claseId = document.getElementById('claseSelect')?.value;

  // Validaciones preventivas
  if (!cliente) {
    mostrarMensaje('Debes ingresar el nombre del cliente.', 'error');
    return;
  }
  if (!cantidad || cantidad <= 0) {
    mostrarMensaje('La cantidad de personas debe ser al menos 1.', 'error');
    return;
  }
  if (cantidad > disponiblesActuales) {
    mostrarMensaje(`La cantidad supera los cupos disponibles (${disponiblesActuales}).`, 'error');
    return;
  }
  if (tipoReserva === 'CLASE' && !claseId) {
    mostrarMensaje('Por favor, selecciona una clase de la lista.', 'error');
    return;
  }

  // Estado de Carga en el Botón
  const btn = document.querySelector('.btn-reservar');
  const textoOriginal = btn ? btn.innerText : 'Reservar';

  if (btn) {
    btn.innerText = 'Procesando...';
    btn.disabled = true;
    btn.style.opacity = '0.7';
  }

  try {
    // Estructura del payload según el tipo
    const payload = {
      action: 'reservar',
      tipo: tipoReserva,
      cliente,
      cantidad,
      fecha,
      horaInicio,
      horaFin,
      ...(tipoReserva === 'CLASE' && { claseId })
    };

    const respuesta = await api(payload);

    if (!respuesta.ok) {
      throw new Error(respuesta.mensaje || 'No se pudo completar la reserva.');
    }

    // Feedback de éxito
    if (btn) {
      btn.innerText = '¡Reservado!';
      btn.style.backgroundColor = '#dcfce7';
      btn.style.color = '#15803d';
    }

    mostrarMensaje(`Reserva confirmada con éxito a nombre de ${cliente}.`, 'exito');

    // Limpiar formulario tras 2 segundos
    setTimeout(() => {
      document.getElementById('clienteId').value = '';
      document.getElementById('cantidad').value = '1';
      
      // Actualizar cupos para reflejar el descuento
      consultarDisponibilidad();
    }, 2000);

  } catch (error) {
    mostrarMensaje('Error al reservar: ' + error.message, 'error');
  } finally {
    setTimeout(() => {
      if (btn) {
        btn.innerText = textoOriginal;
        btn.style.backgroundColor = '#191919';
        btn.style.color = '#ffffff';
      }
      actualizarEstadoBotonReserva();
    }, 2000);
  }
}
</script>

</body>

</html>
