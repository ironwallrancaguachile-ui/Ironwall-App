<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironwall - Vista Semanal</title>
  <style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-SemiBold.ttf");
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* --- CABECERA Y NAVEGACIÓN MODIFICADA --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }

    .logo-btn {
      height: 36px;
      width: auto;
      object-fit: contain;
      transform: scale(1.8);
      transform-origin: center;
    }

    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* --- COMPONENTES COMPARTIDOS Y TARJETAS --- */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      border: 1px solid #e8ecef;
    }

    .titulo-card {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      letter-spacing: .5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input, select {
      width: 100%;
      height: 41px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    button, .btn {
      width: 100%;
      height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-primary {
      background-color: #191919;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #333333;
    }

    .btn-secondary {
      background-color: #ffffff;
      color: #191919;
      border: 1px solid #dcdcdc;
    }

    .btn-secondary:hover {
      background-color: #f5f5f5;
    }

    .btn-danger {
      background-color: #dc2626;
      color: #ffffff;
    }

    .btn-danger:hover {
      background-color: #b91c1c;
    }

    .btn-success {
      background-color: #16a34a;
      color: #ffffff;
    }

    .btn-success:hover {
      background-color: #15803d;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    /* --- ESTILOS ESPECÍFICOS SEMANA ORIGINAL --- */
    .semana-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(260px, 1fr));
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 12px;
    }

    .dia-col {
      background: #fff;
      border: 1px solid #e8ecef;
      border-radius: 10px;
      padding: 12px;
      min-width: 260px;
    }

    .dia-header {
      border-bottom: 2px solid #191919;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }

    .dia-nombre {
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .dia-fecha {
      font-size: 12px;
      color: #666;
    }

    .bloque-pista {
      margin-bottom: 12px;
      background: #f8f9fb;
      border-radius: 6px;
      padding: 8px;
    }

    .pista-titulo {
      font-size: 11px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .slot-item {
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    .slot-item.disponible {
      background: #e6f4ea;
      color: #137333;
      border: 1px solid #ceead6;
    }

    .slot-item.reservado {
      background: #feefe3;
      color: #b06000;
      border: 1px solid #f2994a;
    }

    .slot-item.fijo {
      background: #e8f0fe;
      color: #1a73e8;
      border: 1px solid #aecbfa;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, .4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .modal-card {
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .15);
    }

    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }
      .card {
        padding: 16px;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- NAVEGACIÓN Y CABECERA MODIFICADA -->
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome">
        <img src="img/logosn.png" alt="Logo" class="logo-btn">
        <span>← Inicio</span>
      </a>
    </div>

    <h1>Ocupación Semanal</h1>
    <p class="subtitulo">Visualización general de la agenda de la semana</p>

    <!-- FILTRO MODIFICADO (FECHA + ACTUALIZAR) -->
    <div class="card">
      <div class="titulo-card">Filtro de Consulta</div>
      <div class="form-grid">
        <div>
          <label for="fechaSemana">Fecha de Referencia</label>
          <input type="date" id="fechaSemana">
        </div>
        <div>
          <button class="btn-primary" id="btnActualizar" onclick="cargarSemana()">Actualizar</button>
        </div>
      </div>
    </div>

    <!-- VISTA MATRIZ SEMANAL ORIGINAL -->
    <div id="contenedorSemana" class="semana-grid"></div>
  </div>

  <!-- MODAL DE DETALLE DEL TURNO ORIGINAL -->
  <div id="modalTurno" class="modal-overlay" style="display: none;">
    <div class="modal-card">
      <div id="modalContenido"></div>
      <div style="margin-top: 16px; display: flex; gap: 8px;">
        <button class="btn-secondary" onclick="cerrarModal()">Cerrar</button>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';
    let datosSemanaActual = null;

    document.addEventListener('DOMContentLoaded', () => {
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('fechaSemana').value = hoy;
      cargarSemana();
    });

    async function api(body) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      return response.json();
    }

    async function cargarSemana() {
      const fecha = document.getElementById('fechaSemana').value;
      const btn = document.getElementById('btnActualizar');
      const contenedor = document.getElementById('contenedorSemana');

      if (!fecha) return;

      btn.disabled = true;
      btn.innerText = 'Cargando...';

      try {
        const respuesta = await api({ action: 'obtenerSemana', fecha });
        if (respuesta.ok && respuesta.dias) {
          datosSemanaActual = respuesta.dias;
          renderizarSemana(respuesta.dias);
        } else {
          contenedor.innerHTML = '<p style="padding: 16px; color: #666;">No se encontraron datos para la semana seleccionada.</p>';
        }
      } catch (error) {
        contenedor.innerHTML = '<p style="padding: 16px; color: #dc2626;">Error al conectar con el servidor.</p>';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Actualizar';
      }
    }

    function renderizarSemana(dias) {
      const contenedor = document.getElementById('contenedorSemana');
      contenedor.innerHTML = dias.map((dia, diaIdx) => `
        <div class="dia-col">
          <div class="dia-header">
            <div class="dia-nombre">${dia.nombreDia || ''}</div>
            <div class="dia-fecha">${dia.fecha || ''}</div>
          </div>
          ${dia.pistas ? Object.keys(dia.pistas).map(pista => `
            <div class="bloque-pista">
              <div class="pista-titulo">${pista}</div>${dia.pistas[pista].map((slot, slotIdx) => `
                <div class="slot-item ${getClaseEstado(slot.estado)}" onclick="abrirTurno(${diaIdx}, '${pista}', ${slotIdx})">
                  <span>${slot.hora}</span>
                  <strong>${slot.cliente || 'Disponible'}</strong>
                </div>
              `).join('')}
            </div>
          `).join('') : ''}
        </div>
      `).join('');
    }

    function getClaseEstado(estado) {
      if (estado === 'Reservado') return 'reservado';
      if (estado === 'Fijo') return 'fijo';
      return 'disponible';
    }

    function abrirTurno(diaIdx, pista, slotIdx) {
      const slot = datosSemanaActual[diaIdx].pistas[pista][slotIdx];
      const modal = document.getElementById('modalTurno');
      const contenido = document.getElementById('modalContenido');

      contenido.innerHTML = `
        <h3 style="margin-bottom: 12px;">Detalle del Turno</h3>
        <p><strong>Día:</strong> ${datosSemanaActual[diaIdx].nombreDia} (${datosSemanaActual[diaIdx].fecha})</p>
        <p><strong>Pista:</strong> ${pista}</p>
        <p><strong>Hora:</strong> ${slot.hora}</p>
        <p><strong>Estado:</strong> ${slot.estado || 'Disponible'}</p>
        <p><strong>Cliente:</strong> ${slot.cliente || 'N/A'}</p>
        ${slot.monto ? `<p><strong>Monto:</strong> $${slot.monto}</p>` : ''}
      `;

      modal.style.display = 'flex';
    }

    function cerrarModal() {
      document.getElementById('modalTurno').style.display = 'none';
    }
  </script>
</body>

</html>
