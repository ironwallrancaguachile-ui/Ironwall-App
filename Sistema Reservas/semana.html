<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironwall - Vista Semanal</title>
  <style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-SemiBold.ttf");
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 1250px;
      margin: 0 auto;
    }

    /* --- CABECERA Y NAVEGACIÓN --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }

    .logo-btn {
      height: 36px;
      width: auto;
      object-fit: contain;
      transform: scale(1.8);
      transform-origin: center;
    }

    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* --- TARJETAS --- */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      border: 1px solid #e8ecef;
    }

    .titulo-card {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      letter-spacing: .5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* --- FORMULARIOS Y FILTROS --- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input,
    select {
      width: 100%;
      height: 41px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    /* --- BOTONES --- */
    button,
    .btn {
      width: 100%;
      height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-primary {
      background-color: #191919;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #333333;
    }

    .btn-consultar {
      background-color: #e0e0e0;
      color: #333333;
    }

    .btn-consultar:hover {
      background-color: #d0d0d0;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* --- ESTILOS DE LA VISTA SEMANAL --- */
    .grid-semana {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-top: 16px;
    }

    .dia-card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 8px;
      padding: 12px;
    }

    .dia-titulo {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 8px;
      border-bottom: 1px solid #dee2e6;
      padding-bottom: 4px;
      text-align: center;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }

      .card {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .grid-semana {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- NAVEGACIÓN Y CABECERA -->
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome">
        <img src="img/logosn.png" alt="Logo" class="logo-btn">
        <span>← Inicio</span>
      </a>
    </div>

    <h1>Ocupación Semanal</h1>
    <p class="subtitulo">Selecciona una fecha de inicio para consultar las reservas de la semana</p>

    <!-- CARD FILTRO DE FECHA -->
    <div class="card">
      <div class="titulo-card">Filtro de Consulta</div>
      
      <div class="form-grid">
        <div>
          <label for="fechaInicio">Fecha de inicio (Lunes)</label>
          <input type="date" id="fechaInicio">
        </div>
        <div>
          <button class="btn-primary" id="btnActualizar" onclick="cargarSemana()">Actualizar Vista</button>
        </div>
      </div>
    </div>

    <!-- CONTENEDOR VISTA SEMANAL -->
    <div class="card">
      <div class="titulo-card">Reservas de la Semana</div>
      <div id="contenedorSemana" class="grid-semana">
        <!-- Las columnas de cada día se cargan dinámicamente -->
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';

    // Establecer fecha por defecto (hoy) al cargar la página
    document.addEventListener('DOMContentLoaded', () => {
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('fechaInicio').value = hoy;
      cargarSemana();
    });

    async function api(body) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      return response.json();
    }

    async function cargarSemana() {
      const fecha = document.getElementById('fechaInicio').value;
      const btn = document.getElementById('btnActualizar');
      const contenedor = document.getElementById('contenedorSemana');

      if (!fecha) return;

      btn.disabled = true;
      btn.innerText = 'Cargando...';

      try {
        const respuesta = await api({ action: 'obtenerSemana', fechaInicio: fecha });
        
        // renderizar los días de la semana
        if (respuesta.ok && respuesta.dias) {
          contenedor.innerHTML = respuesta.dias.map(d => `
            <div class="dia-card">
              <div class="dia-titulo">${d.nombreDia} ${d.fecha}</div>
              <div class="dia-contenido">
                ${d.reservas ? d.reservas.map(r => `<div>${r.hora} -${r.cliente}</div>`).join('') : '<small>Sin reservas</small>'}
              </div>
            </div>
          `).join('');
        } else {
          contenedor.innerHTML = '<p>No se encontraron datos para la semana seleccionada.</p>';
        }
      } catch (error) {
        contenedor.innerHTML = '<p>Error de conexión al cargar la semana.</p>';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Actualizar Vista';
      }
    }
  </script>
</body>

</html>
