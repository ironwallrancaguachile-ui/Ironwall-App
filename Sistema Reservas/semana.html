<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironwall - Vista Semanal</title>
  <style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-SemiBold.ttf");
      font-weight: 600;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo';
      src: url("fonts/Archivo-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* --- CABECERA Y NAVEGACIÓN --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }

    .logo-btn {
      height: 36px;
      width: auto;
      object-fit: contain;
      transform: scale(1.8);
      transform-origin: center;
    }

    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .subtitulo {
      color: #666;
      font-size: 13px;
      margin-bottom: 20px;
    }

    /* --- TARJETAS DE DÍAS Y CONTENEDORES --- */
    .card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .04);
      border: 1px solid #e8ecef;
    }

    .titulo-card {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      letter-spacing: .5px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    /* --- FORMULARIOS --- */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      align-items: end;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }

    input, select {
      width: 100%;
      height: 41px;
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    /* --- BOTONES --- */
    button, .btn {
      width: 100%;
      height: 41px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s, opacity 0.2s;
    }

    .btn-primary {
      background-color: #191919;
      color: #ffffff;
    }

    .btn-primary:hover {
      background-color: #333333;
    }

    button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none !important;
    }

    button:active:not(:disabled) {
      transform: scale(0.99);
    }

    /* --- TARJETAS SEMANALES --- */
    .dia-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid #e8ecef;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .dia-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .dia-titulo {
      font-size: 16px;
      font-weight: 700;
      color: #111;
    }

    .dia-fecha {
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }

    .badge-ocupacion {
      background: #f3f4f6;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
    }

    .pistas-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
    }

    .pista-bloque {
      background: #f9fafb;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #f0f0f0;
    }

    .pista-nombre {
      font-size: 13px;
      font-weight: 700;
      color: #374151;
      margin-bottom: 8px;
    }

    .reserva-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px dashed #e5e7eb;
      font-size: 12px;
    }

    .reserva-item:last-child {
      border-bottom: none;
    }

    .reserva-hora {
      font-weight: 700;
      color: #111827;
    }

    .reserva-cliente {
      color: #4b5563;
    }

    .sin-reservas {
      font-size: 12px;
      color: #9ca3af;
      font-style: italic;
    }

    /* --- RESPONSIVE --- */
    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }

      .card {
        padding: 16px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- NAVEGACIÓN Y CABECERA -->
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome">
        <img src="img/logosn.png" alt="Logo" class="logo-btn">
        <span>← Inicio</span>
      </a>
    </div>

    <h1>Ocupación Semanal</h1>
    <p class="subtitulo">Selecciona la fecha para consultar la ocupación de la semana</p>

    <!-- FILTRO DE FECHA Y BOTÓN ACTUALIZAR -->
    <div class="card">
      <div class="titulo-card">Filtro de Consulta</div>
      <div class="form-grid">
        <div>
          <label for="fechaBase">Fecha de referencia</label>
          <input type="date" id="fechaBase">
        </div>
        <div>
          <button class="btn-primary" id="btnActualizar" onclick="cargarSemana()">Actualizar</button>
        </div>
      </div>
    </div>

    <!-- CONTENEDOR VISTA SEMANAL -->
    <div id="contenedorSemana"></div>
  </div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';

    document.addEventListener('DOMContentLoaded', () => {
      const hoy = new Date().toISOString().split('T')[0];
      document.getElementById('fechaBase').value = hoy;
      cargarSemana();
    });

    async function api(body) {
      const response = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body)
      });
      return response.json();
    }

    async function cargarSemana() {
      const fecha = document.getElementById('fechaBase').value;
      const btn = document.getElementById('btnActualizar');
      const contenedor = document.getElementById('contenedorSemana');

      if (!fecha) return;

      btn.disabled = true;
      btn.innerText = 'Cargando...';

      try {
        const respuesta = await api({ action: 'obtenerSemana', fecha });
        
        if (respuesta.ok && respuesta.dias) {
          contenedor.innerHTML = respuesta.dias.map(d => `
            <div class="dia-card">
              <div class="dia-header">
                <div>
                  <span class="dia-titulo">${d.nombreDia || ''}</span>
                  <span class="dia-fecha">${d.fecha || ''}</span>
                </div>
                <span class="badge-ocupacion">${d.totalReservas || 0} reservas</span>
              </div>
              <div class="pistas-grid">
                ${d.pistas ? Object.keys(d.pistas).map(pista => `
                  <div class="pista-bloque">
                    <div class="pista-nombre">${pista}</div>${d.pistas[pista].length > 0 ? d.pistas[pista].map(r => `
                      <div class="reserva-item">
                        <span class="reserva-hora">${r.hora || ''}</span>
                        <span class="reserva-cliente">${r.cliente || 'Reservado'}</span>
                      </div>
                    `).join('') : '<div class="sin-reservas">Sin reservas</div>'}
                  </div>
                `).join('') : '<div class="sin-reservas">No hay información de pistas</div>'}
              </div>
            </div>
          `).join('');
        } else {
          contenedor.innerHTML = '<div class="card"><p style="color:#666;">No se encontraron datos para la semana seleccionada.</p></div>';
        }
      } catch (error) {
        contenedor.innerHTML = '<div class="card"><p style="color:#dc2626;">Error de conexión con el servidor.</p></div>';
      } finally {
        btn.disabled = false;
        btn.innerText = 'Actualizar';
      }
    }
  </script>
</body>

</html>
