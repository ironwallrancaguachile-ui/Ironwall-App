<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ironwall - Semana</title>
  <style>
    /* --- FUENTES DEL SISTEMA --- */
    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Regular.ttf");
      font-weight: 400;
      font-display: swap;
    }

    @font-face {
      font-family: 'Archivo Extra Condensed';
      src: url("fonts/Archivo_ExtraCondensed-Bold.ttf");
      font-weight: 700;
      font-display: swap;
    }

    @font-face {
      font-family: Boris;
      src: url("fonts/BorisBlackBloxx.ttf");
      font-weight: 400;
      font-display: swap;
    }

    /* --- RESET Y ESTILOS BASE --- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Archivo', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      background: linear-gradient(180deg, #eef2f7 0%, #f8f9fb 100%);
      color: #222;
      padding: 24px 20px 60px;
      min-height: 100vh;
      max-width: 1250px;
      margin: 0 auto;
    }

    .container {
      max-width: 1250px;
      margin: auto;
    }

    /* --- CABECERA Y NAVEGACIÓN --- */
    .barraNavegacion {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 auto 16px;
    }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
      border: 1px solid #e8ecef;
      transition: transform .2s, box-shadow .2s;
    }

    .logo-btn {
      height: 36px;
      width: auto;
      object-fit: contain;
      transform: scale(1.8);
      transform-origin: center;
    }

    .btnHome:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(0, 0, 0, .12);
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 0;
      color: #333;
      white-space: nowrap;
    }

    /* --- CAMPOS DE ENTRADA --- */
    input, select {
      font-size: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #222;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
    }

    /* --- CONTENEDOR SUPERIOR Y FILTROS COMPACTOS --- */
    .top {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid #e8ecef;
      margin-bottom: 20px;
      max-width: fit-content;
    }

    .filtro-grupo {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top input[type="date"] {
      width: 150px;
      height: 36px;
      padding: 6px 10px;
    }

    /* --- BOTONES --- */
    button, .btn-secondary {
      width: auto;
      height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-secondary {
      background-color: #e0e0e0;
      color: #333333;
    }

    .btn-secondary:hover {
      background-color: #d0d0d0;
    }

    .btn-secondary:active {
      transform: scale(0.99);
    }

    /* --- ESTRUCTURA DE LA SEMANA EN COLUMNAS --- */
    .semana {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      align-items: start;
    }

    /* Tarjeta individual para cada día */
    .dia {
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid #e8ecef;
      min-height: 200px;
    }

    .dia h3 {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 4px;
      color: #333;
    }

    .dia small {
      color: #888;
      display: block;
      margin-bottom: 10px;
    }

    .dia hr {
      border: 0;
      border-top: 1px solid #eee;
      margin: 8px 0;
    }

    .numero {
      font-weight: 700;
      float: right;
    }

    /* --- RESUMEN COMPACTO CORREGIDO --- */
    .resumen-metrica {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-top: 8px;
      background: #f8f9fa;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid #edf0f2;
      width: 100%;
      box-sizing: border-box;
    }

    .metrica-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #555;
    }

    .metrica-item strong {
      font-size: 11px;
      color: #111;
      font-weight: 700;
    }

    /* Bloque/ítem de cada reserva dentro del día */
    .reserva {
      background: #f9f9f9;
      border-left: 3px solid #222;
      padding: 8px 10px;
      border-radius: 6px;
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.4;
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      body {
        padding: 16px 12px 40px;
      }
      .top {
        max-width: 100%;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- NAVEGACIÓN CON LOGO E INICIO -->
    <div class="barraNavegacion">
      <a href="index.html" class="btnHome">
        <img src="img/logosn.png" alt="Logo" class="logo-btn">
        <span>← Inicio</span>
      </a>
    </div>

    <h1>Reservas de la Semana</h1>

    <!-- FILTROS COMPACTOS EN UNA LÍNEA HORIZONTAL -->
    <div class="top">
      <div class="filtro-grupo">
        <label for="fechaInicio">Fecha:</label>
        <input id="fechaInicio" type="date">
      </div>
      <button class="btn-secondary" onclick="cargarSemana()">Actualizar</button>
    </div>

    <div id="semana" class="semana"></div>
  </div>

  <script>
    const API_URL =
      'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec';

    function fechaHoy() {
      const d = new Date();
      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, '0'),
        String(d.getDate()).padStart(2, '0')
      ].join('-');
    }

    document.getElementById('fechaInicio').value = fechaHoy();

    async function api(body) {
      const response = await fetch(
        API_URL,
        {
          method: 'POST',
          body: JSON.stringify(body)
        }
      );
      return response.json();
    }

    async function cargarSemana() {
      const btn = document.querySelector('.btn-secondary');
      const textoOriginal = btn ? btn.innerText : 'Actualizar';

      if (btn) {
        btn.innerText = 'Consultando...';
        btn.disabled = true;
        btn.style.opacity = '0.7';
        btn.style.cursor = 'not-allowed';
      }

      const fechaInicio = document.getElementById('fechaInicio').value;

      try {
        const resultado = await api({ action: 'resumenSemana', fechaInicio });

        if (!resultado.ok) {
          alert(resultado.mensaje || 'Error al obtener datos');
          return;
        }

        pintarSemana(resultado.semana);

        if (btn) {
          btn.innerText = '¡Actualizado!';
          btn.style.backgroundColor = '#dcfce7'; // Verde suave
          btn.style.color = '#15803d';
        }

      } catch (error) {
        alert('Error de conexión al cargar la semana');
      } finally {
        if (btn) {
          setTimeout(() => {
            btn.innerText = textoOriginal;
            btn.disabled = false;
            btn.style.backgroundColor = '#e0e0e0';
            btn.style.color = '#333333';
            btn.style.opacity = '1';
            btn.style.cursor = 'pointer';
          }, 1500);
        }
      }
    }

    function pintarSemana(dias) {
      const contenedor = document.getElementById('semana');
      contenedor.innerHTML = '';

      dias.forEach(dia => {
        const div = document.createElement('div');
        div.className = 'dia';

        const fecha = new Date(dia.fecha + 'T12:00:00');
        const nombre = fecha.toLocaleDateString('es-CL', { weekday: 'long' });

        div.innerHTML = `
          <h3>${capitalizar(nombre)}</h3>
          <small>${dia.fecha}</small>
          
          <!-- Resumen compacto -->
          <div class="resumen-metrica">
            <div class="metrica-item">
              <span>Capacidad</span>
              <strong>${dia.capacidad}</strong>
            </div>
            <div class="metrica-item">
              <span>Reservados</span>
              <strong>${dia.reservado}</strong>
            </div>
            <div class="metrica-item">
              <span>Disponibles</span>
              <strong>${dia.disponibles}</strong>
            </div>
            <div class="metrica-item">
              <span>Clases</span>
              <strong>${dia.clases.length}</strong>
            </div>
          </div>
          <hr style="margin-top: 10px;">
        `;

        dia.reservas
          .sort((a, b) => a.HoraInicio.localeCompare(b.HoraInicio))
          .forEach(reserva => {
            const bloque = document.createElement('div');
            bloque.className = 'reserva';
            bloque.innerHTML = `
              <strong>${reserva.HoraInicio}</strong> <br>
              ${reserva.ClienteID} <br>
              ${reserva.Cantidad} personas <br>
              ${reserva.Estado}
            `;
            div.appendChild(bloque);
          });

        contenedor.appendChild(div);
      });
    }

    function capitalizar(texto) {
      return (
        texto.charAt(0).toUpperCase() + texto.slice(1)
      );
    }

    cargarSemana();
  </script>

</body>

</html>
