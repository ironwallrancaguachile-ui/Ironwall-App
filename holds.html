<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holds & Maintenance - Ironwall</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px 16px 60px; background: #fafafa; color: #222; }
  h1 { font-size: 22px; margin-bottom: 1px; }
  p.sub { color: #666; margin-top: 0; margin-bottom: 10px; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
  input, select { width: 100%; padding: 12px; font-size: 14px; border: 1px solid #ccc; border-radius: 8px; background: #fff; margin-bottom:-14px;}
  .tipo-botones { display: flex; gap: 8px; margin-top: 6px; }
  .tipo-botones button { flex: 1; padding: 12px; border: 2px solid #ccc; border-radius: 8px; background: #fff; font-size: 13px; font-weight: 500; cursor: pointer; }
  .tipo-botones button.activo-entrada { border-color: #1e824c; background: #e8f6ee; color: #1e824c; }
  .tipo-botones button.activo-ajuste { border-color: #b8860b; background: #fff8e6; color: #b8860b; }
  .tipo-botones button.activo-salida { border-color: #c0392b; background: #fdf2f2; color: #c0392b; }

  #stockInfo { font-size: 12px; color: #666; margin-top: 14px; display: none; }
  #stockInfo.bajo { color: #c0392b; font-weight: 600; }
  button.enviar { width: 100%; margin-top: 24px; padding: 14px; font-size: 15px; font-weight: 600; color: #fff; background: #1a1a1a; border: none; border-radius: 8px; cursor: pointer; }
  button.enviar:disabled { opacity: 0.5; }
  #error { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; }
  #ok { color: #1e824c; font-size: 13px; margin-top: 10px; display: none; font-weight: 600; }

  .btnHome{ display:inline-flex; align-items:center; gap:8px; background:#ffffff; color:#222; text-decoration:none; padding:10px 18px; border-radius:12px; font-size:15px; font-weight:600; box-shadow:0 3px 12px rgba(0,0,0,.12); transition:.2s; }
  .btnHome:hover{ transform:translateY(-2px); box-shadow:0 8px 18px rgba(0,0,0,.15); }
   /* Contenedor principal ultra compacto */
  .resumen-stock { background: #fff8f8; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; transition: background 0.3s, border-color 0.3s;}

  /* Estado cuando todo está correcto */
  .resumen-stock.ok { background: #f0fdf4; border-color: #bbf7d0;}
  .resumen-header { font-size: 12px; font-weight: 700; color: #991b1b; margin-bottom: 6px;}
  .resumen-stock.ok .resumen-header {color: #166534;}
  .resumen-lista { display: flex; flex-wrap: wrap; gap: 6px;}

  /* Cápsula (Chip) de Producto */
  .chip-stock { display: inline-flex; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #fca5a5; border-radius: 16px; padding: 2px 8px; font-size: 12px;}
  .chip-nombre { color: #374151; font-weight: 500;}
  .chip-cantidad {  background: #ef4444; color: #ffffff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 10px;}
  .texto-cargando { font-size: 12px; color: #6b7280;}
 
   /* Banner Proveedores Minimalista */
  .resumen-proveedores { background: #f0f4f8; border: 1px solid #d0dbe5; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px;}
  .chip-proveedor { display: inline-flex; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 16px; padding: 2px 8px; font-size: 12px;}
  .chip-prov-nombre { color: #1e293b; font-weight: 600;}
  .chip-prov-cantidad { background: #2563eb; color: #ffffff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 10px;}
 
   /* CONTENEDOR GRID DE 2 COLUMNAS */
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 16px; align-items: start; }
 
  /* ELEMENTOS QUE OCUPAN 2 COLUMNAS SIEMPRE */
  .full-width { grid-column: span 2; }
  .form-group { display: flex; flex-direction: column; }
 
  /* Adaptabilidad Móvil */
   @media (max-width: 480px) {.form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
     .col-span-2 { grid-column: span 1; } }  
</style>
</head>
 
<body>
  <a href="hubInventario.html" class="btnHome">
  ⬅️ Volver
  </a>

  <h1>🛠️🧗 Gestión de Equipamiento y Presas</h1>
  <p class="sub">Ingreso de equipo ya sea herramientas, presas u otro articulo de mantenimiento.</p>

  <!-- Contenedor Resumen por Proveedor Minimalista -->
  <div id="resumenProveedores" class="resumen-proveedores">
    <div class="resumen-header" style="color: #1e293b; margin-bottom: 6px;">
      🧗‍♂️ Stock por Marca / Proveedor
    </div>
    <div id="listaProveedores" class="resumen-lista">
      <span class="texto-cargando">Cargando resumen...</span>
    </div>
  </div>
  
  <!-- Banner Minimalista de Alerta / Estado -->
  <div id="resumenStockBajo" class="resumen-stock">
    <div class="resumen-header">
      <span id="resumenTitulo">⚠️ Productos bajo stock mínimo</span>
    </div>
    <div id="listaStockBajo" class="resumen-lista">
      <span class="texto-cargando">Cargando productos...</span>
    </div>
  </div>
 
   <label>¿Qué pasó? *</label>
   <div class="tipo-botones">
    <button type="button" id="btnEntrada" onclick="elegirTipo('Entrada')">Ingreso (compra)</button>
    <button type="button" id="btnSalida" onclick="elegirTipo('Salida')">Baja / Descarte</button>
    <button type="button" id="btnAjuste" onclick="elegirTipo('Ajuste')">Corregir conteo</button>
   </div>
 
  <div class="form-grid">
    <!-- FILA 1: producto | cantidad -->
    <div class="form-group">
       <label>Producto *</label>
       <select id="producto" onchange="mostrarStock()" style="width: fit-content; max-width: 100%;">
         <option value="">-- Selecciona --</option>
       </select>
       <div id="stockInfo"></div>
    </div>
    <div class="form-group">
       <label id="labelCantidad">Cantidad *</label>
       <!--<input type="text" id="cantidad" inputmode="numeric" placeholder="1" oninput="soloNumeros(this)">-->
       <input id="cantidad" type="number" min="1" step="1" value="1" style="text-align: left;"> 
    </div> 
   
    <!-- FILA 2: motivo | Medio de pago -->
    <div class="form-group">
       <label>Motivo *</label>
       <select id="motivo" onchange="mostrarMedioPagoSiCompra()">
         <option value="">-- Primero elige el tipo --</option>
       </select>
    </div>
    <div class="form-group">    
     <div id="bloqueMedioPago" style="display:none">
       <label id="labelMedioPago">Medio de pago (compra) *</label>
       <select id="medioPagoVenta">
         <option value="Mercado Pago">Mercado Pago</option>
         <option value="Transferencia">Transferencia</option>
         <option value="Efectivo">Efectivo</option>
       </select>
     </div>
    </div>
   
    <!-- FILA 3: Categoria | Medio de pago -->
    <div class="full-width">
       <label>Notas</label>
       <input type="text" id="notas" placeholder="Opcional">
    </div>
    <div class="form-group">
       <label>Registrado por *</label>
       <select id="responsable" style="width: fit-content; max-width: 100%;">
         <option value="">-- Selecciona tu nombre --</option>
       </select>
    </div> 
   <div class="form-group">
    <button class="enviar" id="btnEnviar" onclick="enviar()">Registrar movimiento</button>
    <div id="error"></div>
    <div id="ok"></div>
   </div> 
<script>
  const API_URL_INVENTARIO = 'https://script.google.com/macros/s/AKfycbxZyZAGtj2ifZ9lmhwX__tTVdydaYManjO2_Ff_ScIYtV5vpsFkQHzzKaX7ADcVXOysSw/exec';
  const API_URL_CLIENTES = 'https://script.google.com/macros/s/AKfycbx7SvOi2JmjpRtLACJNVvzFtWKKeo9wUitjriZjW-JgNqPeFVliydyVy3NuNT6yiOcRbQ/exec';
  const API_URL_FINANZAS = 'https://script.google.com/macros/s/AKfycbx29m90hiJKT3UKP2uJCJSm5XcEfjWwCcMYokLnw54RBTpyGLierukwYNYdCJxCiEaKng/exec';

  const MOTIVOS_ENTRADA = ['Compra a proveedor', 'Devolución de cliente', 'Ajuste de inventario'];

  let tipoSeleccionado = '';
  let productosCache = [];

  function soloNumeros(input) {
    input.value = input.value.replace(/\D/g, '');
  }

  function fetchConReintento(url, opciones, soloUnIntento) {
    const TIEMPO_ESPERA_MS = soloUnIntento ? 20000 : 15000;
    const intentos = soloUnIntento ? 1 : 2;

    function intentar(intentosRestantes) {
      const controlador = new AbortController();
      const timeoutId = setTimeout(function () { controlador.abort(); }, TIEMPO_ESPERA_MS);

      return fetch(url, Object.assign({}, opciones, { signal: controlador.signal }))
        .then(function (r) { clearTimeout(timeoutId); return r; })
        .catch(function (err) {
          clearTimeout(timeoutId);
          if (intentosRestantes > 1) return intentar(intentosRestantes - 1);
          if (soloUnIntento) {
            throw new Error('No pudimos confirmar si el movimiento se registró. Revisa el stock antes de repetirlo, para evitar duplicarlo.');
          }
          throw new Error('El servidor está tardando en responder. Intenta de nuevo en unos segundos.');
        });
    }
    return intentar(intentos);
  }

  function llamarApi(url, accion, payload, esEscritura) {
    return fetchConReintento(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: accion, payload: payload })
    }, esEscritura).then(function (r) {
      return r.text().then(function (texto) {
        try { return JSON.parse(texto); }
        catch (e) { throw new Error('El servidor tardó en responder. Intenta de nuevo.'); }
      });
    });
  }

  function elegirTipo(tipo) {
    tipoSeleccionado = tipo;
    document.getElementById('btnEntrada').className = tipo === 'Entrada' ? 'activo-entrada' : '';
    document.getElementById('btnSalida').className = tipo === 'Salida' ? 'activo-salida' : '';
    document.getElementById('btnAjuste').className = tipo === 'Ajuste' ? 'activo-ajuste' : '';

    const selectMotivo = document.getElementById('motivo');
    const labelCantidad = document.getElementById('labelCantidad');
    let opciones = [];
    let motivoPorDefecto = '';

    if (tipo === 'Entrada') {
      opciones = ['Compra a proveedor', 'Ajuste de inventario'];
      labelCantidad.textContent = 'Cantidad que ingresa *';
      motivoPorDefecto = 'Compra a proveedor';
    }
    if (tipo === 'Salida') {
      opciones = ['Daño / Rotura (Descarte)', 'Pérdida / Extravío', 'Retiro por Seguridad'];
      labelCantidad.textContent = 'Cantidad a dar de baja *';
      motivoPorDefecto = 'Daño / Rotura (Descarte)';
    }
    if (tipo === 'Ajuste') {
      opciones = ['Conteo físico / corrección'];
      labelCantidad.textContent = 'Stock real (reemplaza el actual) *';
      motivoPorDefecto = 'Conteo físico / corrección';
    }

    selectMotivo.innerHTML = '<option value="">-- Selecciona --</option>' +
      opciones.map(function (m) { return '<option value="' + m + '">' + m + '</option>'; }).join('');
    selectMotivo.value = motivoPorDefecto;

    mostrarMedioPagoSiCompra();
  }

  function pintarProductos() {
    const select = document.getElementById('producto');
    const valorPrevio = select.value;

    select.innerHTML = '<option value="">-- Selecciona --</option>' +
      productosCache.map(function (p) {
        const proveedorTexto = p.proveedor ? ' — ' + p.proveedor : '';
        return '<option value="' + p.codigo + '">' + p.nombre + proveedorTexto + ' (stock: ' + p.stockActual + ')</option>';
      }).join('');

    if (valorPrevio) select.value = valorPrevio;

    generarResumenProveedores_();
    generarResumenStockBajo_();
    mostrarStock();
  }

   function generarResumenProveedores_() {
     const contenedor = document.getElementById('listaProveedores');
     if (!productosCache || productosCache.length === 0) {
       contenedor.innerHTML = '<span class="texto-cargando">Sin registros</span>';
       return;
     }
   
     // Agrupar conteo de stock por proveedor
     const conteo = {};
     productosCache.forEach(function (p) {
       const prov = p.proveedor || 'Sin Marca';
       conteo[prov] = (conteo[prov] || 0) + Number(p.stockActual || 0);
     });
   
     // Renderizar como cápsulas / chips minimalistas
     contenedor.innerHTML = Object.keys(conteo).map(function (prov) {
       return `
         <div class="chip-proveedor">
           <span class="chip-prov-nombre">${prov}</span>
           <span class="chip-prov-cantidad">${conteo[prov]} u</span>
         </div>
       `;
     }).join('');
   }

  /* 🟢 FUNCIÓN ACTUALIZADA AL DISEÑO MINIMALISTA */
  function generarResumenStockBajo_() {
    const contenedor = document.getElementById('listaStockBajo');
    const banner = document.getElementById('resumenStockBajo');
    const titulo = document.getElementById('resumenTitulo');

    if (!productosCache || productosCache.length === 0) {
      contenedor.innerHTML = '<span class="texto-cargando">Sin registros de stock</span>';
      return;
    }

    const bajos = productosCache.filter(function (p) {
      return Number(p.stockActual) <= Number(p.stockMinimo);
    });

    if (bajos.length === 0) {
      banner.classList.add('ok');
      titulo.textContent = '✅ Todo el equipamiento tiene stock suficiente';
      contenedor.innerHTML = '';
      return;
    }

    banner.classList.remove('ok');
    titulo.textContent = '⚠️ Productos bajo stock mínimo';

    contenedor.innerHTML = bajos.map(function (p) {
      return `
        <div class="chip-stock">
          <span class="chip-nombre">${p.nombre}</span>
          <span class="chip-cantidad">${p.stockActual} u</span>
        </div>
      `;
    }).join('');
  }

  function mostrarStock() {
    const select = document.getElementById('producto');
    const codigo = select.value;
    const info = document.getElementById('stockInfo');

    if (!codigo) { 
      info.style.display = 'none'; 
      return; 
    }

    const producto = productosCache.find(function (p) { return p.codigo === codigo; });
    
    if (!producto) { 
      info.style.display = 'none'; 
      return; 
    }

    info.style.display = 'block';
    info.textContent = 'Stock actual: ' + producto.stockActual + 
      (producto.stockMinimo ? ' (mínimo recomendado: ' + producto.stockMinimo + ')' : '');
    
    info.className = Number(producto.stockActual) <= Number(producto.stockMinimo) ? 'bajo' : '';
  }

  /* 🟢 ADAPTADO PARA RECARGA FORZADA */
  function cargarProductos(forzarServidor) {
    if (!forzarServidor) {
      const cache = leerCache_('productos_equipamiento_cache');
      if (cache) { 
        productosCache = cache; 
        pintarProductos(); 
      }
    }

    llamarApi(API_URL_INVENTARIO, 'listarEquipamientoInterno', {})
      .then(function (resp) {
        if (resp.ok) {
          productosCache = resp.data;
          guardarCache_('productos_equipamiento_cache', resp.data);
          pintarProductos();
        }
      })
      .catch(function () {});
  }

  function cargarStaff() {
    const select = document.getElementById('responsable');
    function pintar(nombres) {
      const valorPrevio = select.value;
      select.innerHTML = '<option value="">-- Selecciona tu nombre --</option>' +
        nombres.map(function (n) { return '<option value="' + n + '">' + n + '</option>'; }).join('');
      if (valorPrevio && nombres.indexOf(valorPrevio) !== -1) select.value = valorPrevio;
    }
    const cache = leerCache_('staff_inventario_cache');
    if (cache) pintar(cache);

    llamarApi(API_URL_CLIENTES, 'listarStaff', {})
      .then(function (resp) {
        if (resp.ok && resp.data) {
          pintar(resp.data);
          guardarCache_('staff_inventario_cache', resp.data);
        }
      })
      .catch(function () {});
  }

  function guardarCache_(clave, datos) {
    try { localStorage.setItem(clave, JSON.stringify({ datos: datos, guardado: Date.now() })); }
    catch (e) {}
  }
  
  function leerCache_(clave) {
    try {
      const crudo = localStorage.getItem(clave);
      if (!crudo) return null;
      const parsed = JSON.parse(crudo);
      const DOCE_HORAS_MS = 12 * 60 * 60 * 1000;
      if (Date.now() - parsed.guardado > DOCE_HORAS_MS) return null;
      return parsed.datos;
    } catch (e) { return null; }
  }

  function mostrarMedioPagoSiCompra() {
    const motivo = document.getElementById('motivo').value;
    const esCompra = tipoSeleccionado === 'Entrada' && motivo === 'Compra a proveedor';
    document.getElementById('bloqueMedioPago').style.display = esCompra ? 'block' : 'none';
  }

  function enviar() {
    const btn = document.getElementById('btnEnviar');
    const errorDiv = document.getElementById('error');
    const okDiv = document.getElementById('ok');
    errorDiv.style.display = 'none';
    okDiv.style.display = 'none';

    const codigoProducto = document.getElementById('producto').value;
    const cantidad = document.getElementById('cantidad').value.trim();
    const motivo = document.getElementById('motivo').value;
    const responsable = document.getElementById('responsable').value;

    if (!tipoSeleccionado) { mostrarError('Elige el tipo de movimiento.'); return; }
    if (!codigoProducto) { mostrarError('Elige un producto.'); return; }
    if (!cantidad || Number(cantidad) <= 0) { mostrarError('Ingresa una cantidad válida.'); return; }
    if (!motivo) { mostrarError('Elige un motivo.'); return; }
    if (!responsable) { mostrarError('Elige quién registra el movimiento.'); return; }

    const esCompra = tipoSeleccionado === 'Entrada' && motivo === 'Compra a proveedor';
    const medioPago = esCompra ? document.getElementById('medioPagoVenta').value : '';

    const datos = {
      tipo: tipoSeleccionado,
      codigoProducto: codigoProducto,
      cantidad: Number(cantidad),
      motivo: motivo,
      responsable: responsable,
      notas: document.getElementById('notas').value.trim()
    };

    btn.disabled = true;
    btn.textContent = 'Registrando...';
    const avisoLento = setTimeout(function () { btn.textContent = 'Esto puede tardar unos segundos más...'; }, 5000);

    llamarApi(API_URL_INVENTARIO, 'registrarMovimientoInventario', datos, true)
      .then(function (resp) {
        clearTimeout(avisoLento);
        if (!resp.ok) throw new Error(resp.error || 'Error desconocido');

        let mensaje = '✅ Movimiento registrado. Nuevo stock: ' + resp.data.stockNuevo;

        if (esCompra && resp.data.costoUnitario > 0 && resp.data.categoriaCompraFinanzas) {
          const montoTotal = resp.data.costoUnitario * Number(cantidad);
          return registrarMovimientoFinanzasAutomatico_('Egreso', resp.data.categoriaCompraFinanzas, montoTotal, medioPago, resp.data.nombreProducto, cantidad, responsable)
            .then(function (okFinanzas) {
              mensaje += okFinanzas
                ? ' Egreso registrado en Finanzas.'
                : ' (No se pudo registrar el egreso en Finanzas automático — regístralo manual en movimientos.html)';
              mostrarExito_(mensaje);
            });
        }

        mostrarExito_(mensaje);
      })
      .catch(function (err) {
        clearTimeout(avisoLento);
        mostrarError(err.message);
      })
      .finally(function () {
        btn.disabled = false;
        btn.textContent = 'Registrar movimiento';
      });
  }

  /* 🟢 LIMPIEZA COMPLETA AL REGISTRAR EXITO */
  function mostrarExito_(mensaje) {
    const okDiv = document.getElementById('ok');
    okDiv.textContent = mensaje;
    okDiv.style.display = 'block';

    // Resetear inputs y selecciones
    document.getElementById('cantidad').value = '1';
    document.getElementById('notas').value = '';
    document.getElementById('producto').value = '';
    document.getElementById('motivo').value = '';
    document.getElementById('responsable').value = '';

    // Resetear botones de tipo de movimiento
    tipoSeleccionado = '';
    document.getElementById('btnEntrada').className = '';
    document.getElementById('btnSalida').className = '';
    document.getElementById('btnAjuste').className = '';

    // Ocultar info secundaria
    document.getElementById('stockInfo').style.display = 'none';
    if (document.getElementById('bloqueMedioPago')) {
      document.getElementById('bloqueMedioPago').style.display = 'none';
    }

    // Refrescar stock desde el servidor
    cargarProductos(true);
  }

  function registrarMovimientoFinanzasAutomatico_(tipo, categoria, montoTotal, medioPago, nombreProducto, cantidad, responsable) {
    const datosMovimiento = {
      tipo: tipo,
      categoria: categoria,
      medioPago: medioPago,
      monto: montoTotal,
      descripcion: nombreProducto + ' x' + cantidad,
      comprobante: '',
      responsable: responsable
    };

    return fetch(API_URL_FINANZAS, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'registrarMovimiento', payload: datosMovimiento })
    }).then(function (r) { return r.text(); })
      .then(function (texto) {
        try {
          const resp = JSON.parse(texto);
          return !!resp.ok;
        } catch (e) {
          return false;
        }
      })
      .catch(function () { return false; });
  }

  function mostrarError(msg) {
    const errorDiv = document.getElementById('error');
    errorDiv.textContent = msg;
    errorDiv.style.display = 'block';
  }

  cargarProductos();
  cargarStaff();
</script>
</body>
</html>
