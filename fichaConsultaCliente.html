<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ficha del cliente - Ironwall</title>
<style>
  * { box-sizing: border-box; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 16px 60px;
    background: #f4f4f6;
    color: #1a1a1a;
  }

  /* BOTÓN HOME Y CABECERA ORIGINALES */
  .btnHome {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    color: #222;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
    transition: all .2s ease;
  }
  
  .btnHome:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(0,0,0,.12);
  }

  h1 { font-size: 24px; margin: 20px 0 4px; font-weight: 700; }
  p.sub { color: #666; margin-top: 0; margin-bottom: 20px; font-size: 14px; }

  /* BUSCADOR MINIMALISTA */
  .buscador { 
    display: flex; 
    gap: 10px; 
    margin-bottom: 24px; 
  }

  .buscador input {
    flex: 1;
    padding: 14px 16px;
    font-size: 15px;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    background: #fff;
    outline: none;
    transition: border-color 0.2s;
  }

  .buscador input:focus {
    border-color: #000;
  }

  .buscador button {
    padding: 14px 20px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }

  .buscador button:hover {
    opacity: 0.9;
  }

  /* DISPOSICIÓN EN 2 TARJETAS POR FILA (GRID) */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }

  /* TARJETAS / SECCIONES */
  .seccion {
    background: #fff;
    border: 1px solid rgba(0,0,0,0.06);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.02);
    display: flex;
    flex-direction: column;
  }

  .seccion h2 { 
    font-size: 15px; 
    margin: 0 0 12px; 
    font-weight: 600;
    color: #111;
    border-bottom: 1px solid #f0f0f2;
    padding-bottom: 8px;
  }

  .seccion p { margin: 4px 0; font-size: 14px; color: #444; }

  /* ITEMS INTERNOS */
  .item { 
    border-top: 1px dashed #e2e8f0; 
    padding-top: 10px; 
    margin-top: 10px; 
    font-size: 13px; 
    color: #333;
  }
  .item:first-child { border-top: none; padding-top: 0; margin-top: 0; }

  /* MENSAJES */
  #mensaje { font-size: 14px; margin-bottom: 16px; display: none; font-weight: 500; }
  #mensaje.error { color: #e53e3e; }
  #mensaje.ok { color: #38a169; }
  #sinDatos { font-size: 14px; color: #718096; padding: 12px 0; }

  /* RESPONSIVE PARA DISPOSITIVOS MÓVILES */
  @media (max-width: 600px) {
    .grid-container {
      grid-template-columns: 1fr;
    }
  }
</style>
</head>
<body>

  <a href="portalcliente.html" class="btnHome">
    🏠 Home
  </a>
 
  <h1>Ficha del cliente</h1>
  <p class="sub">Datos, pases y visitas.</p>

  <div class="buscador">
    <input type="text" id="idBuscar" placeholder="Código cliente, ejm: IRWXY1R5">
    <button onclick="buscar()">Buscar</button>
  </div>

  <div id="mensaje"></div>
  <div id="contenido"></div>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbz7SvOi2JmjpRtLACJNVvzFtWKKeo9wUitjriZjW-JgNqPeFVliydyVy3NuNT6yiOcRbQ/exec';

    let idClienteActual = '';
    let staffCache = [];

    function fetchConReintento(url, opciones, soloUnIntento) {
      const TIEMPO_ESPERA_MS = soloUnIntento ? 20000 : 15000;
      const intentos = soloUnIntento ? 1 : 2;
      function intentar(intentosRestantes) {
        const controlador = new AbortController();
        const timeoutId = setTimeout(function () { controlador.abort(); }, TIEMPO_ESPERA_MS);
        return fetch(url, Object.assign({}, opciones, { signal: controlador.signal }))
          .then(function (r) { clearTimeout(timeoutId); return r; })
          .catch(function (err) {
            clearTimeout(timeoutId);
            if (intentosRestantes > 1) return intentar(intentosRestantes - 1);
            if (soloUnIntento) throw new Error('No pudimos confirmar si se guardó. Intenta de nuevo.');
            throw new Error('El servidor está tardando en responder. Intenta de nuevo en unos segundos.');
          });
      }
      return intentar(intentos);
    }

    function llamarApi(accion, payload, esEscritura) {
      return fetchConReintento(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: accion, payload: payload })
      }, esEscritura).then(function (r) {
        return r.text().then(function (texto) {
          try { return JSON.parse(texto); }
          catch (e) { throw new Error('El servidor tardó en responder. Intenta de nuevo.'); }
        });
      });
    }

    function buscar() {
      const id = document.getElementById('idBuscar').value.trim();
      if (!id) return;
      idClienteActual = id;

      const mensaje = document.getElementById('mensaje');
      const contenido = document.getElementById('contenido');
      mensaje.style.display = 'none';
      contenido.innerHTML = '<p style="font-size:14px;color:#718096">Buscando...</p>';

      llamarApi('obtenerFichaCompleta', { idCliente: id })
        .then(function (resp) {
          if (!resp.ok) throw new Error(resp.error);
          if (!resp.data.cliente) {
            contenido.innerHTML = '<div id="sinDatos">Cliente no encontrado: ' + id + '</div>';
            return;
          }
          renderFicha(resp.data);
        })
        .catch(function (err) {
          mensaje.className = 'error';
          mensaje.textContent = 'Error: ' + err.message;
          mensaje.style.display = 'block';
          contenido.innerHTML = '';
        });
    }

    function renderFicha(data) {
      const c = data.cliente;
      let html = '<div class="grid-container">';
      
      // 1. DATOS CLIENTE
      html += `
      <div class="seccion">
        <h2>${c.nombre} ${c.apellido}</h2>
        <p style="color:#718096">Código: <strong>${c.idCliente}</strong></p>
      </div>
      `;
      
      // 2. PASES
      html += `
      <div class="seccion">
        <h2>Pases activos</h2>
      `;
      if (!data.pases || data.pases.length === 0) {
        html += `<p style="color:#a0aec0">No tienes pases activos.</p>`;
      } else {   
        data.pases.forEach(function(p){ 
          html += `
          <div class="item">
            <strong>${p.nombreServicio}</strong><br>
            Usos restantes: ${p.usosRestantes} de ${p.usosTotales}
            ${p.fechaVencimiento 
              ? '<br><span style="color:#718096">Vence: '+new Date(p.fechaVencimiento).toLocaleDateString()+'</span>'
              : ''}
          </div>
          `;
        }); 
      }      
      html += '</div>';
           
      // 3. RESUMEN VISITAS
      html += `
      <div class="seccion">
        <h2>Resumen de visitas</h2>
        <p>Total acumulado: <strong style="font-size:16px">${data.totalVisitas || 0}</strong> visitas</p>
      </div>
      `;

      // 4. ÚLTIMAS VISITAS
      html += `
      <div class="seccion">
        <h2>Últimas visitas</h2>
      `;
      if (!data.ultimasVisitas || data.ultimasVisitas.length === 0){
        html += `<p style="color:#a0aec0">Todavía no tienes visitas registradas.</p>`;
      } else {
        data.ultimasVisitas.forEach(function(v){ 
          html += `
          <div class="item">
            ${new Date(v).toLocaleString()}
          </div>
          `;  
        });  
      }            
      html += '</div>';

      html += '</div>'; // Cierre de grid-container
      
      document.getElementById('contenido').innerHTML = html;
    }
  </script>
</body>
</html>
