<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in Ironwall</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Arial, sans-serif;
    max-width: 580px;
    margin: 0 auto;
    padding: 20px 16px 60px;
    background: #fafafa;
    color: #222;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.sub { color: #666; margin-top: 0; font-size: 13px; }
  label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #555; margin: 8px 0 3px; }
  
  select, input {
    width: 100%;
    padding: 9px;
    font-size: 13px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #fff;
  }

  #reader { 
    width: 100%; 
    margin-top: 14px; 
    border-radius: 8px; 
    overflow: hidden; 
    border: 1px solid #e8e8e8;
    background: #fff;
  }

  .buscador { display: flex; gap: 8px; margin-top: 10px; }
  .buscador input {
    flex: 1;
    padding: 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 8px;
  }
  .buscador button {
    padding: 10px 16px;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  /* ================= GRID DE EXACTAMENTE 2 COLUMNAS ================= */
  #resultado {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
    align-items: start;
  }

  .card {
    background: #ffffff;
    border: 1px solid #e8e8e8;
    border-radius: 10px;
    padding: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.03);
    display: flex;
    flex-direction: column;
  }

  .card h3 { 
    font-size: 11px; 
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #777;
    margin: 0 0 8px; 
    font-weight: 700;
    border-bottom: 1px solid #f0f0f0;
    padding-bottom: 4px;
  }

  .card p { 
    margin: 2px 0; 
    font-size: 12px; 
    line-height: 1.3;
    color: #222;
  }

  .card button {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    background: #1e824c;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }

  .card button:disabled { opacity: 0.5; cursor: not-allowed; }

  .item-pase {
    background: #fafafa;
    border: 1px solid #ebebeb;
    border-radius: 6px;
    padding: 8px;
    margin-top: 6px;
  }

  .item { 
    border-top: 1px solid #f2f2f2; 
    padding-top: 4px; 
    margin-top: 4px; 
    font-size: 11px; 
  }
  .item:first-child { border-top: none; padding-top: 0; margin-top: 0; }

  /* Estilos Carrito de Pases */
  .carrito-box {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 6px 8px;
    margin-top: 6px;
  }
  .carrito-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    padding: 3px 0;
    border-bottom: 1px solid #f5f5f5;
  }
  .carrito-item:last-child { border-bottom: none; }
  .btn-eliminar-item {
    background: #fdecea !important;
    color: #c0392b !important;
    padding: 2px 5px !important;
    font-size: 10px !important;
    width: auto !important;
    margin-top: 0 !important;
  }

  #sinPases {
    background: #fdecea;
    border: 1px solid #f5c6c0;
    border-radius: 8px;
    padding: 10px;
    font-size: 12px;
    color: #c0392b;
    grid-column: 1 / -1;
  }

  #mensajeOk {
    background: #e8f6ee;
    border: 1px solid #b7e4c7;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    color: #1e824c;
    margin-top: 12px;
    display: none;
  }

  #nuevaLectura {
    width: 100%;
    margin-top: 14px;
    padding: 10px;
    background: #eee;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }

  .btnHome {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #ffffff;
    color: #222;
    text-decoration: none;
    padding: 10px 18px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 600;
    box-shadow: 0 3px 12px rgba(0,0,0,.12);
    transition: .2s;
  }
  
  .btnHome:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(0,0,0,.15);
  }
</style>
</head>
<body>
  <a href="portal.html" class="btnHome">
  🏠 Home
  </a>
 
  <h1>Check-in Ironwall</h1>
  <p class="sub">Escanea el código del cliente o ingrésalo manualmente.</p>

  <label>Validado por (tu nombre) *</label>
  <select id="staff">
    <option value="">-- Selecciona tu nombre --</option>
  </select>

  <div id="reader"></div>

  <div class="buscador">
    <input type="text" id="idManual" placeholder="Ej: IWR0001 o Juan Perez">
    <button onclick="buscarManual()">Buscar</button>
  </div>

  <div id="mensajeOk"></div>
  <div id="resultado"></div>
  <button id="nuevaLectura" style="display:none" onclick="reiniciar()">Escanear siguiente cliente</button>
<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbz7SvOi2JmjpRtLACJNVvzFtWKKeo9wUitjriZjW-JgNqPeFVliydyVy3NuNT6yiOcRbQ/exec';
  const API_URL_FINANZAS = 'https://script.google.com/macros/s/AKfycbx29m90hiJKT3UKP2uJCJSm5XcEfjWwCcMYokLnw54RBTpyGLierukwYNYdCJxCiEaKng/exec';

  let scanner = null;
  let escaneando = true;
  let serviciosCache = [];
  let carritoPases = [];

  function fetchConReintento(url, opciones, soloUnIntento) {
    const TIEMPO_ESPERA_MS = soloUnIntento ? 20000 : 15000;
    const intentos = soloUnIntento ? 1 : 2;

    function intentar(intentosRestantes) {
      const controlador = new AbortController();
      const timeoutId = setTimeout(() => controlador.abort(), TIEMPO_ESPERA_MS);

      return fetch(url, Object.assign({}, opciones, { signal: controlador.signal }))
        .then(r => { clearTimeout(timeoutId); return r; })
        .catch(err => {
          clearTimeout(timeoutId);
          if (intentosRestantes > 1) return intentar(intentosRestantes - 1);
          if (soloUnIntento) throw new Error('No pudimos confirmar la acción. Revisa el estado antes de reintentar.');
          throw new Error('El servidor está tardando en responder. Intenta de nuevo.');
        });
    }

    return intentar(intentos);
  }

  function llamarApi(accion, payload, esEscritura) {
    return fetchConReintento(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: accion, payload: payload })
    }, esEscritura).then(r => {
      return r.text().then(texto => {
        try { return JSON.parse(texto); }
        catch (e) { throw new Error('El servidor tardó en responder. Intenta de nuevo.'); }
      });
    });
  }

  function cargarCatalogo() {
    const cache = leerCache_('servicios_cache');
    if (cache) serviciosCache = cache;

    llamarApi('listarServicios', {})
      .then(resp => {
        if (resp.ok) {
          serviciosCache = resp.data;
          guardarCache_('servicios_cache', resp.data);
        }
      })
      .catch(() => { });
  }

  function cargarStaff() {
    const select = document.getElementById('staff');

    function pintarOpciones(nombres) {
      const valorPrevio = select.value;
      select.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
      nombres.forEach(nombre => {
        const opt = document.createElement('option');
        opt.value = nombre;
        opt.textContent = nombre;
        select.appendChild(opt);
      });
      if (valorPrevio && nombres.includes(valorPrevio)) {
        select.value = valorPrevio;
      }
    }

    const cache = leerCache_('staff_cache');
    if (cache) pintarOpciones(cache);

    llamarApi('listarStaff', {})
      .then(resp => {
        if (!resp.ok || !resp.data) return;
        pintarOpciones(resp.data);
        guardarCache_('staff_cache', resp.data);
      })
      .catch(() => { });
  }

  function guardarCache_(clave, datos) {
    try { localStorage.setItem(clave, JSON.stringify({ datos: datos, guardado: Date.now() })); }
    catch (e) { }
  }

  function leerCache_(clave) {
    try {
      const crudo = localStorage.getItem(clave);
      if (!crudo) return null;
      const parsed = JSON.parse(crudo);
      if (Date.now() - parsed.guardado > 12 * 60 * 60 * 1000) return null;
      return parsed.datos;
    } catch (e) { return null; }
  }

  function iniciarScanner() {
    scanner = new Html5Qrcode('reader');
    scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: 220 },
      idDecodificado => {
        if (!escaneando) return;
        escaneando = false;
        scanner.pause();
        procesarCliente(idDecodificado.trim());
      }
    ).catch(() => {
      document.getElementById('reader').innerHTML =
        '<p style="font-size:12px;color:#c0392b;padding:10px;margin:0;">No se pudo abrir la cámara. Usa la búsqueda manual.</p>';
    });
  }

  function buscarManual() {
    const termino = document.getElementById('idManual').value.trim();
    if (!termino) return;
    if (scanner && escaneando) {
      escaneando = false;
      try { scanner.pause(); } catch(e){}
    }
    procesarCliente(termino);
  }

  function procesarCliente(termino) {
    const staff = document.getElementById('staff').value.trim();

    if (!staff) {
      document.getElementById('resultado').style.display = 'grid';
      document.getElementById('resultado').innerHTML =
        '<div id="sinPases">Escribe tu nombre en "Validado por" antes de buscar un cliente.</div>';
      escaneando = true;
      if (scanner) scanner.resume();
      return;
    }

    document.getElementById('resultado').style.display = 'grid';
    document.getElementById('mensajeOk').style.display = 'none';
    document.getElementById('resultado').innerHTML = '<p style="font-size:13px;color:#888;grid-column:1/-1;">Buscando cliente...</p>';

    llamarApi('buscarClientesPorTexto', { termino: termino })
      .then(resp => {
        if (!resp.ok) throw new Error(resp.error || 'Error en la respuesta');
        const lista = resp.data || [];

        if (lista.length === 0) {
          document.getElementById('resultado').innerHTML =
            '<div id="sinPases">No se encontraron clientes para: "' + termino + '"</div>';
          return;
        }

        if (lista.length === 1) {
          cargarDetalleCheckin(lista[0].idCliente, staff);
        } else {
          renderResultadosMultiples(lista, staff);
        }
      })
      .catch(mostrarError);
  }

  function renderResultadosMultiples(lista, staff) {
    let html = '<div class="card" style="grid-column:1/-1;"><h3>Resultados encontrados (' + lista.length + ')</h3>';

    lista.forEach(c => {
      const nombreMostrar = (c.nombre + ' ' + c.apellido).trim() || 'Cliente sin nombre';
      html += '<div class="item" style="cursor:pointer; padding:6px 0;" onclick="cargarDetalleCheckin(\'' + c.idCliente + '\', \'' + staff.replace(/'/g, '') + '\')">'
        + '<strong>' + nombreMostrar + '</strong> · '
        + '<span style="color:#888; font-size:11px;">ID: ' + c.idCliente + '</span>'
        + '</div>';
    });

    html += '</div>';
    document.getElementById('resultado').innerHTML = html;
  }

  function cargarDetalleCheckin(idCliente, staff) {
    carritoPases = []; 
    llamarApi('buscarClienteYPases', { idCliente: idCliente })
      .then(resp => {
        if (!resp.ok) throw new Error(resp.error);
        const cliente = resp.data.cliente;
        if (!cliente) {
          document.getElementById('resultado').innerHTML =
            '<div id="sinPases">Cliente no encontrado: ' + idCliente + '</div>';
          return;
        }
        renderPases(cliente, resp.data.pases, resp.data.checkinsHoy, staff);
      })
      .catch(mostrarError);
  }

  function renderPases(cliente, pases, checkinsHoy, staff) {
    let html = '';

    /* ===== COLUMNA IZQUIERDA ===== */
    html += '<div class="card">'
      + '<h3>Cliente</h3>'
      + '<div style="font-size:14px; font-weight:700;">' + cliente.nombre + ' ' + cliente.apellido + '</div>'
      + '<p style="font-size:11px; color:#888; margin-bottom:8px;">ID: ' + cliente.idCliente + '</p>';

    html += '<label style="margin-top:6px;">Pases Activos</label>';
    if (!pases || pases.length === 0) {
      html += '<p style="font-size:11px; color:#c0392b; margin:4px 0;">Sin pases activos.</p>';
    } else {
      pases.forEach(p => {
        html += '<div class="item-pase">'
          + '<div style="font-weight:700; font-size:12px;">' + p.nombreServicio + '</div>'
          + '<p>Usos: <strong>' + p.usosRestantes + '</strong> / ' + p.usosTotales + '</p>'
          + (p.fechaVencimiento ? '<p style="color:#888; font-size:10px;">Vence: ' + new Date(p.fechaVencimiento).toLocaleDateString() + '</p>' : '')
          + '<button onclick="confirmar(\'' + cliente.idCliente + '\',\'' + p.idPase + '\',\'' + staff.replace(/'/g, '') + '\', this)">Confirmar ingreso</button>'
          + '</div>';
      });
    }

    if (checkinsHoy && checkinsHoy.length > 0) {
      html += '<div style="background:#fff8e6; border:1px solid #f39c12; border-radius:6px; padding:6px; margin-top:10px;">'
        + '<div style="font-size:10px; font-weight:700; color:#d35400; text-transform:uppercase;">Check-ins de Hoy</div>';
      checkinsHoy.forEach(c => {
        const hora = new Date(c.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        html += '<div class="item" style="display:flex; justify-content:space-between; align-items:center;">'
          + '<span>' + hora + '</span>'
          + '<button style="background:#c0392b; padding:2px 6px; font-size:10px; width:auto; margin-top:0;" '
          + 'onclick="anularCheckin(\'' + c.idCheckin + '\', \'' + cliente.idCliente + '\', \'' + staff.replace(/'/g, '') + '\', this)">Anular</button>'
          + '</div>';
      });
      html += '</div>';
    }

    html += '</div>';

    /* ===== COLUMNA DERECHA ===== */
    html += '<div class="card" style="background:#fcfcfc;">'
      + '<h3>🛒 Cargar Pases</h3>'
      + '<label>Servicio</label>'
      + '<select id="selectServicio">' + opcionesServicios() + '</select>'
      + '<label>Cantidad</label>'
      + '<input type="number" id="cantPases" value="1" min="1" style="text-align:center;">'
      + '<button style="background:#1565C0; margin-top:8px;" onclick="agregarAlCarritoPases()">+ Agregar al carrito</button>'
      + '<div id="boxCarritoPases"></div>'
      + '<label style="margin-top:8px;">Medio de Pago</label>'
      + '<select id="selectMedioPago">'
      + '<option value="Mercado Pago">Mercado Pago</option>'
      + '<option value="Transferencia">Transferencia</option>'
      + '<option value="Efectivo">Efectivo</option>'
      + '</select>'
      + '<button id="btnConfirmarPases" style="background:#1a1a1a; margin-top:8px;" disabled '
      + 'onclick="procesarCarritoPases(\'' + cliente.idCliente + '\', \'' + cliente.nombre + '\', \'' + cliente.apellido + '\', \'' + staff.replace(/'/g, '') + '\', this)">'
      + 'Confirmar compra'
      + '</button>'
      + '</div>';

    document.getElementById('resultado').innerHTML = html;
    document.getElementById('nuevaLectura').style.display = (!pases || pases.length === 0) ? 'block' : 'none';
    renderCarritoPasesUI();
  }

  function opcionesServicios() {
    if (!serviciosCache.length) return '<option value="">(catálogo no cargado)</option>';
    return serviciosCache.map(s => {
      return '<option value="' + s.codigo + '">' + s.nombre + ' - $' + formatearNumero(s.precio) + '</option>';
    }).join('');
  }

  function agregarAlCarritoPases() {
    const codigo = document.getElementById('selectServicio').value;
    const cantidad = parseInt(document.getElementById('cantPases').value, 10);

    if (!codigo || isNaN(cantidad) || cantidad <= 0) return;

    const servicio = serviciosCache.find(s => s.codigo === codigo);
    if (!servicio) return;

    const existente = carritoPases.find(item => item.codigo === codigo);
    if (existente) {
      existente.cantidad += cantidad;
    } else {
      carritoPases.push({
        codigo: servicio.codigo,
        nombre: servicio.nombre,
        precio: Number(servicio.precio) || 0,
        categoriaFinanzas: servicio.categoriaFinanzas || 'Tienda',
        cantidad: cantidad
      });
    }

    document.getElementById('cantPases').value = 1;
    renderCarritoPasesUI();
  }

  function eliminarDelCarritoPases(index) {
    carritoPases.splice(index, 1);
    renderCarritoPasesUI();
  }

  function renderCarritoPasesUI() {
    const container = document.getElementById('boxCarritoPases');
    const btnConfirmar = document.getElementById('btnConfirmarPases');
    if (!container) return;

    if (carritoPases.length === 0) {
      container.innerHTML = '<p style="font-size:10.5px; color:#888; margin:6px 0; text-align:center;">Carrito vacío.</p>';
      if (btnConfirmar) {
        btnConfirmar.disabled = true;
        btnConfirmar.textContent = 'Confirmar compra';
      }
      return;
    }

    let html = '<div class="carrito-box">';
    let total = 0;

    carritoPases.forEach((item, idx) => {
      const subtotal = item.precio * item.cantidad;
      total += subtotal;
      html += '<div class="carrito-item">'
        + '<div><strong>' + item.nombre + '</strong> x' + item.cantidad + '</div>'
        + '<div style="display:flex; align-items:center; gap:4px;">'
        + '<span>$' + formatearNumero(subtotal) + '</span>'
        + '<button class="btn-eliminar-item" onclick="eliminarDelCarritoPases(' + idx + ')">✕</button>'
        + '</div></div>';
    });

    html += '<div style="display:flex; justify-content:space-between; font-weight:700; font-size:11px; margin-top:4px; padding-top:4px; border-top:1px solid #ddd;">'
      + '<span>TOTAL</span><span>$' + formatearNumero(total) + '</span></div></div>';

    container.innerHTML = html;
    if (btnConfirmar) {
      btnConfirmar.disabled = false;
      btnConfirmar.textContent = 'Confirmar ($' + formatearNumero(total) + ')';
    }
  }

  async function procesarCarritoPases(idCliente, nombre, apellido, staff, boton) {
    if (carritoPases.length === 0 || boton.disabled) return;

    const medioPago = document.getElementById('selectMedioPago').value;
    boton.disabled = true;
    boton.style.pointerEvents = 'none';
    boton.textContent = 'Procesando...';

    let totalVenta = 0;
    let nombresPases = [];
    let errores = 0;
    let categoriaFinanzas = carritoPases[0].categoriaFinanzas || 'Tienda';

    for (let item of carritoPases) {
      for (let i = 0; i < item.cantidad; i++) {
        try {
          const resp = await llamarApi('cargarPase', { idCliente: idCliente, codigoServicio: item.codigo }, true);
          if (resp && resp.ok) {
            totalVenta += item.precio;
          } else {
            errores++;
          }
        } catch (e) {
          errores++;
        }
      }
      nombresPases.push(item.nombre + (item.cantidad > 1 ? ' x' + item.cantidad : ''));
    }

    let mensajeFinal = '✅ Pases cargados.';

    if (totalVenta > 0) {
      const detalleVenta = 'Venta pases: ' + nombresPases.join(' | ') + ' - ' + nombre + ' ' + apellido + ' (' + idCliente + ')';
      
      const okFinanzas = await registrarMovimientoFinanzasAutomatico_(
        totalVenta,
        detalleVenta,
        medioPago,
        staff,
        categoriaFinanzas
      );

      if (okFinanzas) {
        mensajeFinal += ' — Finanzas registrado correctamente ($' + formatearNumero(totalVenta) + ').';
      } else {
        mensajeFinal += ' — ⚠️ No se pudo registrar Finanzas.';
      }
    }

    if (errores > 0) {
      mensajeFinal += ' ⚠️ ' + errores + ' pase(s) fallaron al crearse.';
    }

    carritoPases = [];
    const msgOk = document.getElementById('mensajeOk');
    msgOk.style.display = 'block';
    msgOk.textContent = mensajeFinal;

    cargarDetalleCheckin(idCliente, staff);
  }

  function registrarMovimientoFinanzasAutomatico_(montoTotal, detalleVenta, medioPago, responsable, categoria) {
    return new Promise(resolve => {
      try {
        const datosMovimiento = {
          tipo: 'Ingreso',
          categoria: categoria || 'Tienda',
          medioPago: medioPago,
          monto: Number(montoTotal),
          descripcion: detalleVenta,
          comprobante: '',
          responsable: responsable
        };

        const iframeName = 'iframe_finanzas_' + Date.now();
        const iframe = document.createElement('iframe');
        iframe.name = iframeName;
        iframe.style.display = 'none';
        document.body.appendChild(iframe);

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = API_URL_FINANZAS;
        form.target = iframeName;

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'postData';
        input.value = JSON.stringify({
          action: 'registrarMovimiento',
          payload: datosMovimiento
        });
        form.appendChild(input);

        document.body.appendChild(form);
        form.submit();

        setTimeout(() => {
          try {
            document.body.removeChild(form);
            document.body.removeChild(iframe);
          } catch (e) {}
          resolve(true);
        }, 1800);

      } catch (err) {
        console.error('Error al registrar en Finanzas:', err);
        resolve(false);
      }
    });
  }

  function anularCheckin(idCheckin, idCliente, staff, boton) {
    if (boton.disabled) return;
    boton.disabled = true;
    boton.textContent = 'Anulando...';

    llamarApi('anularCheckin', { idCheckin: idCheckin, staff: staff }, true)
      .then(resp => {
        if (!resp.ok) throw new Error(resp.error);
        return llamarApi('buscarClienteYPases', { idCliente: idCliente });
      })
      .then(resp2 => {
        if (resp2 && resp2.ok && resp2.data.cliente) {
          renderPases(resp2.data.cliente, resp2.data.pases, resp2.data.checkinsHoy, staff);
        }
      })
      .catch(err => {
        boton.disabled = false;
        boton.textContent = 'Anular';
        mostrarError(err);
      });
  }

  function confirmar(idCliente, idPase, staff, boton) {
    if (boton.disabled) return;
    boton.disabled = true;
    boton.style.pointerEvents = 'none';
    boton.textContent = 'Procesando...';

    llamarApi('checkin', { idCliente: idCliente, idPase: idPase, validadoPor: staff }, true)
      .then(resp => {
        if (!resp.ok) throw new Error(resp.error);
        boton.textContent = '✅ Confirmado';
        boton.style.background = '#1e824c';
        const mensaje = document.getElementById('mensajeOk');
        mensaje.style.display = 'block';
        mensaje.textContent = '✅ Ingreso registrado. Quedan ' + resp.data.usosRestantes + ' uso(s).';
        mensaje.scrollIntoView({ behavior: 'smooth', block: 'center' });
        document.getElementById('nuevaLectura').style.display = 'block';
      })
      .catch(err => {
        boton.disabled = false;
        boton.style.pointerEvents = 'auto';
        boton.textContent = 'Confirmar ingreso';
        mostrarError(err);
      });
  }

  function mostrarError(err) {
    document.getElementById('resultado').innerHTML =
      '<div id="sinPases">Error: ' + err.message + '</div>';
    document.getElementById('nuevaLectura').style.display = 'block';
  }

  function reiniciar() {
    document.getElementById('idManual').value = '';
    document.getElementById('resultado').innerHTML = '';
    document.getElementById('mensajeOk').style.display = 'none';
    document.getElementById('nuevaLectura').style.display = 'none';
    carritoPases = [];
    escaneando = true;
    if (scanner) scanner.resume();
  }

  function formatearNumero(numero) {
    return Number(numero || 0).toLocaleString('es-CL');
  }

  // Evento ENTER para el buscador manual
  document.getElementById('idManual').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') buscarManual();
  });

  cargarCatalogo();
  cargarStaff();
  iniciarScanner();
</script>
  
</body>
</html>
