<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ideas para mejorar Ironwall</title>

<style>

* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  max-width: 600px;
  margin: auto;
  padding: 20px;
  background: #f8f8f8;
  color: #222;
}

.btnHome {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 18px;
  background: #fff;
  text-decoration: none;
  color: #222;
  border-radius: 12px;
  box-shadow: 0 3px 12px rgba(0,0,0,.12);
  font-weight: 600;
  font-size: 14px;
}

/* CONTENEDOR HORIZONTAL (LOGO A LA IZQ, TEXTO A LA DER) */
.encabezado {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  margin: 20px 0 25px 0;
}

.logo {
  width: 90px;
  height: auto;
  display: block;
  margin: 0;
  object-fit: contain;
}

.textoEncabezado {
  text-align: left;
}

h1 {
  text-align: left;
  margin: 0 0 4px 0;
  font-size: 20px;
  font-weight: 700;
}

.sub {
  text-align: left;
  color: #666;
  margin: 0;
  font-size: 13px;
  line-height: 1.3;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

label {
  display: block;
  margin-top: 15px;
  margin-bottom: 6px;
  font-weight: 600;
}

select,
textarea,
input {
  width: 100%;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 15px;
}

textarea {
  min-height: 140px;
  resize: vertical;
}

button {
  margin-top: 25px;
  width: 100%;
  padding: 14px;
  background: #1565C0;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #0d47a1;
}

#mensaje {
  margin-top: 18px;
  text-align: center;
  font-weight: bold;
}

.ok {
  color: #1e824c;
}

.error {
  color: #c0392b;
}

</style>

</head>

<body>

<a href="portalcliente.html" class="btnHome">
  🏠 Home
</a>

<!-- ENCABEZADO AGRUPADO -->
<div class="encabezado">
  <img src="img/logo.png" class="logo" alt="Logo Ironwall">
  <div class="textoEncabezado">
    <h1>💡 Ideas para mejorar Ironwall</h1>
    <p class="sub">Tu opinión nos ayuda a seguir creciendo.</p>
  </div>
</div>

<div class="card">

<label>Categoría</label>
<select id="categoria">
  <option value="">Seleccione...</option>
  <option>💡 Idea de mejora</option>
  <option>🧗 Experiencia de escalada</option>
  <option>🏋 Equipamiento</option>
  <option>🧹 Limpieza</option>
  <option>😊 Atención del personal</option>
  <option>⚠ Problema encontrado</option>
  <option>❤️ Felicitaciones</option>
  <option>📦 Otro</option>
</select>

<label>Prioridad</label>
<select id="prioridad">
  <option>Normal</option>
  <option>Importante</option>
  <option>Urgente</option>
</select>

<label>Comentario</label>
<textarea id="comentario" placeholder="Cuéntanos con el mayor detalle posible..."></textarea>

<label>Nombre (opcional)</label>
<input type="text" id="nombre" placeholder="Nombre">

<button type="button" onclick="enviarFeedback()">
  Enviar comentario
</button>

<div id="mensaje"></div>

</div>

<script>

const API_URL="https://script.google.com/macros/s/AKfycbzgTpnOQzlvROwFPSiptTHvki4aaJDel03SIXNHdYZmQP4wKzQzqz2N6uP5Xup6XnPtMQ/exec";

function llamarAPI(action,payload={}){
  return fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"text/plain;charset=utf-8"
    },
    body:JSON.stringify({
      action:action,
      payload:payload
    })
  })
  .then(r=>r.json());
}

function enviarFeedback(){
  const categoria=document.getElementById("categoria").value;
  const prioridad=document.getElementById("prioridad").value;
  const comentario=document.getElementById("comentario").value.trim();
  const nombre=document.getElementById("nombre").value.trim();

  const mensaje=document.getElementById("mensaje");

  mensaje.innerHTML="";
  mensaje.className="";

  if(categoria==""){
    mensaje.className="error";
    mensaje.innerHTML="Selecciona una categoría.";
    return;
  }

  if(comentario==""){
    mensaje.className="error";
    mensaje.innerHTML="Debes escribir un comentario.";
    return;
  }

  llamarAPI("guardarFeedback",{
    categoria:categoria,
    prioridad:prioridad,
    nombre:nombre,
    comentario:comentario
  })
  .then(function(res){
    if(res.ok){
      mensaje.className="ok";
      mensaje.innerHTML="✅ Muchas gracias. Tu comentario fue enviado.";
      document.getElementById("categoria").value="";
      document.getElementById("prioridad").value="Normal";
      document.getElementById("comentario").value="";
      document.getElementById("nombre").value="";
    }else{
      mensaje.className="error";
      mensaje.innerHTML=res.error;
    }
  })
  .catch(function(){
    mensaje.className="error";
    mensaje.innerHTML="No fue posible enviar el comentario.";
  });
}

</script>

</body>

</html>
