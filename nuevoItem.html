<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agregar Nuevo Ítem | Ironwall Stock</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      background: #fafafa;
      color: #222;
    }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p.sub { color: #666; margin-top: 0; margin-bottom: 24px; font-size: 14px; }
    
    .form-group { margin-bottom: 16px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }

    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: #222;
      outline: none;
    }
    input:focus, select:focus {
      border-color: #1a1a1a;
    }

    /* Transición suave para secciones dinámicas */
    .seccion-dinamica {
      display: none;
      border-top: 1px dashed #ddd;
      padding-top: 16px;
      margin-top: 16px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: #1a1a1a;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #333; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .btnHome {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ffffff;
      color: #222;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      box-shadow: 0 3px 12px rgba(0,0,0,.12);
      transition: .2s;
      margin-bottom: 20px;
    }
    .btnHome:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,0,0,.15);
    }
  </style>
</head>
<body>

  <a href="hubInventario.html" class="btnHome">
    ⬅️ Volver
  </a>

  <div id="formulario">
    <h1>📦 Agregar Nuevo Ítem</h1>
    <p class="sub">Ingresa la información básica. Las categorías financieras se asignan automáticamente.</p>

    <!-- 1. Categoría Principal -->
    <div class="form-group">
      <label>Categoría del Producto *</label>
      <select id="categoria" required onchange="evaluarCategoria()">
        <option value="" disabled selected>-- Selecciona una categoría --</option>
        <option value="Escalada">Escalada</option>
        <option value="Accesorios de escalada">Accesorios de escalada</option>
        <option value="Hidratacion">Hidratación</option>
        <option value="Barras">Barras</option>
        <option value="Dulces">Dulces</option>
        <option value="Cafe">Café</option>
        <option value="Arriendo">Arriendo</option>
        <option value="Presa">Presa</option>
        <option value="Herramienta">Herramienta</option>
      </select>
    </div>

    <!-- 2. Nombre del Ítem -->
    <div class="form-group">
      <label>Nombre del Ítem / Modelo *</label>
      <input type="text" id="nombre" placeholder="Ej: Magnesio 250g o Crimp Trough XL" required>
    </div>

    <!-- 3. Proveedor / Marca -->
    <div class="form-group">
      <label>Proveedor / Marca</label>
      <input type="text" id="proveedor" placeholder="Ej: Black Diamond, Cheeta, Petzl">
    </div>

    <!-- 4. Cantidad Inicial -->
    <div class="form-group">
      <label>Cantidad Inicial *</label>
      <input type="number" id="cantidad" min="1" value="1" required>
    </div>

    <!-- 5. Campo Dinámico: Solo si es Venta / Arriendo (Tienda) -->
    <div id="bloquePrecio" class="seccion-dinamica">
      <div class="form-group">
        <label>Precio de Venta ($) *</label>
        <input type="number" id="precioVenta" placeholder="Ej: 8900" min="0">
      </div>
    </div>

    <button id="btnGuardar" onclick="guardarItem()">Guardar Ítem</button>
  </div>

  <script>
    const API_URL_INVENTARIO = 'https://script.google.com/macros/s/AKfycbxZyZAGtj2ifZ9lmhwX__tTVdydaYManjO2_Ff_ScIYtV5vpsFkQHzzKaX7ADcVXOysSw/exec';

    // Lista de categorías que pertenecen a Equipamiento
    const CATEGORIAS_EQUIPAMIENTO = ['Presa', 'Herramienta'];

    function evaluarCategoria() {
      const categoria = document.getElementById('categoria').value;
      const bloquePrecio = document.getElementById('bloquePrecio');
      const inputPrecio = document.getElementById('precioVenta');

      // Si es Presa o Herramienta, Oculta el Precio de Venta
      if (CATEGORIAS_EQUIPAMIENTO.includes(categoria)) {
        bloquePrecio.style.display = 'none';
        inputPrecio.removeAttribute('required');
        inputPrecio.value = '';
      } else {
        // Si es cualquiera de Tienda / Arriendo, Muestra el Precio
        bloquePrecio.style.display = 'block';
        inputPrecio.setAttribute('required', 'true');
      }
    }

    function guardarItem() {
      const categoria = document.getElementById('categoria').value;
      const nombre = document.getElementById('nombre').value.trim();
      const cantidad = parseInt(document.getElementById('cantidad').value) || 0;
      const precioVentaInput = document.getElementById('precioVenta').value;
      const btn = document.getElementById('btnGuardar');

      // Validaciones en pantalla
      if (!categoria) {
        alert('Por favor selecciona una categoría.');
        return;
      }
      if (!nombre) {
        alert('Por favor ingresa el nombre del ítem.');
        return;
      }
      if (cantidad <= 0) {
        alert('Ingresa una cantidad inicial válida.');
        return;
      }

      const esEquipamiento = CATEGORIAS_EQUIPAMIENTO.includes(categoria);

      if (!esEquipamiento && (!precioVentaInput || parseFloat(precioVentaInput) < 0)) {
        alert('Ingresa un precio de venta válido.');
        return;
      }

      // Reglas automáticas en segundo plano
      const categoriaFinanzas = esEquipamiento ? 'Equipamiento' : 'Tienda';
      const categoriaCompraFinanzas = esEquipamiento ? 'Equipamiento' : 'Insumos';
      const precioVenta = esEquipamiento ? 0 : parseFloat(precioVentaInput);

      // Objeto formateado según las columnas de la Google Sheet
      const itemData = {
        Codigo: "ITEM-" + Date.now(),
        Nombre: nombre,
        Categoria: categoria,
        Proveedor: document.getElementById('proveedor').value.trim() || 'Sin Especificar',
        PrecioVenta: precioVenta,
        CostoUnitario: 0,
        StockActual: cantidad,
        StockMinimo: 2,
        Activo: true,
        CategoriaFinanzas: categoriaFinanzas,
        CategoriaCompraFinanzas: categoriaCompraFinanzas
      };

      btn.disabled = true;
      btn.textContent = 'Guardando...';

      // Envío a Google Apps Script / Drive
      fetch(API_URL_INVENTARIO, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'agregarNuevoItem', payload: itemData })
      })
      .then(r => r.json())
      .then(resp => {
        if (resp.ok) {
          alert('¡Ítem registrado con éxito!');
          window.location.href = 'hubInventario.html';
        } else {
          throw new Error(resp.error || 'Error al guardar el ítem');
        }
      })
      .catch(err => {
        alert('Ocurrió un error: ' + err.message);
      })
      .finally(() => {
        btn.disabled = false;
        btn.textContent = 'Guardar Ítem';
      });
    }
  </script>
</body>
</html>
