<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador QR - Ironwall</title>
    <!-- Cargamos la librería qrcode.js -->
    <script src="https://cloudflare.com"></script>
    <style>
        body { margin: 0; padding: 40px 20px; background: #ffffff; text-align: center; font-family: Arial, sans-serif; }
        .contenedor { display: inline-block; background: #ffffff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 1px solid #eee; }
        #qrcode { display: block; margin: 0 auto; width: 220px; height: 220px; }
        #qrcode img { display: block; width: 220px; height: 220px; }
        h2 { font-size: 20px; margin: 15px 0 5px 0; letter-spacing: 2px; color: #1a1a1a; }
        p { font-size: 13px; color: #666; margin: 0; }
    </style>
</head>
<body>

    <div class="contenedor">
        <!-- El div debe declararse primero en el documento -->
        <div id="qrcode"></div>
        <h2 id="textoCodigo">---</h2>
        <p>Aproxima este código al lector para ingresar</p>
    </div>

    <script>
        // Forzamos a que el código espere a que la página renderice por completo antes de actuar
        window.onload = function() {
            // Captura el idCliente desde la URL
            const urlParams = new URLSearchParams(window.location.search);
            const idCliente = urlParams.get('id');

            if (idCliente) {
                const codigoLimpio = idCliente.trim();
                
                // Mostramos el texto del ID abajo del código QR
                document.getElementById("textoCodigo").innerText = codigoLimpio;

                // Inicializamos la generación del QR de forma segura
                new QRCode(document.getElementById("qrcode"), {
                    text: codigoLimpio,
                    width: 220,
                    height: 220,
                    correctLevel: QRCode.CorrectLevel.H
                });
            } else {
                document.getElementById("textoCodigo").innerText = "ID no válido";
            }
        };
    </script>

</body>
</html>
