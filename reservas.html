<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ironwall Reservas</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 24px 16px 60px; background: #fafafa; color: #222; }
    h1 { font-size: 22px; margin-bottom: 4px; }
    p.sub { color: #666; margin-top: 0; margin-bottom: 14px; font-size: 14px; }
    label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 4px; }
    input, select { width: 100%; padding: 12px; font-size: 13px; border: 1px solid #ccc; border-radius: 8px; background: #fff; }

    /* Tarjeta de Disponibilidad / Estado */
    .resumen-stock { background: #fff8f8; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 12px; margin-bottom: 16px; transition: background 0.3s, border-color 0.3s; }
    .resumen-stock.ok { background: #f0fdf4; border-color: #bbf7d0; }
    .resumen-header { font-size: 12px; font-weight: 700; color: #991b1b; margin-bottom: 6px; }
    .resumen-stock.ok .resumen-header { color: #166534; }
    .resumen-lista { display: flex; flex-wrap: wrap; gap: 6px; }
    
    /* Chips Informativos */
    .chip-stock { display: inline-flex; align-items: center; gap: 6px; background: #ffffff; border: 1px solid #fca5a5; border-radius: 16px; padding: 4px 10px; font-size: 12px; }
    .resumen-stock.ok .chip-stock { border-color: #86efac; }
    .chip-nombre { color: #374151; font-weight: 500; }
    .chip-cantidad { background: #ef4444; color: #ffffff; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 10px; }
    .resumen-stock.ok .chip-cantidad { background: #22c55e; }
    .texto-cargando { font-size: 12px; color: #6b7280; }

    /* Grid principal del formulario */
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; align-items: start; }
    .full-width { grid-column: span 2; }
    .form-group { display: flex; flex-direction: column; }
    
    /* Selectores de tipo de reserva */
    .tipo-botones { display: flex; gap: 8px; margin-top: 6px; }
    .tipo-botones button { flex: 1; padding: 12px; border: 2px solid #ccc; border-radius: 8px; background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
    .tipo-botones button.activo-entrada { border-color: #1e824c; background: #e8f6ee; color: #1e824c; }
    .tipo-botones button.activo-clase { border-color: #b8860b; background: #fff8e6; color: #b8860b; }

    /* Botones de acción */
    button.consultar { width: 100%; margin-top: 10px; padding: 12px; font-size: 14px; font-weight: 600; color: #1a1a1a; background: #e5e7eb; border: 1px solid #d1d5db; border-radius: 8px; cursor: pointer; }
    button.consultar:hover { background: #d1d5db; }
    
    button.enviar { width: 100%; margin-top: 20px; padding: 14px; font-size: 15px; font-weight: 600; color: #fff; background: #1a1a1a; border: none; border-radius: 8px; cursor: pointer; }
    button.enviar:disabled { opacity: 0.4; cursor: not-allowed; }
    
    #error { color: #c0392b; font-size: 13px; margin-top: 10px; display: none; font-weight: 600; }
    #ok { color: #1e824c; font-size: 14px; margin-top: 10px; display: none; font-weight: 600; }
    .info-subtexto { font-size: 11px; color: #666; margin-top: 4px; display: block; line-height: 1.2; }

    @media (max-width: 480px) {
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>

  <h1>Ironwall Reservas</h1>
  <p class="sub">Gestión de cupos y confirmación de accesos</p>

  <!-- Tarjeta de estado de cupos -->
  <div id="resumenBox" class="resumen-stock">
    <div id="resumenHeader" class="resumen-header">PASO 1: CONSULTAR PERIODO</div>
    <div id="resumenContenido" class="resumen-lista">
      <span class="texto-cargando">Ingresa fecha y horario, luego presiona "Consultar Cupos".</span>
    </div>
  </div>

  <form id="reservaForm" onsubmit="event.preventDefault(); realizarReserva();">
    <div class="form-grid">

      <!-- PASO 1: SELECCIÓN DE PERIODO -->
      <div class="form-group full-width">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" required>
      </div>

      <div class="form-group">
        <label for="horaInicio">Hora Inicio</label>
        <input type="time" id="horaInicio" value="10:00" required>
      </div>

      <div class="form-group">
        <label for="horaFin">Hora Término</label>
        <input type="time" id="horaFin" value="12:00" required>
      </div>

      <div class="full-width">
        <button type="button" class="consultar" onclick="consultarCupos()">Paso 1: Consultar Cupos Disponibles</button>
      </div>

      <!-- PASO 2: DATOS DE LA RESERVA -->
      <div class="form-group full-width" style="margin-top: 10px;">
        <label>Tipo de Reserva</label>
        <div class="tipo-botones">
          <button type="button" id="btnEntrada" class="activo-entrada" onclick="seleccionarTipo('ENTRADA')">Entrada General</button>
          <button type="button" id="btnClase" onclick="seleccionarTipo('CLASE')">Clase</button>
        </div>
      </div>

      <div class="form-group full-width">
        <label for="clienteId">ID Cliente</label>
        <input type="text" id="clienteId" placeholder="Ej: CLI-001" required>
        <span class="info-subtexto">Código asignado en el sistema de gestión</span>
      </div>

      <div class="form-group full-width">
        <label for="cantidad">Cantidad de Personas</label>
        <input type="number" id="cantidad" value="1" min="1" max="5" required>
      </div>

      <!-- Botón Paso 2 (deshabilitado hasta consultar) -->
      <div class="full-width">
        <button type="submit" id="btnEnviar" class="enviar" disabled>Paso 2: Confirmar Reserva</button>
        <div id="ok"></div>
        <div id="error"></div>
      </div>

    </div>
  </form>

  <script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyZ6EtFkvWKNv7Jh13zQ7OdSqjKqx8kv-erst4DZ4ojLboC_cndDnnZzIRyUxNNVrAJ/exec'; // Reemplaza por tu URL de Apps Script (/exec)
  let tipoSeleccionado = 'ENTRADA';

  document.addEventListener('DOMContentLoaded', () => {
    const hoy = new Date().toISOString().split('T')[0];
    document.getElementById('fecha').value = hoy;
  });

  function seleccionarTipo(tipo) {
    tipoSeleccionado = tipo;
    const btnEntrada = document.getElementById('btnEntrada');
    const btnClase = document.getElementById('btnClase');

    if (tipo === 'ENTRADA') {
      btnEntrada.className = 'activo-entrada';
      btnClase.className = '';
    } else {
      btnEntrada.className = '';
      btnClase.className = 'activo-clase';
    }
  }

  // PASO 1: Consulta utilizando el mismo método POST que funcionó inicialmente
  async function consultarCupos() {
    const fecha = document.getElementById('fecha').value;
    const horaInicio = document.getElementById('horaInicio').value;
    const horaFin = document.getElementById('horaFin').value;
    const box = document.getElementById('resumenBox');
    const header = document.getElementById('resumenHeader');
    const contenido = document.getElementById('resumenContenido');
    const btnEnviar = document.getElementById('btnEnviar');

    if (!fecha || !horaInicio || !horaFin) {
      alert('Por favor selecciona fecha, hora de inicio y término');
      return;
    }

    contenido.innerHTML = '<span class="texto-cargando">Consultando disponibilidad...</span>';
    btnEnviar.disabled = true;

    try {
      // Petición POST exacta como en la prueba inicial exitosa
      const response = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({
          action: 'ocupacion',
          fecha: fecha,
          horaInicio: horaInicio,
          horaFin: horaFin
        })
      });

      const data = await response.json();
      console.log('Respuesta servidor paso 1:', data);

      if (data.ok) {
        const ocupacion = data.ocupacion ?? 0;
        const disponibles = data.disponibles ?? 0;
        const capacidad = data.capacidad ?? 0;

        if (disponibles > 0) {
          box.className = 'resumen-stock ok';
          header.innerText = 'CUPOS DISPONIBLES EN EL PERIODO';
          btnEnviar.disabled = false; // Habilita el Paso 2
        } else {
          box.className = 'resumen-stock';
          header.innerText = 'SIN CUPOS EN EL PERIODO';
          btnEnviar.disabled = true;
        }

        contenido.innerHTML = `
          <div class="chip-stock">
            <span class="chip-nombre">Ocupación</span>
            <span class="chip-cantidad">${ocupacion}</span>
          </div>
          <div class="chip-stock">
            <span class="chip-nombre">Disponibles</span>
            <span class="chip-cantidad">${disponibles}</span>
          </div>
          <div class="chip-stock">
            <span class="chip-nombre">Capacidad</span>
            <span class="chip-cantidad">${capacidad}</span>
          </div>
        `;
      } else {
        box.className = 'resumen-stock';
        header.innerText = 'ERROR EN LA CONSULTA';
        contenido.innerHTML = `<span class="texto-cargando">${data.mensaje || 'Respuesta no válida'}</span>`;
        btnEnviar.disabled = true;
      }
    } catch (err) {
      console.error(err);
      box.className = 'resumen-stock';
      header.innerText = 'ERROR DE CONEXIÓN';
      contenido.innerHTML = '<span class="texto-cargando">No se pudo verificar la disponibilidad.</span>';
      btnEnviar.disabled = true;
    }
  }

  // PASO 2: Confirmación de reserva
  async function realizarReserva() {
    const btn = document.getElementById('btnEnviar');
    const divOk = document.getElementById('ok');
    const divErr = document.getElementById('error');

    divOk.style.display = 'none';
    divErr.style.display = 'none';
    btn.disabled = true;
    btn.innerText = 'Procesando reserva...';

    const payload = {
      action: 'crearReserva',
      clienteId: document.getElementById('clienteId').value,
      tipoReserva: tipoSeleccionado,
      fecha: document.getElementById('fecha').value,
      horaInicio: document.getElementById('horaInicio').value,
      horaFin: document.getElementById('horaFin').value,
      cantidad: Number(document.getElementById('cantidad').value),
      origen: 'WEB'
    };

    try {
      const response = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (data.ok) {
        divOk.innerText = `¡Reserva Exitosa! ID: ${data.reservaId}`;
        divOk.style.display = 'block';
        document.getElementById('clienteId').value = '';
        consultarCupos(); // Actualiza cupos tras reservar
      } else {
        divErr.innerText = 'Error al reservar: ' + (data.mensaje || 'Error desconocido');
        divErr.style.display = 'block';
        btn.disabled = false;
      }
    } catch (err) {
      divErr.innerText = 'Error de conexión con el servidor al registrar.';
      divErr.style.display = 'block';
      btn.disabled = false;
    } finally {
      btn.innerText = 'Paso 2: Confirmar Reserva';
    }
  }
</script>
 
</body>
</html>
