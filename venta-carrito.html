<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva venta - Ironwall</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:800px;margin:0 auto;padding:24px 16px 60px;background:#f7f7f7;color:#222}
    h1{font-size:24px;margin:0 0 4px}
    .sub{color:#666;font-size:14px;margin:0 0 20px}
    label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
    select,input{width:100%;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:8px;background:#fff}
    button{width:100%;padding:12px;border:0;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}

    /* Grilla de 2 columnas fijas para cualquier pantalla */
    .grid-2col{display:grid;grid-template-columns:repeat(2, 1fr);gap:16px;margin-bottom:16px}
    .card{background:#fff;padding:16px;border-radius:10px;border:1px solid #ddd;display:flex;flex-direction:column;justify-content:space-between}

    .btnAgregar{background:#1565C0;color:#fff;margin-top:12px}
    .btnConfirmar{background:#1e824c;color:#fff;font-size:16px}
    .btnConfirmar:disabled{background:#aaa;cursor:not-allowed}

    .item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
    .item:last-child{border-bottom:0}
    .item-nombre{font-weight:600;font-size:14px}
    .item-detalle{color:#666;font-size:12px}
    .btnEliminar{width:auto;padding:4px 8px;background:#fdecea;color:#c0392b;font-size:12px}

    .total{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:2px solid #222;font-size:18px;font-weight:700}
    .vacio{color:#777;text-align:center;padding:15px 0;font-size:14px}
    .stock{margin-top:4px;color:#666;font-size:12px}

    .ok,.error{display:none;margin-top:15px;padding:12px;border-radius:8px;font-size:14px}
    .ok{background:#e8f6ee;color:#1e824c}
    .error{background:#fdecea;color:#c0392b}

    .btnHome{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#222;text-decoration:none;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.12);margin-bottom:15px}
  </style>
</head>
<body>

  <a href="portal.html" class="btnHome">🏠 Home</a>
  <h1>🛒 Nueva venta</h1>
  <p class="sub">Agrega todos los productos y confirma una sola vez.</p>

  <div class="grid-2col">
    <!-- Tarjeta 1 -->
    <div class="card">
      <div>
        <label>Producto</label>
        <select id="producto"><option value="">-- Selecciona un producto --</option></select>
        <div id="stockInfo" class="stock"></div>

        <label style="margin-top:10px;">Cantidad</label>
        <input id="cantidad" type="number" min="1" step="1" value="1">
      </div>
      <button class="btnAgregar" onclick="agregarAlCarrito()">+ Agregar al carrito</button>
    </div>

    <!-- Tarjeta 2 -->
    <div class="card">
      <div>
        <h2 style="font-size:16px; margin-bottom:8px;">Carrito</h2>
        <div id="listaCarrito"><div class="vacio">No hay productos agregados.</div></div>
      </div>
      <div class="total"><span>TOTAL</span><span id="totalVenta">$0</span></div>
    </div>
  </div>

  <div class="grid-2col">
    <!-- Tarjeta 3 -->
    <div class="card">
      <label>Medio de pago</label>
      <select id="medioPago">
        <option value="Efectivo">Efectivo</option>
        <option value="Transferencia">Transferencia</option>
        <option value="Mercado Pago">Mercado Pago</option>
      </select>
    </div>

    <!-- Tarjeta 4 -->
    <div class="card">
      <label>Registrado por</label>
      <select id="responsable"><option value="">-- Selecciona tu nombre --</option></select>
      <button class="btnConfirmar" id="btnConfirmar" onclick="confirmarVenta()" disabled style="margin-top:12px;">Confirmar venta</button>
    </div>
  </div>

  <div id="ok" class="ok"></div>
  <div id="error" class="error"></div>

  <script>
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyCj_f6I1-W92i1R90N6n9q6c9A6i0-rP3V4I23L0I/exec';
    let productosData = [];
    let carrito = [];

    async function cargarDatos() {
      try {
        const res = await fetch(SCRIPT_URL + '?action=getInitialData');
        const data = await res.json();

        productosData = data.productos || [];
        const selectProd = document.getElementById('producto');
        selectProd.innerHTML = '<option value="">-- Selecciona un producto --</option>';
        productosData.forEach(p => {
          selectProd.innerHTML += `<option value="${p.id}">${p.nombre} - $${p.precio.toLocaleString()}</option>`;
        });

        const selectResp = document.getElementById('responsable');
        selectResp.innerHTML = '<option value="">-- Selecciona tu nombre --</option>';
        (data.vendedores || []).forEach(v => {
          selectResp.innerHTML += `<option value="${v}">${v}</option>`;
        });
      } catch (e) {
        console.error('Error cargando datos:', e);
      }
    }

    document.getElementById('producto').addEventListener('change', function() {
      const prod = productosData.find(p => p.id == this.value);
      const stockDiv = document.getElementById('stockInfo');
      if (prod) {
        stockDiv.textContent = `Stock disponible: ${prod.stock}`;
      } else {
        stockDiv.textContent = '';
      }
    });

    function agregarAlCarrito() {
      const prodId = document.getElementById('producto').value;
      const cant = parseInt(document.getElementById('cantidad').value);
      if (!prodId || cant <= 0) return;

      const prod = productosData.find(p => p.id == prodId);
      if (!prod) return;

      const itemExistente = carrito.find(item => item.id == prodId);
      const cantActual = itemExistente ? itemExistente.cantidad : 0;

      if (cantActual + cant > prod.stock) {
        alert(`No hay suficiente stock. Disponible: ${prod.stock}`);
        return;
      }

      if (itemExistente) {
        itemExistente.cantidad += cant;
      } else {
        carrito.push({
          id: prod.id,
          nombre: prod.nombre,
          precio: prod.precio,
          cantidad: cant
        });
      }

      actualizarCarrito();
    }

    function eliminarDelCarrito(index) {
      carrito.splice(index, 1);
      actualizarCarrito();
    }

    function actualizarCarrito() {
      const lista = document.getElementById('listaCarrito');
      const totalSpan = document.getElementById('totalVenta');
      const btnConfirmar = document.getElementById('btnConfirmar');

      if (carrito.length === 0) {
        lista.innerHTML = '<div class="vacio">No hay productos agregados.</div>';
        totalSpan.textContent = '$0';
        btnConfirmar.disabled = true;
        return;
      }

      let html = '';
      let total = 0;

      carrito.forEach((item, index) => {
        const subtotal = item.precio * item.cantidad;
        total += subtotal;
        html += `
          <div class="item">
            <div>
              <div class="item-nombre">${item.nombre}</div>
              <div class="item-detalle">${item.cantidad} x $${item.precio.toLocaleString()} = $${subtotal.toLocaleString()}</div>
            </div>
            <button class="btnEliminar" onclick="eliminarDelCarrito(${index})">X</button>
          </div>
        `;
      });

      lista.innerHTML = html;
      totalSpan.textContent = `$${total.toLocaleString()}`;
      btnConfirmar.disabled = false;
    }

    async function confirmarVenta() {
      const responsable = document.getElementById('responsable').value;
      const medioPago = document.getElementById('medioPago').value;
      const okDiv = document.getElementById('ok');
      const errorDiv = document.getElementById('error');
      const btnConfirmar = document.getElementById('btnConfirmar');

      if (!responsable) {
        alert('Por favor selecciona quién registra la venta.');
        return;
      }

      btnConfirmar.disabled = true;
      btnConfirmar.textContent = 'Procesando...';
      okDiv.style.display = 'none';
      errorDiv.style.display = 'none';

      try {
        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'registrarVenta',
            carrito: carrito,
            responsable: responsable,
            medioPago: medioPago
          })
        });

        const result = await res.json();
        if (result.status === 'success') {
          okDiv.textContent = '¡Venta registrada con éxito!';
          okDiv.style.display = 'block';
          carrito = [];
          actualizarCarrito();
          cargarDatos();
        } else {
          throw new Error(result.message || 'Error al procesar la venta');
        }
      } catch (e) {
        errorDiv.textContent = 'Ocurrió un error: ' + e.message;
        errorDiv.style.display = 'block';
      } finally {
        btnConfirmar.textContent = 'Confirmar venta';
      }
    }

    window.onload = cargarDatos;
  </script>
</body>
</html>
