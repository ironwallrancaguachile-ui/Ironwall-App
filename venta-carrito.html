<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nueva venta - Ironwall</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;max-width:800px;margin:0 auto;padding:24px 16px 60px;background:#f7f7f7;color:#222}
    h1{font-size:24px;margin:0 0 4px}
    .sub{color:#666;font-size:14px;margin:0 0 20px}
    label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
    select,input{width:100%;padding:10px;font-size:15px;border:1px solid #ccc;border-radius:8px;background:#fff}
    button{width:100%;padding:12px;border:0;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer}
    
    /* Disposición de 2 columnas fijas */
    .grid-2col{display:grid;grid-template-columns:repeat(2, 1fr);gap:16px;margin-bottom:16px}
    .card{background:#fff;padding:16px;border-radius:10px;border:1px solid #ddd;display:flex;flex-direction:column;justify-content:space-between}
    
    .btnAgregar{background:#1565C0;color:#fff;margin-top:12px}
    .btnConfirmar{background:#1e824c;color:#fff;font-size:16px}
    .btnConfirmar:disabled{background:#aaa;cursor:not-allowed}
    
    .item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #eee}
    .item:last-child{border-bottom:0}
    .item-nombre{font-weight:600;font-size:14px}
    .item-detalle{color:#666;font-size:12px}
    .btnEliminar{width:auto;padding:4px 8px;background:#fdecea;color:#c0392b;font-size:12px}
    
    .total{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:2px solid #222;font-size:18px;font-weight:700}
    .vacio{color:#777;text-align:center;padding:15px 0;font-size:14px}
    .stock{margin-top:4px;color:#666;font-size:12px}
    
    .ok,.error{display:none;margin-top:15px;padding:12px;border-radius:8px;font-size:14px}
    .ok{background:#e8f6ee;color:#1e824c}
    .error{background:#fdecea;color:#c0392b}
    
    .btnHome{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#222;text-decoration:none;padding:8px 16px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:0 3px 12px rgba(0,0,0,.12);margin-bottom:15px}
  </style>
</head>
<body>

  <a href="portal.html" class="btnHome">🏠 Home</a>
  <h1>🛒 Nueva venta</h1>
  <p class="sub">Agrega todos los productos y confirma una sola vez.</p>

  <div class="grid-2col">
    <!-- Tarjeta 1: Selección de producto -->
    <div class="card">
      <div>
        <label>Producto</label>
        <select id="producto"><option value="">-- Selecciona un producto --</option></select>
        <div id="stockInfo" class="stock"></div>
        
        <label>Cantidad</label>
        <input id="cantidad" type="number" min="1" step="1" value="1">
      </div>
      <button class="btnAgregar" onclick="agregarAlCarrito()">+ Agregar al carrito</button>
    </div>

    <!-- Tarjeta 2: Carrito -->
    <div class="card">
      <h2 style="font-size:16px; margin-bottom:8px;">Carrito</h2>
      <div id="listaCarrito"><div class="vacio">No hay productos agregados.</div></div>
      <div class="total"><span>TOTAL</span><span id="totalVenta">$0</span></div>
    </div>
  </div>

  <div class="grid-2col">
    <!-- Tarjeta 3: Medio de pago -->
    <div class="card">
      <label>Medio de pago</label>
      <select id="medioPago">
        <option value="Efectivo">Efectivo</option>
        <option value="Transferencia">Transferencia</option>
        <option value="Mercado Pago">Mercado Pago</option>
      </select>
    </div>

    <!-- Tarjeta 4: Registro y Confirmación -->
    <div class="card">
      <label>Registrado por</label>
      <select id="responsable"><option value="">-- Selecciona tu nombre --</option></select>
      <button class="btnConfirmar" id="btnConfirmar" onclick="confirmarVenta()" disabled style="margin-top:12px;">Confirmar venta</button>
    </div>
  </div>

  <div id="ok" class="ok"></div>
  <div id="error" class="error"></div>

  <!-- Mantén tus funciones JavaScript de lógica intactas aquí abajo -->
  <script>
    // Tu JS original permanece sin cambios...
  </script>
</body>
</html>
